// First-time setup: size the map to the container and build it.
function resize() {
    let rect = container.getBoundingClientRect();
    G.w = rect.width; G.h = rect.height;
    let minDim = Math.min(G.w, G.h);
    G.hexR = Math.max(14, Math.floor(minDim / 22)); 
    if(G.hexR > 35) G.hexR = 35;
    initGrid();
    fitView();
}

// Keep the existing map and scale/centre it to the current container size.
function fitView() {
    let rect = container.getBoundingClientRect();
    if(!rect.width || !rect.height || !G.w || !G.h) return;
    canvas.width = rect.width; canvas.height = rect.height;
    let s = Math.min(rect.width/G.w, rect.height/G.h);
    if(!isFinite(s) || s <= 0) s = 1;
    let ox = (rect.width - G.w*s)/2;
    let oy = (rect.height - G.h*s)/2;
    if(!isFinite(ox)) ox = 0;
    if(!isFinite(oy)) oy = 0;
    G.view = { s, ox, oy };
    closeMenu();
}
window.addEventListener('resize', () => { if(G.grid.length) { fitView(); pauseRedrawNeeded = true; draw(); } });

function canBuildOn(hex) {
    return hex && !hex.occ && hex.type === 'floor' && !hex.wall && hex !== G.start && hex !== G.end && !hex.tower;
}

function initGrid() {
    let validMap = false;
    let attempts = 0;
    while(!validMap && attempts++ < 150) {
        G.grid = [];
        G.warpIn = null;
        G.warpOut = null;
        const w = G.hexR * Math.sqrt(3); const h = G.hexR * 2; const vDist = h * 0.75;
        // Fit whole hexes: odd rows are shifted right by w/2, so total width = cols*w + w/2;
        // total height = (rows-1)*vDist + h.
        const cols = Math.floor((G.w - w/2) / w); const rows = Math.floor((G.h - h) / vDist) + 1;
        const offX = (G.w - (cols*w + w/2))/2 + w/2; const offY = (G.h - ((rows-1)*vDist + h))/2 + h/2;
        let floorTiles = [];
        for(let r=0; r<rows; r++) {
            for(let q=0; q<cols; q++) {
                let cx = offX + q * w + (r%2 ? w/2 : 0); let cy = offY + r * vDist;
                // Outer wall: first/last row and first/last cell of every row -> sealed on all 4 sides
                let isWall = (r === 0 || r === rows-1 || q === 0 || q === cols-1);
                let isObstacle = isWall || (Math.random() < 0.08); // slightly lower rock rate to allow special obstacles
                let cell = { q, r, x:cx, y:cy, occ: isObstacle, type: isWall ? 'wall' : (isObstacle ? 'obs' : 'floor'), wall: isWall, id: r*1000+q };
                G.grid.push(cell); if(!isObstacle) floorTiles.push(cell);
            }
        }
        G.grid.forEach(c => c.nb = G.grid.filter(n => n!==c && dist(c,n) < G.hexR*2.1)); // neighbour cache
        let minD = G.w*0.45; let tries=0;
        do {
            G.start = floorTiles[Math.floor(Math.random()*floorTiles.length)];
            G.end = floorTiles[Math.floor(Math.random()*floorTiles.length)];
            tries++;
        } while(dist(G.start,G.end) < minD && tries<100);
        
        G.start.occ=false; G.start.type='floor'; G.end.occ=false; G.end.type='floor';
        // Clear obstacles around start/end, but never outer boundary
        getNeighbors(G.start).forEach(n=>{ if(!n.wall) { n.occ=false; n.type='floor'; } });
        getNeighbors(G.end).forEach(n=>{ if(!n.wall) { n.occ=false; n.type='floor'; } });

        // Select candidates for tactical obstacles (must be open floor away from start/end)
        let candidates = floorTiles.filter(c => c !== G.start && c !== G.end && !getNeighbors(G.start).includes(c) && !getNeighbors(G.end).includes(c) && !c.wall);

        // 1. Transmit Points (Warp Gate: warp_in & warp_out)
        if(candidates.length >= 10) {
            let pTries = 0, pIn = null, pOut = null;
            while(pTries++ < 60 && (!pIn || !pOut)) {
                let c1 = candidates[Math.floor(Math.random() * candidates.length)];
                let c2 = candidates[Math.floor(Math.random() * candidates.length)];
                if(c1 !== c2 && dist(c1, c2) >= G.w * 0.35 && dist(c1, G.end) > G.hexR * 2.5 && dist(c2, G.start) > G.hexR * 2.5) {
                    let c1Walkable = getNeighbors(c1).filter(n => !n.wall && !n.occ).length;
                    let c2Walkable = getNeighbors(c2).filter(n => !n.wall && !n.occ).length;
                    if(c1Walkable >= 2 && c2Walkable >= 2) {
                        pIn = c1; pOut = c2;
                    }
                }
            }
            if(pIn && pOut) {
                G.warpIn = pIn; G.warpIn.type = 'warp_in'; G.warpIn.occ = false;
                G.warpOut = pOut; G.warpOut.type = 'warp_out'; G.warpOut.occ = false;
                candidates = candidates.filter(c => c !== pIn && c !== pOut);
            }
        }

        // 2. Speed Up Pads (2 pads)
        for(let i = 0; i < 2 && candidates.length > 0; i++) {
            let idx = Math.floor(Math.random() * candidates.length);
            let c = candidates.splice(idx, 1)[0];
            c.type = 'speed_pad';
        }

        // 3. Slow Down / Graviton Pads (2 pads)
        for(let i = 0; i < 2 && candidates.length > 0; i++) {
            let idx = Math.floor(Math.random() * candidates.length);
            let c = candidates.splice(idx, 1)[0];
            c.type = 'slow_pad';
        }

        // 4. Single Way Conduits (2 one-way directional conduits)
        for(let i = 0; i < 2 && candidates.length > 0; i++) {
            let validCandidates = candidates.filter(c => {
                let walkableNeighbors = getNeighbors(c).filter(n => !n.wall && n.type !== 'obs' && !n.occ);
                return walkableNeighbors.length >= 2;
            });
            if(validCandidates.length > 0) {
                let c = validCandidates[Math.floor(Math.random() * validCandidates.length)];
                candidates = candidates.filter(cand => cand !== c);
                let walkableNeighbors = getNeighbors(c).filter(n => !n.wall && n.type !== 'obs' && !n.occ);
                let targetN = walkableNeighbors[Math.floor(Math.random() * walkableNeighbors.length)];
                c.type = 'oneway';
                c.onewayTarget = targetN;
                c.dirAngle = Math.atan2(targetN.y - c.y, targetN.x - c.x);
            }
        }

        if(calcPath()) { validMap = true; renderBgCache(); }
    }
}

function getTransitions(cur) {
    if(!cur || cur.occ || cur.tower) return [];
    let list = [];

    // Warp Gate entrance: you can ONLY warp to warp_out (cannot step out onto physical neighbors)
    if(cur.type === 'warp_in') {
        if(G.warpOut && !G.warpOut.occ && !G.warpOut.tower) {
            list.push({ to: G.warpOut, cost: 0.8 });
        }
        return list;
    }

    for(let n of getNeighbors(cur)) {
        if(n.occ || n.tower) continue;

        // If currently on a one-way conduit, must exit along onewayTarget
        if(cur.type === 'oneway' && cur.onewayTarget) {
            if(n !== cur.onewayTarget) continue;
        }

        // If entering a one-way conduit, cannot enter against the arrow
        if(n.type === 'oneway' && n.onewayTarget) {
            if(n.onewayTarget === cur) continue;
        }

        let stepCost = 1.0;
        if(n.type === 'speed_pad') stepCost = 0.5; // Pathfinding favors speed pads
        else if(n.type === 'slow_pad') stepCost = 1.3;

        list.push({ to: n, cost: stepCost });
    }
    return list;
}

function calcPath(tempBlock=null) {
    if(tempBlock) tempBlock.occ=true;
    let path = findPath(G.start, G.end);
    if(tempBlock) tempBlock.occ=false;
    if(path) G.path = path;
    return path;
}

// A* from 'from' to 'to' over unoccupied cells using directional transitions.
function findPath(from, to) {
    if(!from || from.occ || from.tower || !to || to.occ || to.tower) return null;
    let open=[from], cameFrom=new Map(), gScore=new Map();
    gScore.set(from, 0); let found=false;
    const h = (a) => {
        let dDirect = dist(a, to);
        if(G.warpIn && G.warpOut && !G.warpOut.occ && !G.warpOut.tower) {
            let dWarp = dist(a, G.warpIn) + dist(G.warpOut, to);
            return Math.min(dDirect, dWarp);
        }
        return dDirect;
    };
    let maxSteps = (G.grid ? G.grid.length : 300) * 2 + 50;
    let steps = 0;
    while(open.length > 0 && steps++ < maxSteps) {
        open.sort((a,b)=>(gScore.get(a)+h(a))-(gScore.get(b)+h(b)));
        let cur=open.shift();
        if(cur===to){found=true; break;}
        for(let trans of getTransitions(cur)) {
            let n = trans.to;
            let g = gScore.get(cur) + trans.cost;
            if(g < (gScore.get(n) || Infinity)) {
                cameFrom.set(n, cur);
                gScore.set(n, g);
                if(!open.includes(n)) open.push(n);
            }
        }
    }
    if(!found) return null;
    let path=[], curr=to;
    let traceLimit = (G.grid ? G.grid.length : 300) + 10;
    while(curr && curr!==from && path.length < traceLimit) {
        path.push(curr);
        curr = cameFrom.get(curr);
    }
    if(!curr || curr !== from) return null; // Prevent cycles or disjoint paths
    path.push(from);
    return path.reverse();
}

// Plan a new route for live enemies. When tempBlock is provided, only enemies whose path intersects tempBlock need re-routing.
function planEnemyRoutes(tempBlock=null) {
    if(tempBlock) tempBlock.occ = true;
    let cache = new Map(), plans = [];
    try {
        for(let e of G.enemies) {
            if(!e) continue;
            let tgt = (e.path && Array.isArray(e.path) && e.pi < e.path.length) ? e.path[e.pi] : null;
            let origin = (tgt && !tgt.occ && !tgt.tower) ? tgt : e.prev;
            if(!origin || origin.occ || origin.tower) {
                return null;
            }
            // If tempBlock is set and this enemy's remaining path does not touch tempBlock, its existing path is valid!
            if(tempBlock && e.path && Array.isArray(e.path) && !e.path.slice(e.pi).includes(tempBlock) && e.prev !== tempBlock) {
                plans.push(e.path.slice(e.pi));
                continue;
            }
            if(!cache.has(origin)) cache.set(origin, findPath(origin, G.end));
            let p = cache.get(origin);
            if(!p || !p.length) {
                return null;
            }
            plans.push(p);
        }
        return plans;
    } finally {
        if(tempBlock) tempBlock.occ = false;
    }
}

function applyEnemyRoutes(plans) {
    if(!plans || !Array.isArray(plans)) return;
    G.enemies.forEach((e, i) => {
        let p = plans[i];
        if(p && Array.isArray(p) && p.length > 0) {
            e.path = p;
            e.pi = 0;
        } else {
            // Robust fallback: ensure enemy never ends up with undefined path
            let startNode = (e.path && Array.isArray(e.path) && e.path[e.pi] && !e.path[e.pi].occ && !e.path[e.pi].tower)
                ? e.path[e.pi] : (e.prev || G.start);
            let fallback = findPath(startNode, G.end) || G.path;
            if(fallback && Array.isArray(fallback) && fallback.length > 0) {
                e.path = fallback;
                e.pi = 0;
            }
        }
    });
}

// Check if placing a tower on hex is valid and keeps a valid trail for enemies
let dragPlacementCache = { hex: null, lastCheck: -1, valid: false, mainPath: null, plans: null };

function testPlacement(hex) {
    if(!hex || !canBuildOn(hex)) {
        return { canBuild: false, hasTrail: false, valid: false, mainPath: null, plans: null };
    }
    if(dragPlacementCache.hex === hex && (G.frame - dragPlacementCache.lastCheck < 10)) {
        return dragPlacementCache;
    }
    hex.occ = true;
    let mainPath = findPath(G.start, G.end);
    let plans = mainPath ? planEnemyRoutes() : null;
    hex.occ = false;
    let hasTrail = !!(mainPath && plans);
    let result = {
        canBuild: true,
        hasTrail: hasTrail,
        valid: hasTrail,
        mainPath: mainPath,
        plans: plans
    };
    dragPlacementCache = {
        hex: hex,
        lastCheck: G.frame,
        ...result
    };
    return result;
}

// --- Logic ---
function loop() {
    requestAnimationFrame(loop);
    if(!G.active) return;
    if(G.paused) {
        if(pauseRedrawNeeded) {
            try { draw(); } catch(e) { console.error("Pause draw error:", e); }
            pauseRedrawNeeded = false;
        }
        return;
    }
    try {
        let loops = G.speed; while(loops-- && G.active) { G.frame++; updateLogic(); }
    } catch(err) {
        console.error("Game logic error:", err);
    }
    try {
        draw();
    } catch(err) {
        console.error("Game draw error:", err);
        try { ctx.setTransform(1, 0, 0, 1, 0, 0); } catch(_) {}
    }
}

const MAX_ALIVE_ENEMIES = 160;

function updateLogic() {
    if(G.spawning) {
        let rate = Math.max(15, 35 - G.wave); 
        if(G.spawnQ > 0 && G.frame % rate === 0) { 
            // Performance safety breaker: throttle spawn if active swarm reaches safety ceiling
            if(G.enemies.length < MAX_ALIVE_ENEMIES) {
                spawnEnemy();
                G.spawnQ--; 
                if(G.spawnQ <= 0) { G.spawning = false; setTimer(10); } 
            }
        }
    }
    if(G.waveTimer>0 && --G.waveTimer<=0) startWave();
    
    if(G.waveTimer > 0) {
        let sec = Math.ceil(G.waveTimer / 60);
        if(sec !== lastTimerSec) {
            initDomCache();
            if(btnWaveEl && btnWaveEl.style.display !== 'flex') btnWaveEl.style.display = 'flex';
            if(uiTimerEl) uiTimerEl.innerText = sec;
            lastTimerSec = sec;
        }
    } else {
        if(lastTimerSec !== 0) {
            initDomCache();
            if(btnWaveEl && btnWaveEl.style.display !== 'none') btnWaveEl.style.display = 'none';
            lastTimerSec = 0;
        }
    }

    // Collector energy update, particle absorption, and connected tower burst boost:
    G.towers.forEach(t => { t.buffVal = 1; t.burstBoost = false; });
    G.towers.filter(t => t.type === 'buff').forEach(c => {
        if(c.energy == null) c.energy = 0;
        if(c.maxEnergy == null) c.maxEnergy = 100 + (c.lvl - 1) * 20;
        c.spin = (c.spin || 0) + 0.02 + c.lvl * 0.005;

        let cRange = towerRange(c);
        let cReachSq = (cRange + 15) * (cRange + 15);
        let connected = G.towers.filter(t => t !== c && distSq(c, t) <= cReachSq);
        c.connectedCount = connected.length;

        // If collector has energy, activate burst boost!
        if(c.energy > 0) {
            if(!c.bursting && G.enableFX) playSound('burst');
            c.bursting = true;
            // Drain energy over time (faster if boosting multiple towers)
            let drain = 0.22 + connected.length * 0.06;
            c.energy = Math.max(0, c.energy - drain);
            
            connected.forEach(t => {
                t.burstBoost = true;
                // Burst fire boost: calibrated high damage and rapid rate
                t.buffVal = Math.max(t.buffVal, 1.25 + c.lvl * 0.08);
            });
            if(G.frame % 30 === 0 && G.enableFX) {
                fx(c.x, c.y, '#ff00aa', 2);
                fx(c.x, c.y, '#00e5ff', 2);
            }
        } else {
            c.bursting = false;
            // Baseline passive buff even without energy
            connected.forEach(t => {
                t.buffVal = Math.max(t.buffVal, 1.08 + c.lvl * 0.04);
            });
        }
    });

    // Update Energy Orbs flying from dead enemies to Collectors (Zero-GC Pool)
    for(let i = 0; i < MAX_ENERGY_ORBS; i++) {
        let orb = energyOrbPool[i];
        if(!orb.active) continue;
        orb.life--;
        if(orb.life <= 0 || !G.towers.includes(orb.target)) {
            orb.active = false;
            continue;
        }
        let dx = orb.target.x - orb.x;
        let dy = orb.target.y - orb.y;
        let dSq = dx * dx + dy * dy;
        if(dSq < 196) { // 14 * 14 = 196
            orb.target.energy = Math.min(orb.target.maxEnergy || 100, (orb.target.energy || 0) + orb.val);
            if(G.enableFX) {
                if(G.frame % 4 === 0) playSound('absorb');
                fx(orb.target.x, orb.target.y, orb.color, 2);
            }
            orb.active = false;
        } else {
            let d = Math.sqrt(dSq);
            let spd = Math.min(15, 3.5 + (90 - orb.life) * 0.22);
            orb.vx = orb.vx * 0.82 + (dx / d) * spd * 0.18;
            orb.vy = orb.vy * 0.82 + (dy / d) * spd * 0.18;
            orb.x += orb.vx;
            orb.y += orb.vy;
        }
    }

    // Towers
    G.towers.forEach(t => {
        if(t.cd > 0) {
            let wasReloading = (t.type === 'missile' && t.reloading);
            t.cd -= (t.burstBoost ? 2.5 : 1);
            if(t.cd <= 0) {
                t.cd = 0;
                if(wasReloading) {
                    t.reloading = false;
                    if(G.enableFX) {
                        playSound('reload');
                        fx(t.x, t.y, '#ff3366', 3);
                    }
                }
            }
        }
        let buff = t.buffVal || 1;
        let range = towerRange(t);

        // Check if current target is invalid (dead or reached)
        if(t.target && (t.target.hp<=0 || t.target.reached)) {
            t.target = null;
        }

        if(t.type === 'laser') {
            let maxBurst = (t.burst || 160) + (t.lvl - 1) * 15;
            let maxCd = Math.max(45, (t.cooldown || 75) - (t.lvl - 1) * 5);
            if(t.burstTimer == null) t.burstTimer = maxBurst;
            if(t.cooldownTimer == null) t.cooldownTimer = 0;

            if(t.cooldownTimer > 0) {
                t.cooldownTimer -= (t.burstBoost ? 2 : 1);
                if(t.cooldownTimer < 0) t.cooldownTimer = 0;
                t.firing = false;
                if(t.cooldownTimer === 0) {
                    t.burstTimer = maxBurst;
                    if(G.enableFX) fxExplode(t.x, t.y, '#00ffff', 4);
                }
            }

            let hasTarget = false;
            let reach = Math.max(G.w, G.h) * 1.5;
            let rSq = range * range;
            if(t.lockedAngle != null) {
                t.angle = t.lockedAngle;
                let ex = t.x + Math.cos(t.angle) * reach;
                let ey = t.y + Math.sin(t.angle) * reach;
                hasTarget = G.enemies.some(e => {
                    let sz = e.size || 10;
                    return e.hp > 0 && !e.reached && distToSegmentSq({x:t.x, y:t.y}, {x:ex, y:ey}, e) < sz * sz;
                });
            } else {
                if(!t.target || distSq(t, t.target) > rSq) {
                    let bestSq = Infinity;
                    t.target = null;
                    G.enemies.forEach(e => {
                        if(e.hp > 0 && !e.reached) {
                            if(Math.abs(t.x - e.x) <= range && Math.abs(t.y - e.y) <= range) {
                                let dSq = distSq(t, e);
                                if(dSq <= rSq && dSq < bestSq) { bestSq = dSq; t.target = e; }
                            }
                        }
                    });
                }
                if(t.target) {
                    t.angle = Math.atan2(t.target.y - t.y, t.target.x - t.x);
                    hasTarget = true;
                }
            }

            if(t.cooldownTimer <= 0) {
                if(hasTarget) {
                    if(t.burstTimer > 0 || t.burstBoost) {
                        fireLaser(t, buff * (t.burstBoost ? 1.4 : 1.0));
                        if(!t.burstBoost) {
                            t.burstTimer--;
                            if(t.burstTimer <= 0) {
                                t.cooldownTimer = maxCd;
                                t.maxCooldown = maxCd;
                                if(G.enableFX) {
                                    playSound('vent');
                                    fxExplode(t.x, t.y, '#ff9900', 6);
                                    fxExplode(t.x, t.y, '#00ffff', 4);
                                }
                            }
                        }
                    } else {
                        t.firing = false;
                    }
                } else {
                    t.firing = false;
                    if(t.burstTimer < maxBurst) {
                        t.burstTimer = Math.min(maxBurst, t.burstTimer + 1);
                    }
                }
            }
        } else if(t.type === 'shock') {
            if(!t.shockwaves) t.shockwaves = [];
            let shockRate = t.burstBoost ? Math.max(12, Math.floor((t.rate || 36) * 0.4)) : (t.rate || 36);
            let baseRate = shockRate / (1 + (t.lvl - 1) * 0.12);
            let rSq = range * range;
            let enemiesInRange = G.enemies.filter(e => e.hp > 0 && !e.reached && Math.abs(t.x - e.x) <= range && Math.abs(t.y - e.y) <= range && distSq(t, e) <= rSq);
            
            if(t.cd <= 0) {
                if(enemiesInRange.length > 0) {
                    t.cd = baseRate;
                    t.shockwaves.push({
                        r: G.hexR * 0.4,
                        maxR: range,
                        alpha: 1.0,
                        spd: Math.max(4.2, range / 14),
                        hitEnemies: []
                    });
                    if(G.enableFX) {
                        playSound('emp');
                        fxExplode(t.x, t.y, '#ffffff', 4);
                    }
                }
            }

            // Update active expanding shockwaves with AABB pruning
            for(let wIdx = t.shockwaves.length - 1; wIdx >= 0; wIdx--) {
                let wave = t.shockwaves[wIdx];
                wave.r += wave.spd;
                wave.alpha = Math.max(0, 1 - (wave.r / wave.maxR));

                // Damage any enemy reached by wavefront with bounding box pre-rejection
                let checkR = wave.r + wave.spd * 2.2 + 8;
                for(let j = 0; j < G.enemies.length; j++) {
                    let e = G.enemies[j];
                    if(e.hp <= 0 || e.reached || wave.hitEnemies.includes(e)) continue;
                    if(Math.abs(t.x - e.x) > checkR || Math.abs(t.y - e.y) > checkR) continue;
                    let d = dist(t, e);
                    if(Math.abs(d - wave.r) <= (wave.spd + (e.size || 8) * 0.7) || (d < wave.r && d > wave.r - wave.spd * 2.2)) {
                        wave.hitEnemies.push(e);
                        let grav = e.inGraviton > 0 ? 0.6 : 1.0;
                        let shockDmg = t.dmg * Math.pow(1.35, t.lvl - 1) * buff * grav;
                        e.hp -= shockDmg;
                        e.slow = t.burstBoost ? 30 : 20;
                        if(G.enableFX) {
                            spawnParticle(e.x, e.y, (Math.random()-0.5)*2, (Math.random()-0.5)*2, 0.4, '#ffdd00', 'dot', 1.8);
                        }
                    }
                }

                if(wave.r >= wave.maxR || wave.alpha <= 0.02) {
                    t.shockwaves.splice(wIdx, 1);
                }
            }
        } else if(t.type === 'slow') {
            let maxArcs = t.lvl >= 6 ? 7 : t.lvl;
            let validEnemies = [];
            let rSq = range * range;
            for(let j = 0; j < G.enemies.length; j++) {
                let e = G.enemies[j];
                if(e.hp > 0 && !e.reached && Math.abs(t.x - e.x) <= range && Math.abs(t.y - e.y) <= range && distSq(t, e) <= rSq) {
                    validEnemies.push(e);
                }
            }
            validEnemies.sort((a, b) => (a.distToEnd || 0) - (b.distToEnd || 0));
            t.arcTargets = validEnemies.slice(0, maxArcs);
            let slowRate = t.burstBoost ? 2 : t.rate;
            t.arcTargets.forEach(e => {
                let grav = (e.inGraviton > 0 ? 0.6 : 1.0);
                if(G.frame % slowRate === 0) {
                    e.hp -= t.dmg * (1 + t.lvl * 0.45) * buff * grav;
                    e.slow = t.burstBoost ? 35 : 25;
                    if(G.enableFX && Math.random() < 0.4) fx(e.x, e.y, '#00f5ff', 1);
                }
            });
            if(t.arcTargets.length > 0 && G.frame % 16 === 0 && G.enableFX) {
                playSound('spark');
            }
        } else if(t.type !== 'buff') {
            let rSq = range * range;
            if(!t.target || distSq(t, t.target) > rSq) {
                let bestSq = Infinity;
                t.target = null;
                G.enemies.forEach(e => {
                    if(e.hp > 0 && !e.reached) {
                        if(Math.abs(t.x - e.x) <= range && Math.abs(t.y - e.y) <= range) {
                            let dSq = distSq(t, e);
                            if(dSq <= rSq && dSq < bestSq) { bestSq = dSq; t.target = e; }
                        }
                    }
                });
            }
            if(t.target) {
                t.angle = Math.atan2(t.target.y-t.y, t.target.x-t.x);
                if(t.cd<=0) {
                    let dmg = t.dmg * Math.pow(1.4, t.lvl-1) * buff;
                    let scale = G.hexR / 20;
                    let baseRate = t.rate / (1 + (t.lvl - 1) * 0.15);
                    let effectiveRate = t.burstBoost ? Math.max(4, Math.round(baseRate * 0.6)) : baseRate;

                    if(t.type === 'missile') {
                        let bDist = 12 * scale;
                        t.barrelAlt = !t.barrelAlt;
                        let latOffset = (t.barrelAlt ? 3.5 : -3.5) * scale;
                        let spawnX = t.x + Math.cos(t.angle) * bDist - Math.sin(t.angle) * latOffset;
                        let spawnY = t.y + Math.sin(t.angle) * bDist + Math.cos(t.angle) * latOffset;
                        G.projs.push({ 
                            x:spawnX, y:spawnY, 
                            vx:Math.cos(t.angle), vy:Math.sin(t.angle), 
                            spd:4.5, maxSpd:11 + Math.min(t.lvl, 6)*0.8,
                            dmg:dmg, color:t.color, type:'missile', 
                            splash:t.splash||65, tar:t.target, life:110, angle:t.angle 
                        });
                        t.cd = effectiveRate;
                        t.maxCd = effectiveRate;
                        t.reloading = true;
                        if(G.enableFX) playSound('missile');
                    } else if(t.type === 'sniper') {
                        let bDist = (14 + Math.min(t.lvl, 6) * 1.2) * scale;
                        let spawnX = t.x + Math.cos(t.angle) * bDist;
                        let spawnY = t.y + Math.sin(t.angle) * bDist;
                        G.projs.push({
                            x:spawnX, y:spawnY,
                            vx:Math.cos(t.angle), vy:Math.sin(t.angle),
                            spd:24, dmg:dmg, color:t.color, type:'sniper',
                            tar:t.target, life:55, angle:t.angle
                        });
                        t.cd = effectiveRate;
                        if(G.enableFX) {
                            playSound('sniper');
                            fx(spawnX, spawnY, '#ffffff', 4);
                        }
                    } else {
                        let bDist = (12 + Math.min(t.lvl, 6) * 1.2) * scale;
                        let spawnX = t.x + Math.cos(t.angle) * bDist;
                        let spawnY = t.y + Math.sin(t.angle) * bDist;
                        G.projs.push({ 
                            x:spawnX, y:spawnY, 
                            vx:Math.cos(t.angle), vy:Math.sin(t.angle), 
                            spd:11, dmg:dmg, color:t.color, type:t.type, 
                            splash:t.splash||0, tar:t.target, life:80, angle:t.angle 
                        });
                        t.cd = effectiveRate; 
                        if(G.enableFX) {
                            playSound('shoot');
                            fx(spawnX, spawnY, t.color, 2);
                        }
                    }
                }
            }
        }
    });

    if(G.selected && (G.selected.type === 'laser' || G.selected.type === 'buff' || G.selected.type === 'slow' || G.selected.type === 'missile') && G.frame % 10 === 0) updateMenuUI();

    for(let i=G.projs.length-1; i>=0; i--) {
        let p=G.projs[i]; p.life--;
        // Missile Aerodynamic Homing & Rocket Propulsion
        if(p.type==='missile') {
            if(p.spd < p.maxSpd) p.spd += 0.25; // Accelerating rocket thruster
            if(p.tar && p.tar.hp>0 && !p.tar.reached) { 
                let ta = Math.atan2(p.tar.y-p.y, p.tar.x-p.x); 
                // Steer velocity toward target with turn rate
                p.vx = p.vx*0.88 + Math.cos(ta)*0.12; 
                p.vy = p.vy*0.88 + Math.sin(ta)*0.12;
                let vLen = Math.hypot(p.vx, p.vy) || 1;
                p.vx /= vLen; p.vy /= vLen;
                p.angle = Math.atan2(p.vy, p.vx);
            } else {
                p.tar = null; // target dead/escaped, rocket continues on current ballistic vector
            }
            // Emit neon smoke/exhaust particle trail from object pool
            if(G.enableFX && G.frame % 2 === 0) {
                let backX = p.x - Math.cos(p.angle || 0) * 8;
                let backY = p.y - Math.sin(p.angle || 0) * 8;
                spawnParticle(
                    backX, backY,
                    (Math.random()-0.5)*1.2 - Math.cos(p.angle||0)*1.5,
                    (Math.random()-0.5)*1.2 - Math.sin(p.angle||0)*1.5,
                    0.7, (Math.random() > 0.4 ? '#ff3300' : '#ffaa00'), 'dot', 2
                );
            }
        }

        let prevX = p.x, prevY = p.y;
        p.x+=p.vx*p.spd; p.y+=p.vy*p.spd; if(p.type==='frag') p.spd*=0.9;
        
        // Fast AABB bounding box check around projectile trajectory segment
        let hitRad = (p.type==='missile' ? (G.hexR * 0.75) : (G.hexR * 0.42));
        let pad = hitRad + G.hexR * 0.85;
        let pMinX = Math.min(prevX, p.x) - pad, pMaxX = Math.max(prevX, p.x) + pad;
        let pMinY = Math.min(prevY, p.y) - pad, pMaxY = Math.max(prevY, p.y) + pad;

        let hit = null;
        for(let j = 0; j < G.enemies.length; j++) {
            let e = G.enemies[j];
            if(e.hp <= 0 || e.reached) continue;
            if(e.x < pMinX || e.x > pMaxX || e.y < pMinY || e.y > pMaxY) continue;
            let combinedR = hitRad + (e.size || 8)*0.5;
            let combRSq = combinedR * combinedR;
            if(distSq(p, e) < combRSq || distToSegmentSq({x:prevX, y:prevY}, {x:p.x, y:p.y}, e) < combRSq) {
                hit = e;
                break;
            }
        }
        if(hit || p.life<=0) {
            if(hit || (p.type==='missile' && p.life<=0)) {
                if(p.type==='missile') {
                    if(G.enableFX) { playSound('boom'); fxExplode(p.x,p.y,p.color,12); spawnShock(p.x, p.y, p.color, 60); }
                    let splashR = p.splash;
                    let splashRSq = splashR * splashR;
                    for(let j = 0; j < G.enemies.length; j++) {
                        let e = G.enemies[j];
                        if(e.hp <= 0 || e.reached) continue;
                        if(Math.abs(p.x - e.x) > splashR || Math.abs(p.y - e.y) > splashR) continue;
                        if(distSq(p, e) < splashRSq) {
                            let grav = e.inGraviton > 0 ? 0.6 : 1.0;
                            e.hp -= p.dmg * grav;
                        }
                    }
                    for(let k=0;k<4;k++){ let a=Math.random()*6.28; G.projs.push({x:p.x,y:p.y,vx:Math.cos(a),vy:Math.sin(a),spd:6,dmg:p.dmg*0.3,color:'#fa0',type:'frag',life:20}); }
                } else if (hit) { // Single target hit
                    let grav = hit.inGraviton > 0 ? 0.6 : 1.0;
                    hit.hp -= p.dmg * grav; 
                    if(G.enableFX) fx(p.x,p.y,p.color,3); 
                }
            }
            if(hit||p.life<=0) G.projs.splice(i,1);
        }
    }

    let endRSq = (G.hexR || 20) * (G.hexR || 20);
    for(let i=G.enemies.length-1; i>=0; i--) {
        let e=G.enemies[i];
        if(e.hp<=0) { 
            let sMult = (DIFFICULTY_CONFIG[G.difficulty] || DIFFICULTY_CONFIG.normal).scoreMult;
            G.cash += e.val; 
            G.score += Math.round(e.val * 10 * sMult * (1 + G.wave * 0.04)); 
            fxEnemyDestroy(e);
            updateUI(); G.enemies.splice(i,1); continue; 
        }
        
        // Pathing Safeguard: heal corrupted or missing enemy path
        if(!e.path || !Array.isArray(e.path) || e.path.length === 0) {
            e.path = G.path || findPath(G.start, G.end) || [];
            e.pi = 0;
        }
        let target = (e.path && e.pi < e.path.length) ? e.path[e.pi] : null;
        // Check end condition
        if(distSq(e, G.end) < endRSq) {
            e.reached = true; // Mark as reached so towers ignore it
            G.enemies.splice(i,1); loseLife();
            playSound('breach');
            G.endHit = 30;
            if(G.enableFX) {
                fxExplode(G.end.x, G.end.y, '#ff0033', 30);
                fxExplode(G.end.x, G.end.y, '#ffffff', 16);
                fxExplode(G.end.x, G.end.y, e.color || '#ff8800', 14);
                spawnShock(G.end.x, G.end.y, '#ff0044', G.hexR * 3.8);
                spawnShock(G.end.x, G.end.y, '#ffffff', G.hexR * 2.2);
                fxHalo(G.end.x, G.end.y, '#ff0044');
                fxHalo(G.end.x, G.end.y, '#ffcc00');
                spawnParticle(G.end.x, G.end.y - 10, 0, -1.0, 1.0, '#ff2244', 'text', 0, '-1 HP');
            }
            continue;
        }

        if(target) {
            let tx=target.x+e.ox, ty=target.y+e.oy;
            let slowFactor = e.slow > 0 ? (0.42 + (e.ccResist || 0) * 0.28) : 1;
            if(e.slow > 0) e.slow--;
            let moveSpd = e.spd * slowFactor;
            if(e.speedBoost > 0) { moveSpd *= 1.75; e.speedBoost--; if(G.enableFX && G.frame % 3 === 0) fx(e.x, e.y, '#ffdd00', 1); }
            if(e.inGraviton > 0) {
                let gravFactor = 0.55 + (e.ccResist || 0) * 0.2;
                moveSpd *= gravFactor;
                e.inGraviton--;
                if(G.enableFX && G.frame % 4 === 0) fx(e.x, e.y, '#cc33ff', 1);
            }

            let dx=tx-e.x, dy=ty-e.y, dSq=dx*dx + dy*dy;
            let spdSq = moveSpd * moveSpd;
            if(dSq < spdSq) {
                e.prev = target;
                if(target.type === 'speed_pad') {
                    e.speedBoost = 50;
                    if(G.enableFX && G.frame % 6 === 0) playSound('boost');
                } else if(target.type === 'slow_pad') {
                    e.inGraviton = 45;
                }

                // Warp Gate Teleport
                if(target.type === 'warp_in' && G.warpOut && !G.warpOut.occ && !G.warpOut.tower) {
                    if(e.path[e.pi + 1] === G.warpOut) {
                        e.x = G.warpOut.x + (e.ox || 0);
                        e.y = G.warpOut.y + (e.oy || 0);
                        e.distToEnd = G.end ? Math.hypot(G.end.x - e.x, G.end.y - e.y) : 0;
                        e.prev = G.warpOut;
                        if(G.enableFX) {
                            playSound('warp');
                            fxExplode(target.x, target.y, '#00ffff', 18);
                            fxExplode(G.warpOut.x, G.warpOut.y, '#ff00ff', 18);
                            spawnShock(G.warpOut.x, G.warpOut.y, '#ff00ff', 45);
                        }
                        e.pi += 2;
                    } else {
                        e.pi++;
                    }
                } else {
                    e.pi++;
                }
            } else {
                let d = Math.sqrt(dSq);
                e.x += dx / d * moveSpd; e.y += dy / d * moveSpd; e.angle = Math.atan2(dy, dx);
                e.distToEnd = G.end ? Math.hypot(G.end.x - e.x, G.end.y - e.y) : 0;
            }
        } else { 
            // Fallback if path ends abnormally
            e.reached = true; G.enemies.splice(i,1); loseLife();
            playSound('breach');
            G.endHit = 30;
            if(G.enableFX) {
                fxExplode(G.end.x, G.end.y, '#ff0033', 25);
                spawnShock(G.end.x, G.end.y, '#ff0044', G.hexR * 3.2);
                spawnParticle(G.end.x, G.end.y - 10, 0, -1.0, 1.0, '#ff2244', 'text', 0, '-1 HP');
            }
        }
    }
    
    // Update Shock & Particle Object Pools (Zero GC allocations)
    for(let i=0; i<MAX_SHOCKS; i++) {
        let s = shockPool[i];
        if(s.active) {
            s.r += 2.5; s.alpha -= 0.06;
            if(s.alpha <= 0) s.active = false;
        }
    }
    for(let i=0; i<MAX_PARTS; i++) {
        let p = particlePool[i];
        if(p.active) {
            p.x += p.vx; p.y += p.vy;
            if(p.type === 'spark' || p.type === 'dot') {
                p.vx *= 0.94; p.vy *= 0.94;
            }
            if(p.type === 'halo') p.r += 2;
            p.life -= (p.type === 'text' ? 0.025 : 0.035);
            if(p.life <= 0) p.active = false;
        }
    }
    if(G.endHit > 0) G.endHit--;
}

// --- Wave System ---
function startWave() {
    G.wave++; 
    G.spawnQ = Math.min(65, 6 + Math.floor(G.wave * 1.2)); 
    G.spawning = true; 
    G.waveTimer = 0; 
    updateUI();
}
function forceNextWave() { 
    if(G.waveTimer > 0) G.score += Math.ceil(G.waveTimer/60)*50; 
    startWave(); 
}
function calcEnemyBaseHp(wave, hpMult) {
    let w = wave;
    let growth;
    if(w <= 20) {
        growth = Math.pow(1.08, w - 1);
    } else if(w <= 50) {
        growth = Math.pow(1.08, 19) * Math.pow(1.045, w - 20);
    } else if(w <= 100) {
        growth = Math.pow(1.08, 19) * Math.pow(1.045, 30) * Math.pow(1.032, w - 50);
    } else {
        growth = Math.pow(1.08, 19) * Math.pow(1.045, 30) * Math.pow(1.032, 50) * Math.pow(1.020, w - 100);
    }
    let raw = (20 + w * 6) * growth;
    return Math.round(raw * hpMult);
}
function spawnEnemy() {
    let cfg = DIFFICULTY_CONFIG[G.difficulty] || DIFFICULTY_CONFIG.normal;
    let baseHp = calcEnemyBaseHp(G.wave, cfg.hpMult);
    let hr = G.hexR || 20;
    let spd = Math.min(2.4, 1.0 + (G.wave * 0.015)) * cfg.spdMult;
    let shape = 'hexagon', size = Math.round(hr * 0.46), ccResist = 0;
    let stage = Math.floor((G.wave - 1) / 5);

    if(G.wave % 5 === 0) { 
        // Boss: Massive Decagon (0.80R giant fortress unit)
        shape = 'decagon'; baseHp *= 8.0; spd *= 0.45; size = Math.round(hr * 0.80); ccResist = 0.5;
    }
    else if(stage >= 2 && Math.random() > 0.55) { 
        // Armored Heavy: Octagon fortress (0.66R)
        shape = 'octagon'; baseHp *= 3.5; spd *= 0.58; size = Math.round(hr * 0.66); ccResist = 0.3;
    }
    else if(stage >= 1 && Math.random() > 0.60) { 
        // Infiltrator: Fast Dart Rhombus (0.40R agile speedster)
        shape = 'dart'; baseHp *= 0.75; spd *= 1.45; size = Math.round(hr * 0.40); ccResist = 0.1;
    }
    else if(Math.random() > 0.5) {
        // Heavy Drone: Pentagon combat unit (0.54R)
        shape = 'pentagon'; baseHp *= 1.4; spd *= 0.88; size = Math.round(hr * 0.54); ccResist = 0.15;
    }
    let bounty = Math.min(25, 5 + Math.floor(G.wave / 3));
    let e = { 
        x:G.start.x, y:G.start.y, pi:0, slow:0, speedBoost:0, inGraviton:0, hp:baseHp, max:baseHp, spd:spd, size:size,
        path:G.path, prev:G.start, ccResist: ccResist,
        val: Math.max(1, Math.floor(bounty * (G.difficulty==='easy'?1.2:(G.difficulty==='hell'?0.8:1.0)))), shape: shape, 
        color: `hsl(${(G.wave*25)%360},100%,60%)`, angle: 0, 
        ox: (Math.random()-0.5)*(G.hexR*0.5), oy: (Math.random()-0.5)*(G.hexR*0.5),
        distToEnd: G.end ? Math.hypot(G.end.x - G.start.x, G.end.y - G.start.y) : 0,
        reached:false // Flag for targeting logic
    };
    G.enemies.push(e);
    if(G.enableFX) {
        spawnParticle(G.start.x, G.start.y, 0, 0, 0.7, '#c000ff', 'halo', Math.round(hr * 0.45));
        fx(G.start.x, G.start.y, '#00f5ff', 2);
    }
}

// Pre-allocated static buffer for enemy vertex pip nodes (Zero GC allocation pipeline)
const SHARED_ENEMY_NODES = [];
for(let i = 0; i < 32; i++) SHARED_ENEMY_NODES.push({ x: 0, y: 0, spin: undefined, r: 1.35 });
let sharedNodeCount = 0;
function addEnemyNode(x, y, spin, r = 1.35) {
    if(sharedNodeCount < 32) {
        let n = SHARED_ENEMY_NODES[sharedNodeCount++];
        n.x = x; n.y = y; n.spin = spin; n.r = r;
    }
}

// --- Draw ---
function draw() {
    if(!G.view || !isFinite(G.view.s) || G.view.s <= 0) fitView();
    ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width,canvas.height); // letterbox
    if(G.view && isFinite(G.view.s) && G.view.s > 0) {
        ctx.setTransform(G.view.s,0,0,G.view.s,G.view.ox,G.view.oy); // map -> screen
    }
    
    // 1. Offscreen Cached Static Map (Hex Grid, Obstacles, Walls, Gates)
    if(bgCanvas.width > 0 && bgCanvas.height > 0) {
        ctx.drawImage(bgCanvas, 0, 0);
    }

    // 1.2 Enemy Entry Point - Black Hole Spinning Vortex
    drawEnemyEntry(ctx);

    // 1.5 Special Tactical Obstacles & Conduits (Warp Gate, Speed Pad, Slow Graviton, One-Way)
    drawSpecialObstacles(ctx);

    // 1.8 Dynamic Animated Endpoint Core & Breach Alert Visuals
    drawEndpoint(ctx);

    if(G.enableFX) ctx.globalCompositeOperation = 'lighter';

    G.towers.forEach(t => {
        // 2. Pre-rendered Neon Glow & Refined Base Pad (0.85R)
        drawGlow(ctx, t.x, t.y, G.hexR * 1.3, t.color);
        drawHexSolid(t.x, t.y, G.hexR * 0.85, t.color, 0.12 + (t.lvl*0.04));
        ctx.strokeStyle = t.color;
        
        if(t.type === 'buff') {
            let tRange = towerRange(t);
            G.towers.forEach(target => {
                if(target !== t && dist(t,target) <= tRange+10) {
                    if(t.bursting) {
                        let bHue = (G.frame * 8 + dist(t, target)) % 360;
                        ctx.strokeStyle = `hsl(${bHue}, 100%, 65%)`;
                        ctx.lineWidth = 2.4;
                        ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(target.x, target.y); ctx.stroke();
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 1.0;
                        ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(target.x, target.y); ctx.stroke();
                    } else {
                        ctx.beginPath(); ctx.moveTo(t.x,t.y); ctx.lineTo(target.x,target.y); ctx.lineWidth=1; ctx.globalAlpha=0.4; ctx.stroke(); ctx.globalAlpha=1;
                    }
                }
            });
        }
        
        ctx.save(); ctx.translate(t.x,t.y);
        
        if(t.lvl > 1) { ctx.beginPath(); ctx.arc(0,0,G.hexR*0.55,0,6.28); ctx.stroke(); }
        if(t.lvl > 3) { ctx.beginPath(); ctx.arc(0,0,G.hexR*0.70,0,6.28); ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]); }
        if(t.lvl === 6) { ctx.beginPath(); ctx.arc(0,0,G.hexR*0.82,0,6.28); ctx.lineWidth=2; ctx.stroke(); ctx.lineWidth=1; }
        
        // Collector Energy Meter Arc Gauge
        if(t.type === 'buff') {
            let maxE = t.maxEnergy || (100 + (t.lvl - 1) * 20);
            let eRatio = Math.min(1, Math.max(0, (t.energy || 0) / maxE));
            // Background track ring
            ctx.beginPath();
            ctx.arc(0, 0, G.hexR * 0.76, 0, 6.28);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 2.0;
            ctx.stroke();

            // Active Energy Arc
            if(eRatio > 0.01) {
                let mHue = (G.frame * 4) % 360;
                ctx.beginPath();
                ctx.arc(0, 0, G.hexR * 0.76, -Math.PI / 2, -Math.PI / 2 + eRatio * Math.PI * 2);
                ctx.strokeStyle = t.bursting ? `hsl(${mHue}, 100%, 65%)` : '#00e5ff';
                ctx.lineWidth = t.bursting ? 3.0 : 2.2;
                ctx.stroke();
                ctx.lineWidth = 1.0;
            }
        }

        // Burst Fire Aura on supercharged connected towers
        if(t.burstBoost) {
            let aHue = (G.frame * 8) % 360;
            ctx.beginPath();
            ctx.arc(0, 0, G.hexR * 0.65 + Math.sin(G.frame * 0.25) * 2, 0, 6.28);
            ctx.strokeStyle = `hsl(${aHue}, 100%, 70%)`;
            ctx.lineWidth = 2.0;
            ctx.stroke();
            ctx.lineWidth = 1.0;
        }

        // Laser burst and cooldown visual indicators
        if(t.type === 'laser') {
            let maxBurst = (t.burst || 160) + (t.lvl - 1) * 15;
            let maxCd = t.maxCooldown || Math.max(45, (t.cooldown || 75) - (t.lvl - 1) * 5);
            if(t.cooldownTimer > 0) {
                // Recharging / Cooling down gauge: Amber/Orange arc filling up
                let cdRatio = 1 - (t.cooldownTimer / maxCd);
                ctx.beginPath();
                ctx.arc(0, 0, G.hexR * 0.76, -Math.PI/2, -Math.PI/2 + cdRatio * Math.PI * 2);
                ctx.strokeStyle = '#ff9900';
                ctx.lineWidth = 2.5;
                ctx.stroke();
                ctx.lineWidth = 1;
                // Subtle heat shimmer/vent
                if(G.enableFX && G.frame % 15 === 0) {
                    fx(t.x + (Math.random()-0.5)*10, t.y + (Math.random()-0.5)*10, '#ffaa00', 1);
                }
            } else if(t.firing) {
                // Firing burst gauge: Cyan arc depleting
                let burstRatio = Math.max(0, (t.burstTimer || 0) / maxBurst);
                ctx.beginPath();
                ctx.arc(0, 0, G.hexR * 0.76, -Math.PI/2, -Math.PI/2 + burstRatio * Math.PI * 2);
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 2.5;
                ctx.stroke();
                ctx.lineWidth = 1;
            }
        }

        // Missile reload visual gauge indicator
        if(t.type === 'missile') {
            let maxCd = t.maxCd || 140;
            if(t.cd > 0) {
                let reloadRatio = 1 - (t.cd / maxCd);
                // Background track
                ctx.beginPath();
                ctx.arc(0, 0, G.hexR * 0.76, 0, 6.28);
                ctx.strokeStyle = 'rgba(255, 51, 102, 0.2)';
                ctx.lineWidth = 2.0;
                ctx.stroke();

                // Active reload arc filling up
                ctx.beginPath();
                ctx.arc(0, 0, G.hexR * 0.76, -Math.PI/2, -Math.PI/2 + reloadRatio * Math.PI * 2);
                ctx.strokeStyle = '#ff3366';
                ctx.lineWidth = 2.4;
                ctx.stroke();
            }
        }

        if(t.type === 'buff') ctx.rotate(t.spin || 0); else ctx.rotate(t.angle);
        
        let scale = G.hexR / 20; ctx.scale(scale, scale);
        drawTowerShape(ctx, t.type, t.lvl, (t.type === 'laser' && t.cooldownTimer > 0) ? '#4a7590' : t.color);

        if(t.type === 'laser' && t.firing) {
            let muzzleX = 13 + Math.min(t.lvl, 6) * 0.9;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(muzzleX, 0, 2.5 + Math.sin(G.frame * 0.5) * 0.8, 0, 6.28);
            ctx.fill();
            ctx.fillStyle = '#00ffff';
            ctx.beginPath();
            ctx.arc(muzzleX, 0, 4.5 + Math.sin(G.frame * 0.5) * 1.2, 0, 6.28);
            ctx.globalAlpha = 0.5;
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
        
        ctx.restore();

        if(t.type==='laser' && t.firing) {
            let reach = Math.max(G.w, G.h) * 1.5;
            let ex = t.x + Math.cos(t.angle) * reach, ey = t.y + Math.sin(t.angle) * reach;
            // Multi-pass neon beam (replaces expensive Gaussian blur with hardware additive blending)
            ctx.strokeStyle = t.color;
            ctx.lineWidth = 4 + (t.lvl * 0.8);
            ctx.globalAlpha = 0.55;
            ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(ex, ey); ctx.stroke();
            ctx.lineWidth = 2 + (t.lvl * 0.4);
            ctx.globalAlpha = 0.9;
            ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(ex, ey); ctx.stroke();
            // Inner penetrating white-hot core
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1 + (t.lvl * 0.2);
            ctx.globalAlpha = 1;
            ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(ex, ey); ctx.stroke();
            ctx.lineWidth = 1;
        }
        if(t.type === 'shock' && t.shockwaves && t.shockwaves.length > 0) {
            t.shockwaves.forEach(wave => {
                let progress = wave.r / wave.maxR;
                ctx.save();
                // Outer high-energy expanding shockwave ring
                ctx.strokeStyle = t.color; // #ffdd00
                ctx.lineWidth = Math.max(1.5, 3.4 * (1 - progress * 0.6));
                ctx.globalAlpha = wave.alpha * 0.85;
                ctx.beginPath();
                ctx.arc(t.x, t.y, wave.r, 0, Math.PI * 2);
                ctx.stroke();

                // Inner white-hot wavefront edge
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.2;
                ctx.globalAlpha = wave.alpha * 0.95;
                ctx.beginPath();
                ctx.arc(t.x, t.y, Math.max(0, wave.r - 2.5), 0, Math.PI * 2);
                ctx.stroke();

                // Secondary trailing echo ripple
                if(wave.r > 20) {
                    ctx.strokeStyle = t.color;
                    ctx.lineWidth = 1.0;
                    ctx.globalAlpha = wave.alpha * 0.35;
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, wave.r - 10, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.restore();
            });
        }
        if(t.type==='slow' && t.arcTargets && t.arcTargets.length > 0) {
            t.arcTargets.forEach(tgt => {
                if(tgt.hp > 0 && !tgt.reached) {
                    drawElectricArc(ctx, t.x, t.y, tgt.x, tgt.y, '#00f5ff', '#ffffff');
                }
            });
        }
    });

    G.enemies.forEach(e => {
        let s = e.size || 8;
        // 1. Pre-rendered Neon Glow Aura
        drawGlow(ctx, e.x, e.y, s * 2.0, e.color);

        ctx.save();
        ctx.translate(e.x, e.y);

        sharedNodeCount = 0; // Zero-allocation CRT vertex nodes
        let darkCore = 'rgba(5, 10, 18, 0.72)'; // Dark translucent vector body (reveals grid lines)

        if(e.shape === 'dart') {
            // --- GeoDefense Infiltrator (Supersonic Delta-Wing Vector Jet) ---
            ctx.rotate(e.angle);

            // Outer primary swept delta wing
            ctx.beginPath();
            ctx.moveTo(s * 1.45, 0);                 // sharp spear nose
            ctx.lineTo(-s * 0.95, s * 0.9);          // port wingtip
            ctx.lineTo(-s * 0.45, 0);                // recessed trailing thruster notch
            ctx.lineTo(-s * 0.95, -s * 0.9);         // starboard wingtip
            ctx.closePath();
            ctx.fillStyle = darkCore; ctx.fill();
            ctx.strokeStyle = e.color; ctx.lineWidth = 1.8; ctx.stroke();

            // Inner nested booster chevron
            ctx.beginPath();
            ctx.moveTo(s * 0.65, 0);
            ctx.lineTo(-s * 0.35, s * 0.45);
            ctx.lineTo(-s * 0.15, 0);
            ctx.lineTo(-s * 0.35, -s * 0.45);
            ctx.closePath();
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.1; ctx.stroke();

            // Central vector spine
            ctx.beginPath();
            ctx.moveTo(-s * 0.4, 0); ctx.lineTo(s * 1.2, 0);
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2; ctx.stroke();

            // Trailing vector exhaust jet stream
            let thrusterLen = s * (0.4 + Math.sin(G.frame * 0.4) * 0.2);
            ctx.beginPath();
            ctx.moveTo(-s * 0.45, 0); ctx.lineTo(-s * 0.45 - thrusterLen, 0);
            ctx.strokeStyle = e.color; ctx.lineWidth = 2.0; ctx.stroke();

            // Vertex nodes
            addEnemyNode(s * 1.45, 0);
            addEnemyNode(-s * 0.95, s * 0.9);
            addEnemyNode(-s * 0.95, -s * 0.9);
        }
        else {
            // Geometric Rotating Vector Creeps
            let spin = (G.frame * 0.04) + (e.x + e.y) * 0.05;

            if(e.shape === 'hexagon') {
                // --- GeoDefense Classic Creep (Counter-Rotating Vector Hexagon / Diamond) ---
                // Outer Hexagon
                ctx.save();
                ctx.rotate(spin);
                ctx.beginPath();
                for(let k = 0; k < 6; k++) {
                    let v = HEX_VERTS[k];
                    let hx = v.c * s, hy = v.s * s;
                    k === 0 ? ctx.moveTo(hx, hy) : ctx.lineTo(hx, hy);
                    addEnemyNode(hx, hy, spin);
                }
                ctx.closePath();
                ctx.fillStyle = darkCore; ctx.fill();
                ctx.strokeStyle = e.color; ctx.lineWidth = 1.8; ctx.stroke();

                // Diagonal cross-spokes
                ctx.beginPath();
                for(let k = 0; k < 3; k++) {
                    let v = HEX_VERTS[k];
                    ctx.moveTo(v.c * s * 0.9, v.s * s * 0.9);
                    ctx.lineTo(-v.c * s * 0.9, -v.s * s * 0.9);
                }
                ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 0.9; ctx.stroke();
                ctx.restore();

                // Counter-rotating inner diamond core
                ctx.save();
                ctx.rotate(-spin * 1.6);
                ctx.beginPath();
                let is = s * 0.52;
                ctx.moveTo(is, 0); ctx.lineTo(0, is); ctx.lineTo(-is, 0); ctx.lineTo(0, -is);
                ctx.closePath();
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.3; ctx.stroke();
                ctx.restore();

                // Pulsating central nucleus
                let nR = 1.5 + Math.sin(G.frame * 0.15) * 0.6;
                ctx.beginPath(); ctx.arc(0, 0, nR, 0, 6.28);
                ctx.fillStyle = '#ffffff'; ctx.fill();
            }
            else if(e.shape === 'octagon') {
                // --- GeoDefense Armored Fortress (Heavy Dual-Ring Gyroscope Octagon) ---
                // Outer Heavy Octagon
                ctx.save();
                ctx.rotate(spin * 0.7);
                ctx.beginPath();
                for(let k = 0; k < 8; k++) {
                    let v = OCT_VERTS[k];
                    let ox = v.c * s, oy = v.s * s;
                    k === 0 ? ctx.moveTo(ox, oy) : ctx.lineTo(ox, oy);
                    addEnemyNode(ox, oy, spin * 0.7);
                }
                ctx.closePath();
                ctx.fillStyle = darkCore; ctx.fill();
                ctx.strokeStyle = e.color; ctx.lineWidth = 2.0; ctx.stroke();

                // 8 Radial armor-chassis struts
                ctx.beginPath();
                for(let k = 0; k < 8; k++) {
                    let v = OCT_VERTS[k];
                    ctx.moveTo(v.c * s * 0.4, v.s * s * 0.4);
                    ctx.lineTo(v.c * s * 0.95, v.s * s * 0.95);
                }
                ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1.1; ctx.stroke();
                ctx.restore();

                // Counter-rotating reinforced inner octagon
                ctx.save();
                ctx.rotate(-spin * 1.2);
                ctx.beginPath();
                for(let k = 0; k < 8; k++) {
                    let v = OCT_VERTS[k];
                    let mx = v.c * (s * 0.55), my = v.s * (s * 0.55);
                    k === 0 ? ctx.moveTo(mx, my) : ctx.lineTo(mx, my);
                }
                ctx.closePath();
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4; ctx.stroke();
                // Inner structural square
                let sq = s * 0.32;
                ctx.strokeRect(-sq, -sq, sq*2, sq*2);
                ctx.restore();

                // Core reactor pip
                ctx.beginPath(); ctx.arc(0, 0, 2, 0, 6.28);
                ctx.fillStyle = e.color; ctx.fill();
                ctx.beginPath(); ctx.arc(0, 0, 1, 0, 6.28);
                ctx.fillStyle = '#fff'; ctx.fill();
            }
            else if(e.shape === 'decagon') {
                // --- GeoDefense Boss Juggernaut (Multi-Tiered Rotating Vector Super-Fortress) ---
                // Tier 1: Outer 10-gon perimeter ring with corner capacitor nodes
                ctx.save();
                ctx.rotate(spin * 0.5);
                ctx.beginPath();
                for(let k = 0; k < 10; k++) {
                    let v = DEC_VERTS[k];
                    let dx = v.c * s, dy = v.s * s;
                    k === 0 ? ctx.moveTo(dx, dy) : ctx.lineTo(dx, dy);
                    addEnemyNode(dx, dy, spin * 0.5, 1.8);
                }
                ctx.closePath();
                ctx.fillStyle = darkCore; ctx.fill();
                ctx.strokeStyle = e.color; ctx.lineWidth = 2.2; ctx.stroke();

                // 10 Radial power pylons
                ctx.beginPath();
                for(let k = 0; k < 10; k++) {
                    let v = DEC_VERTS[k];
                    ctx.moveTo(v.c * s * 0.5, v.s * s * 0.5);
                    ctx.lineTo(v.c * s * 0.95, v.s * s * 0.95);
                }
                ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1.2; ctx.stroke();
                ctx.restore();

                // Tier 2: Counter-rotating 10-point interlaced star polygon (Decagram shield)
                ctx.save();
                ctx.rotate(-spin * 0.9);
                ctx.beginPath();
                for(let k = 0; k < 10; k++) {
                    let v = DEC_VERTS[k];
                    let r = (k % 2 === 0) ? s * 0.68 : s * 0.38;
                    let sx = v.c * r, sy = v.s * r;
                    k === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
                }
                ctx.closePath();
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.6; ctx.stroke();
                ctx.restore();

                // Tier 3: Inner high-velocity diamond core
                ctx.save();
                ctx.rotate(spin * 2.2);
                let ds = s * 0.25;
                ctx.beginPath();
                ctx.moveTo(ds, 0); ctx.lineTo(0, ds); ctx.lineTo(-ds, 0); ctx.lineTo(0, -ds);
                ctx.closePath();
                ctx.strokeStyle = e.color; ctx.lineWidth = 1.5; ctx.stroke();
                ctx.restore();

                // Pulsating core reactor
                let bNuc = 2.4 + Math.sin(G.frame * 0.2) * 1.0;
                ctx.beginPath(); ctx.arc(0, 0, bNuc, 0, 6.28);
                ctx.fillStyle = '#ffffff'; ctx.fill();
            }
            else {
                // --- GeoDefense Drone / Weaver (Spinning 5-Point Vector Star & Pentagram) ---
                // Outer spinning pentagon
                ctx.save();
                ctx.rotate(spin * 1.1);
                ctx.beginPath();
                for(let k = 0; k < 5; k++) {
                    let v = PENT_VERTS[k];
                    let px = v.c * s, py = v.s * s;
                    k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                    addEnemyNode(px, py, spin * 1.1);
                }
                ctx.closePath();
                ctx.fillStyle = darkCore; ctx.fill();
                ctx.strokeStyle = e.color; ctx.lineWidth = 1.8; ctx.stroke();

                // Intersecting sacred geometry pentagram (Weaver lines)
                ctx.beginPath();
                for(let k = 0; k < 5; k++) {
                    let v1 = PENT_VERTS[k];
                    let v2 = PENT_VERTS[(k + 2) % 5];
                    ctx.moveTo(v1.c * s * 0.92, v1.s * s * 0.92);
                    ctx.lineTo(v2.c * s * 0.92, v2.s * s * 0.92);
                }
                ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.1; ctx.stroke();
                ctx.restore();

                // Counter-rotating inner mini-pentagon
                ctx.save();
                ctx.rotate(-spin * 1.8);
                ctx.beginPath();
                for(let k = 0; k < 5; k++) {
                    let v = PENT_VERTS[k];
                    let px = v.c * (s * 0.38), py = v.s * (s * 0.38);
                    k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2; ctx.stroke();
                ctx.restore();

                // Core node
                ctx.beginPath(); ctx.arc(0, 0, 1.4, 0, 6.28);
                ctx.fillStyle = '#ffffff'; ctx.fill();
            }
        }

        // --- Render Bright Glowing Vertex Nodes (CRT Vector Corner Pip Emulation - Zero GC) ---
        if(sharedNodeCount > 0) {
            ctx.beginPath();
            for(let ni = 0; ni < sharedNodeCount; ni++) {
                let pt = SHARED_ENEMY_NODES[ni];
                let px = pt.x, py = pt.y;
                if(pt.spin !== undefined) {
                    let cos = Math.cos(pt.spin), sin = Math.sin(pt.spin);
                    px = pt.x * cos - pt.y * sin;
                    py = pt.x * sin + pt.y * cos;
                }
                let nr = pt.r || 1.35;
                ctx.moveTo(px + nr, py);
                ctx.arc(px, py, nr, 0, 6.28);
            }
            ctx.fillStyle = '#ffffff';
            ctx.fill();
        }

        // --- Health Bar (Neon Vector Status Line) ---
        let bw = Math.max(14, s * 1.6);
        let hpPct = Math.max(0, Math.min(1, e.hp / e.max));
        let barY = -s - 6;
        // Background track with subtle border
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(-bw/2, barY, bw, 2.5);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(-bw/2, barY, bw, 2.5);
        // Dynamic health color (Neon Cyan -> Yellow -> Neon Red)
        let hpCol = hpPct > 0.5 ? '#00ffcc' : (hpPct > 0.25 ? '#ffcc00' : '#ff0055');
        ctx.fillStyle = hpCol;
        ctx.fillRect(-bw/2, barY, bw * hpPct, 2.5);

        ctx.restore();
    });

    G.projs.forEach(p => { 
        if(p.type === 'missile') {
            // Aerodynamic vector rocket: pointed nose cone, slender body, stabilizer fins
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle || 0);
            ctx.strokeStyle = p.color;
            ctx.fillStyle = '#fff';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            // Rocket fuselage
            ctx.moveTo(7, 0);       // sharp nose
            ctx.lineTo(2, 2.5);
            ctx.lineTo(-5, 2.5);
            // Delta tail fin
            ctx.lineTo(-7, 4.5);
            ctx.lineTo(-6, 2.5);
            ctx.lineTo(-6, -2.5);
            ctx.lineTo(-7, -4.5);
            ctx.lineTo(-5, -2.5);
            ctx.lineTo(2, -2.5);
            ctx.closePath();
            ctx.stroke();
            // Thruster flame dot
            ctx.fillStyle = '#ff8800';
            ctx.beginPath();
            ctx.arc(-7, 0, 1.8, 0, 6.28);
            ctx.fill();
            ctx.restore();
        } else if(p.type === 'sniper') {
            // Realistic High-Velocity Kinetic Bullet (Spitzer ogive bullet with glowing supersonic tracer tail)
            let bAngle = Math.atan2(p.vy, p.vx);
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(bAngle);

            // Supersonic mach tracer streak trailing behind the bullet
            ctx.strokeStyle = '#d0f';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.moveTo(-5, 0);
            ctx.lineTo(-24, 0);
            ctx.stroke();

            // Inner white-hot tracer core
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.0;
            ctx.beginPath();
            ctx.moveTo(-4, 0);
            ctx.lineTo(-15, 0);
            ctx.stroke();

            // Realistic bullet profile: cylindrical boat-tail base + aerodynamic pointed ogive tip
            ctx.fillStyle = '#f0c050'; // Polished brass/copper jacket
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1.0;
            ctx.beginPath();
            ctx.moveTo(6, 0);                 // Sharp spitzer tip point
            ctx.quadraticCurveTo(3, 1.8, 0, 1.8); // Curved ogive contour
            ctx.lineTo(-5, 1.8);              // Cylindrical body
            ctx.lineTo(-7, 1.0);              // Tapered boat-tail heel
            ctx.lineTo(-7, -1.0);
            ctx.lineTo(-5, -1.8);
            ctx.lineTo(0, -1.8);
            ctx.quadraticCurveTo(3, -1.8, 6, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Tip specular glint
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(4, 0, 0.8, 0, 6.28);
            ctx.fill();

        } else if(p.type === 'bolt') {
            // Blaster cannon shell: elongated vector slug with bright core & tracer tail strictly aligned to barrel angle
            let sAngle = Math.atan2(p.vy, p.vx);
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(sAngle);

            // High-intensity tracer streak aligned with the barrel axis
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(3, 0);
            ctx.lineTo(-11, 0);
            ctx.stroke();

            // Inner white-hot ballistic core
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(4, 0);
            ctx.lineTo(-6, 0);
            ctx.stroke();

            // Front luminous plasma bead
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(3.5, 0, 1.8, 0, 6.28);
            ctx.fill();

            ctx.restore();
        } else {
            ctx.fillStyle = p.color; 
            ctx.beginPath(); 
            ctx.arc(p.x, p.y, p.type==='frag'?2:3, 0, 6.28); 
            ctx.fill(); 
        }
    });

    // Flying single-pixel energy particles homing into Collector (Zero-GC Pool)
    for(let i = 0; i < MAX_ENERGY_ORBS; i++) {
        let orb = energyOrbPool[i];
        if(orb.active) {
            ctx.fillStyle = orb.color;
            ctx.fillRect(Math.round(orb.x), Math.round(orb.y), 1, 1);
        }
    }
    
    if(G.enableFX) {
        for(let i=0; i<MAX_SHOCKS; i++) {
            let s = shockPool[i];
            if(s.active) {
                ctx.strokeStyle = s.color; ctx.globalAlpha = s.alpha; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.stroke();
            }
        }
        ctx.globalAlpha = 1;
        for(let i=0; i<MAX_PARTS; i++) {
            let p = particlePool[i];
            if(p.active) {
                ctx.globalAlpha = p.life;
                if(p.type === 'halo') {
                    ctx.strokeStyle = p.color; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28); ctx.stroke();
                } else if(p.type === 'spark') {
                    ctx.strokeStyle = p.color; ctx.lineWidth = p.r || 1.8;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x - p.vx * 2.2, p.y - p.vy * 2.2);
                    ctx.stroke();
                } else if(p.type === 'text') {
                    ctx.fillStyle = p.color; ctx.font = "bold 13px Courier New"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(p.text || "-1 HP", p.x, p.y);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r || 1.8, 0, 6.28);
                    ctx.fill();
                }
            }
        }
        ctx.globalAlpha = 1;
    }

    if(G.dragType) {
        let ghostY = G.dragPos.y - dragLift();
        let hex = pixelToHex(G.dragPos.x, ghostY); 
        let data = TOWER_DATA[G.dragType];
        let placeCheck = hex ? testPlacement(hex) : { canBuild: false, hasTrail: false, valid: false };
        let isValid = hex && placeCheck.valid;
        let previewColor = isValid ? data.color : '#ff0033';

        ctx.strokeStyle = previewColor; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.arc(G.dragPos.x, ghostY, data.range, 0, 6.28); ctx.stroke(); ctx.setLineDash([]);
        ctx.save(); ctx.translate(G.dragPos.x, ghostY);
        let scale = G.hexR / 20; ctx.scale(scale, scale);
        drawTowerShape(ctx, data.type, 1, previewColor);
        ctx.restore();
        if(hex) {
            drawHexSolid(hex.x, hex.y, G.hexR, previewColor, isValid ? 0.45 : 0.6);
            if(!isValid) {
                ctx.strokeStyle = '#ff0033';
                ctx.lineWidth = 2.0;
                ctx.beginPath();
                hexPath(hex.x, hex.y, G.hexR * 0.95);
                ctx.stroke();
                ctx.lineWidth = 1.0;
            }
        }
    }
    
    if(G.selected) {
        ctx.strokeStyle='#fff'; ctx.setLineDash([5,5]); ctx.beginPath(); 
        ctx.arc(G.selected.x, G.selected.y, towerRange(G.selected), 0, 6.28); 
        ctx.stroke(); ctx.setLineDash([]);
    }
    
    ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur=0;

    // Perimeter Danger Flash when Endpoint Base is Breached
    if(G.endHit > 0) {
        ctx.save();
        ctx.setTransform(1,0,0,1,0,0);
        let flashAlpha = (G.endHit / 30) * 0.4;
        ctx.fillStyle = `rgba(255, 0, 50, ${flashAlpha * 0.2})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = `rgba(255, 0, 50, ${flashAlpha})`;
        ctx.lineWidth = Math.max(4, Math.round(14 * (G.endHit / 30)));
        ctx.strokeRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
    }
}

// --- Utils ---
function setTimer(s) { G.waveTimer = s*60; } // counted in logic frames (~60/s), so it respects pause and 2x speed
function hexPath(x,y,r,targetCtx=ctx) { for(let i=0;i<6;i++) { let a=Math.PI/3*i - Math.PI/6; i===0?targetCtx.moveTo(x+r*Math.cos(a),y+r*Math.sin(a)):targetCtx.lineTo(x+r*Math.cos(a),y+r*Math.sin(a)); } targetCtx.closePath(); }
function drawHexSolid(x,y,r,c,a=1,targetCtx=ctx) { targetCtx.fillStyle=c; targetCtx.globalAlpha=a; targetCtx.beginPath(); hexPath(x,y,r,targetCtx); targetCtx.fill(); targetCtx.globalAlpha=1; }
function drawElectricArc(ctx, x1, y1, x2, y2, color, coreColor) {
    let dx = x2 - x1, dy = y2 - y1;
    let d = Math.hypot(dx, dy);
    if(d < 1) return;
    let steps = Math.max(3, Math.floor(d / 18));
    let nx = -dy / d, ny = dx / d;
    
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    for(let i = 1; i < steps; i++) {
        let t = i / steps;
        let jitter = (Math.random() - 0.5) * 14 * Math.sin(t * Math.PI);
        let px = x1 + dx * t + nx * jitter;
        let py = y1 + dy * t + ny * jitter;
        ctx.lineTo(px, py);
    }
    ctx.lineTo(x2, y2);
    ctx.stroke();

    ctx.strokeStyle = coreColor || '#ffffff';
    ctx.lineWidth = 1.0;
    ctx.stroke();
    ctx.restore();
}

function drawTowerShape(ctx, type, lvl, color) {
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1.8; ctx.beginPath();
    
    if(type === 'bolt') {
        // --- 1. BLASTER: Round Base Turret + Barrels ---
        ctx.arc(0, 0, 7.5, 0, 6.28);
        ctx.moveTo(4, 0); ctx.arc(0, 0, 4, 0, 6.28);
        ctx.moveTo(1.5, 0); ctx.arc(0, 0, 1.5, 0, 6.28);
        if(lvl === 1) {
            // GeoDefense Classic single barrel
            ctx.moveTo(6, -2.5); ctx.lineTo(14, -2.5); ctx.lineTo(14, 2.5); ctx.lineTo(6, 2.5);
        } else if(lvl === 2) {
            // Flared muzzle brake + rear recoil dampeners
            ctx.moveTo(6, -2.5); ctx.lineTo(15, -2.5); ctx.lineTo(17, -4); ctx.lineTo(17, 4); ctx.lineTo(15, 2.5); ctx.lineTo(6, 2.5);
            ctx.moveTo(-4, -5); ctx.lineTo(-7, -5);
            ctx.moveTo(-4, 5); ctx.lineTo(-7, 5);
        } else if(lvl === 3) {
            // Twin parallel barrels + side fins
            ctx.moveTo(5, -3.5); ctx.lineTo(16, -3.5); ctx.lineTo(16, -1.5); ctx.lineTo(5, -1.5);
            ctx.moveTo(5, 1.5); ctx.lineTo(16, 1.5); ctx.lineTo(16, 3.5); ctx.lineTo(5, 3.5);
            ctx.moveTo(3, -6); ctx.lineTo(9, -7.5);
            ctx.moveTo(3, 6); ctx.lineTo(9, 7.5);
        } else if(lvl === 4) {
            // Heavy twin cannon + armored mantlet plate + angular wings
            ctx.moveTo(5, -4); ctx.lineTo(17, -4); ctx.lineTo(17, -1.5); ctx.lineTo(5, -1.5);
            ctx.moveTo(5, 1.5); ctx.lineTo(17, 1.5); ctx.lineTo(17, 4); ctx.lineTo(5, 4);
            ctx.moveTo(5, -7); ctx.lineTo(5, 7);
            ctx.moveTo(0, -7); ctx.lineTo(7, -8.5); ctx.lineTo(10, -6.5);
            ctx.moveTo(0, 7); ctx.lineTo(7, 8.5); ctx.lineTo(10, 6.5);
        } else if(lvl === 5) {
            // Triple rotary vulcan cluster + muzzle clamp
            ctx.moveTo(5, -4.5); ctx.lineTo(15, -4.5); ctx.lineTo(15, -2.8); ctx.lineTo(5, -2.8);
            ctx.moveTo(6, -1.0); ctx.lineTo(18, -1.0); ctx.lineTo(18, 1.0); ctx.lineTo(6, 1.0);
            ctx.moveTo(5, 2.8); ctx.lineTo(15, 2.8); ctx.lineTo(15, 4.5); ctx.lineTo(5, 4.5);
            ctx.moveTo(13, -5.5); ctx.lineTo(13, 5.5);
            ctx.moveTo(-2, -8); ctx.lineTo(6, -10); ctx.lineTo(11, -8);
            ctx.moveTo(-2, 8); ctx.lineTo(6, 10); ctx.lineTo(11, 8);
        } else {
            // Lv 6: Quad vulcan overlord array + dual clamps + heavy rear manifold
            ctx.moveTo(5, -5.5); ctx.lineTo(17, -5.5); ctx.lineTo(17, -3.8); ctx.lineTo(5, -3.8);
            ctx.moveTo(6, -2.8); ctx.lineTo(19, -2.8); ctx.lineTo(19, -1.0); ctx.lineTo(6, -1.0);
            ctx.moveTo(6, 1.0); ctx.lineTo(19, 1.0); ctx.lineTo(19, 2.8); ctx.lineTo(6, 2.8);
            ctx.moveTo(5, 3.8); ctx.lineTo(17, 3.8); ctx.lineTo(17, 5.5); ctx.lineTo(5, 5.5);
            ctx.moveTo(12, -6.5); ctx.lineTo(12, 6.5);
            ctx.moveTo(16, -6.5); ctx.lineTo(16, 6.5);
            ctx.moveTo(-7, -4); ctx.lineTo(-11, -5); ctx.lineTo(-11, -2);
            ctx.moveTo(-7, 4); ctx.lineTo(-11, 5); ctx.lineTo(-11, 2);
            ctx.moveTo(-3, -8); ctx.lineTo(6, -11); ctx.lineTo(12, -9);
            ctx.moveTo(-3, 8); ctx.lineTo(6, 11); ctx.lineTo(12, 9);
        }
    }
    else if(type === 'laser') {
        // --- 2. LASER: Prism Emitter + Calipers & Optical Lenses ---
        ctx.moveTo(10, 0); ctx.lineTo(-7, 8); ctx.lineTo(-4, 0); ctx.lineTo(-7, -8); ctx.closePath();
        ctx.moveTo(3, 0); ctx.arc(0, 0, 3, 0, 6.28);
        if(lvl === 1) {
            // GeoDefense needle + single calipers
            ctx.moveTo(6, 0); ctx.lineTo(14, 0);
            ctx.moveTo(10, -3.5); ctx.lineTo(13, 0); ctx.lineTo(10, 3.5);
