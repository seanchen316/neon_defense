// First-time setup: size the map to the container and build it.
function resize() {
    let rect = container.getBoundingClientRect();
    G.w = rect.width; G.h = rect.height;
    let minDim = Math.min(G.w, G.h);
    G.hexR = Math.max(14, Math.floor(minDim / 22)); 
    if(G.hexR > 35) G.hexR = 35;
    initGrid();
    fitView();
}

// Keep the existing map and scale/centre it to the current container size.
function fitView() {
    let rect = container.getBoundingClientRect();
    canvas.width = rect.width; canvas.height = rect.height;
    let s = Math.min(rect.width/G.w, rect.height/G.h);
    G.view = { s, ox:(rect.width - G.w*s)/2, oy:(rect.height - G.h*s)/2 };
    closeMenu();
}
window.addEventListener('resize', () => { if(G.grid.length) { fitView(); draw(); } });

function canBuildOn(hex) {
    return hex && !hex.occ && hex.type === 'floor' && !hex.wall && hex !== G.start && hex !== G.end && !hex.tower;
}

function initGrid() {
    let validMap = false;
    let attempts = 0;
    while(!validMap && attempts++ < 150) {
        G.grid = [];
        G.warpIn = null;
        G.warpOut = null;
        const w = G.hexR * Math.sqrt(3); const h = G.hexR * 2; const vDist = h * 0.75;
        // Fit whole hexes: odd rows are shifted right by w/2, so total width = cols*w + w/2;
        // total height = (rows-1)*vDist + h.
        const cols = Math.floor((G.w - w/2) / w); const rows = Math.floor((G.h - h) / vDist) + 1;
        const offX = (G.w - (cols*w + w/2))/2 + w/2; const offY = (G.h - ((rows-1)*vDist + h))/2 + h/2;
        let floorTiles = [];
        for(let r=0; r<rows; r++) {
            for(let q=0; q<cols; q++) {
                let cx = offX + q * w + (r%2 ? w/2 : 0); let cy = offY + r * vDist;
                // Outer wall: first/last row and first/last cell of every row -> sealed on all 4 sides
                let isWall = (r === 0 || r === rows-1 || q === 0 || q === cols-1);
                let isObstacle = isWall || (Math.random() < 0.08); // slightly lower rock rate to allow special obstacles
                let cell = { q, r, x:cx, y:cy, occ: isObstacle, type: isWall ? 'wall' : (isObstacle ? 'obs' : 'floor'), wall: isWall, id: r*1000+q };
                G.grid.push(cell); if(!isObstacle) floorTiles.push(cell);
            }
        }
        G.grid.forEach(c => c.nb = G.grid.filter(n => n!==c && dist(c,n) < G.hexR*2.1)); // neighbour cache
        let minD = G.w*0.45; let tries=0;
        do {
            G.start = floorTiles[Math.floor(Math.random()*floorTiles.length)];
            G.end = floorTiles[Math.floor(Math.random()*floorTiles.length)];
            tries++;
        } while(dist(G.start,G.end) < minD && tries<100);
        
        G.start.occ=false; G.start.type='floor'; G.end.occ=false; G.end.type='floor';
        // Clear obstacles around start/end, but never outer boundary
        getNeighbors(G.start).forEach(n=>{ if(!n.wall) { n.occ=false; n.type='floor'; } });
        getNeighbors(G.end).forEach(n=>{ if(!n.wall) { n.occ=false; n.type='floor'; } });

        // Select candidates for tactical obstacles (must be open floor away from start/end)
        let candidates = floorTiles.filter(c => c !== G.start && c !== G.end && !getNeighbors(G.start).includes(c) && !getNeighbors(G.end).includes(c) && !c.wall);

        // 1. Transmit Points (Warp Gate: warp_in & warp_out)
        if(candidates.length >= 10) {
            let pTries = 0, pIn = null, pOut = null;
            while(pTries++ < 60 && (!pIn || !pOut)) {
                let c1 = candidates[Math.floor(Math.random() * candidates.length)];
                let c2 = candidates[Math.floor(Math.random() * candidates.length)];
                if(c1 !== c2 && dist(c1, c2) >= G.w * 0.35 && dist(c1, G.end) > G.hexR * 2.5 && dist(c2, G.start) > G.hexR * 2.5) {
                    let c1Walkable = getNeighbors(c1).filter(n => !n.wall && !n.occ).length;
                    let c2Walkable = getNeighbors(c2).filter(n => !n.wall && !n.occ).length;
                    if(c1Walkable >= 2 && c2Walkable >= 2) {
                        pIn = c1; pOut = c2;
                    }
                }
            }
            if(pIn && pOut) {
                G.warpIn = pIn; G.warpIn.type = 'warp_in'; G.warpIn.occ = false;
                G.warpOut = pOut; G.warpOut.type = 'warp_out'; G.warpOut.occ = false;
                candidates = candidates.filter(c => c !== pIn && c !== pOut);
            }
        }

        // 2. Speed Up Pads (2 pads)
        for(let i = 0; i < 2 && candidates.length > 0; i++) {
            let idx = Math.floor(Math.random() * candidates.length);
            let c = candidates.splice(idx, 1)[0];
            c.type = 'speed_pad';
        }

        // 3. Slow Down / Graviton Pads (2 pads)
        for(let i = 0; i < 2 && candidates.length > 0; i++) {
            let idx = Math.floor(Math.random() * candidates.length);
            let c = candidates.splice(idx, 1)[0];
            c.type = 'slow_pad';
        }

        // 4. Single Way Conduits (2 one-way directional conduits)
        for(let i = 0; i < 2 && candidates.length > 0; i++) {
            let validCandidates = candidates.filter(c => {
                let walkableNeighbors = getNeighbors(c).filter(n => !n.wall && n.type !== 'obs' && !n.occ);
                return walkableNeighbors.length >= 2;
            });
            if(validCandidates.length > 0) {
                let c = validCandidates[Math.floor(Math.random() * validCandidates.length)];
                candidates = candidates.filter(cand => cand !== c);
                let walkableNeighbors = getNeighbors(c).filter(n => !n.wall && n.type !== 'obs' && !n.occ);
                let targetN = walkableNeighbors[Math.floor(Math.random() * walkableNeighbors.length)];
                c.type = 'oneway';
                c.onewayTarget = targetN;
                c.dirAngle = Math.atan2(targetN.y - c.y, targetN.x - c.x);
            }
        }

        if(calcPath()) { validMap = true; renderBgCache(); }
    }
}

function getTransitions(cur) {
    if(!cur || cur.occ || cur.tower) return [];
    let list = [];

    // Warp Gate entrance: you can ONLY warp to warp_out (cannot step out onto physical neighbors)
    if(cur.type === 'warp_in') {
        if(G.warpOut && !G.warpOut.occ && !G.warpOut.tower) {
            list.push({ to: G.warpOut, cost: 0.8 });
        }
        return list;
    }

    for(let n of getNeighbors(cur)) {
        if(n.occ || n.tower) continue;

        // If currently on a one-way conduit, must exit along onewayTarget
        if(cur.type === 'oneway' && cur.onewayTarget) {
            if(n !== cur.onewayTarget) continue;
        }

        // If entering a one-way conduit, cannot enter against the arrow
        if(n.type === 'oneway' && n.onewayTarget) {
            if(n.onewayTarget === cur) continue;
        }

        let stepCost = 1.0;
        if(n.type === 'speed_pad') stepCost = 0.5; // Pathfinding favors speed pads
        else if(n.type === 'slow_pad') stepCost = 1.3;

        list.push({ to: n, cost: stepCost });
    }
    return list;
}

function calcPath(tempBlock=null) {
    if(tempBlock) tempBlock.occ=true;
    let path = findPath(G.start, G.end);
    if(tempBlock) tempBlock.occ=false;
    if(path) G.path = path;
    return path;
}

// A* from 'from' to 'to' over unoccupied cells using directional transitions.
function findPath(from, to) {
    if(!from || from.occ || from.tower || !to || to.occ || to.tower) return null;
    let open=[from], cameFrom=new Map(), gScore=new Map();
    gScore.set(from, 0); let found=false;
    const h = (a) => {
        let dDirect = dist(a, to);
        if(G.warpIn && G.warpOut && !G.warpOut.occ && !G.warpOut.tower) {
            let dWarp = dist(a, G.warpIn) + dist(G.warpOut, to);
            return Math.min(dDirect, dWarp);
        }
        return dDirect;
    };
    while(open.length>0) {
        open.sort((a,b)=>(gScore.get(a)+h(a))-(gScore.get(b)+h(b)));
        let cur=open.shift();
        if(cur===to){found=true; break;}
        for(let trans of getTransitions(cur)) {
            let n = trans.to;
            let g = gScore.get(cur) + trans.cost;
            if(g < (gScore.get(n) || Infinity)) {
                cameFrom.set(n, cur);
                gScore.set(n, g);
                if(!open.includes(n)) open.push(n);
            }
        }
    }
    if(!found) return null;
    let path=[], curr=to;
    while(curr!==from) { path.push(curr); curr=cameFrom.get(curr); }
    path.push(from);
    return path.reverse();
}

// Plan a new route for every live enemy from where it is now.
function planEnemyRoutes(tempBlock=null) {
    if(tempBlock) tempBlock.occ = true;
    let cache = new Map(), plans = [];
    for(let e of G.enemies) {
        let tgt = e.path[e.pi];
        let origin = (tgt && !tgt.occ && !tgt.tower) ? tgt : e.prev;
        if(!origin || origin.occ || origin.tower) {
            if(tempBlock) tempBlock.occ = false;
            return null;
        }
        if(!cache.has(origin)) cache.set(origin, findPath(origin, G.end));
        let p = cache.get(origin);
        if(!p) {
            if(tempBlock) tempBlock.occ = false;
            return null;
        }
        plans.push(p);
    }
    if(tempBlock) tempBlock.occ = false;
    return plans;
}
function applyEnemyRoutes(plans) { G.enemies.forEach((e,i) => { e.path = plans[i]; e.pi = 0; }); }

// --- Logic ---
function loop() {
    requestAnimationFrame(loop);
    if(!G.active) return;
    if(!G.paused) {
        let loops = G.speed; while(loops-- && G.active) { G.frame++; updateLogic(); }
    }
    draw();
}

function updateLogic() {
    if(G.spawning) {
        let rate = Math.max(15, 35 - G.wave); 
        if(G.spawnQ>0 && G.frame%rate===0) { 
            spawnEnemy(); G.spawnQ--; 
            if(G.spawnQ<=0) { G.spawning=false; setTimer(10); } 
        }
    }
    if(G.waveTimer>0 && --G.waveTimer<=0) startWave();
    
    let tSpan=document.getElementById('ui-timer');
    if(G.waveTimer>0) {
        document.getElementById('btn-wave').style.display='flex';
        tSpan.innerText = Math.ceil(G.waveTimer/60);
    } else document.getElementById('btn-wave').style.display='none';

    // Buffs (strongest nearby Collector wins; they don't stack)
    G.towers.forEach(t => t.buffVal=1);
    G.towers.filter(t=>t.type==='buff').forEach(c => {
        let cRange = towerRange(c);
        G.towers.forEach(t => { if(t!==c && dist(c,t)<=cRange+10) t.buffVal = Math.max(t.buffVal, 1.25+(c.lvl*0.1)); });
    });

    // Towers
    G.towers.forEach(t => {
        if(t.cd>0) t.cd--;
        let buff = t.buffVal || 1;
        let range = towerRange(t);

        // Check if current target is invalid (dead or reached)
        if(t.target && (t.target.hp<=0 || t.target.reached)) {
            t.target = null;
        }

        if(t.type === 'laser') {
            let hasTarget = false;
            let reach = Math.max(G.w, G.h) * 1.5;
            if(t.lockedAngle != null) {
                t.angle = t.lockedAngle;
                let ex = t.x + Math.cos(t.angle) * reach;
                let ey = t.y + Math.sin(t.angle) * reach;
                // Only fire if there is at least one VALID target in line of the beam
                hasTarget = G.enemies.some(e => e.hp>0 && !e.reached && distToSegment({x:t.x, y:t.y}, {x:ex, y:ey}, e) < (e.size || 10));
            } else {
                if(!t.target || dist(t,t.target)>range) {
                    // Find closest valid target
                    let best = Infinity;
                    t.target = null;
                    G.enemies.forEach(e => {
                        if(e.hp>0 && !e.reached) {
                            let d = dist(t,e);
                            if(d <= range && d < best) { best=d; t.target=e; }
                        }
                    });
                }
                if(t.target) {
                    t.angle = Math.atan2(t.target.y-t.y, t.target.x-t.x);
                    hasTarget = true;
                }
            }
            if(hasTarget) fireLaser(t, buff);
        } else if(t.type === 'shock') {
            let maxTargets = 2 + t.lvl;
            // Only shock valid enemies
            t.targets = G.enemies.filter(e => dist(t,e) <= range && e.hp>0 && !e.reached).slice(0, maxTargets);
            t.targets.forEach(e => { if(G.frame%t.rate===0) { let grav = e.inGraviton > 0 ? 0.6 : 1.0; e.hp-=t.dmg*(1+t.lvl*0.5)*buff*grav; e.slow=20; } });
        } else if(t.type !== 'buff') {
            if(!t.target || dist(t,t.target)>range) {
                // Find closest valid target
                let best = Infinity;
                t.target = null;
                G.enemies.forEach(e => {
                    if(e.hp>0 && !e.reached) {
                        let d = dist(t,e);
                        if(d <= range && d < best) { best=d; t.target=e; }
                    }
                });
            }
            if(t.target) {
                t.angle = Math.atan2(t.target.y-t.y, t.target.x-t.x);
                if(t.cd<=0) {
                    let dmg = t.dmg * Math.pow(1.4, t.lvl-1) * buff;
                    let scale = G.hexR / 20;
                    if(t.type === 'missile') {
                        // Rocket launch: emerges from missile tube tip
                        let bDist = 12 * scale;
                        let spawnX = t.x + Math.cos(t.angle) * bDist;
                        let spawnY = t.y + Math.sin(t.angle) * bDist;
                        G.projs.push({ 
                            x:spawnX, y:spawnY, 
                            vx:Math.cos(t.angle), vy:Math.sin(t.angle), 
                            spd:4.5, maxSpd:11 + Math.min(t.lvl, 6)*0.8,
                            dmg:dmg, color:t.color, type:'missile', 
                            splash:t.splash||50, tar:t.target, life:110, angle:t.angle 
                        });
                        t.cd = t.rate/(1+(t.lvl-1)*0.15);
                        if(G.enableFX) playSound('missile');
                    } else if(t.type === 'sniper') {
                        // High-velocity kinetic bullet with supersonic tracer emerges from rail muzzle
                        let bDist = (14 + Math.min(t.lvl, 6) * 1.2) * scale;
                        let spawnX = t.x + Math.cos(t.angle) * bDist;
                        let spawnY = t.y + Math.sin(t.angle) * bDist;
                        G.projs.push({
                            x:spawnX, y:spawnY,
                            vx:Math.cos(t.angle), vy:Math.sin(t.angle),
                            spd:24, dmg:dmg, color:t.color, type:'sniper',
                            tar:t.target, life:55, angle:t.angle
                        });
                        t.cd = t.rate/(1+(t.lvl-1)*0.15);
                        if(G.enableFX) {
                            playSound('sniper');
                            fx(spawnX, spawnY, '#ffffff', 4);
                        }
                    } else {
                        // Blaster shell: aligns perfectly with barrel muzzle
                        let bDist = (12 + Math.min(t.lvl, 6) * 1.2) * scale;
                        let spawnX = t.x + Math.cos(t.angle) * bDist;
                        let spawnY = t.y + Math.sin(t.angle) * bDist;
                        G.projs.push({ 
                            x:spawnX, y:spawnY, 
                            vx:Math.cos(t.angle), vy:Math.sin(t.angle), 
                            spd:11, dmg:dmg, color:t.color, type:t.type, 
                            splash:t.splash||0, tar:t.target, life:80, angle:t.angle 
                        });
                        t.cd = t.rate/(1+(t.lvl-1)*0.15); 
                        if(G.enableFX) {
                            playSound('shoot');
                            fx(spawnX, spawnY, t.color, 2); // crisp muzzle flash spark
                        }
                    }
                }
            }
        }
    });

    for(let i=G.projs.length-1; i>=0; i--) {
        let p=G.projs[i]; p.life--;
        // Missile Aerodynamic Homing & Rocket Propulsion
        if(p.type==='missile') {
            if(p.spd < p.maxSpd) p.spd += 0.25; // Accelerating rocket thruster
            if(p.tar && p.tar.hp>0 && !p.tar.reached) { 
                let ta = Math.atan2(p.tar.y-p.y, p.tar.x-p.x); 
                // Steer velocity toward target with turn rate
                p.vx = p.vx*0.88 + Math.cos(ta)*0.12; 
                p.vy = p.vy*0.88 + Math.sin(ta)*0.12;
                let vLen = Math.hypot(p.vx, p.vy) || 1;
                p.vx /= vLen; p.vy /= vLen;
                p.angle = Math.atan2(p.vy, p.vx);
            } else {
                p.tar = null; // target dead/escaped, rocket continues on current ballistic vector
            }
            // Emit neon smoke/exhaust particle trail from object pool
            if(G.enableFX && G.frame % 2 === 0) {
                let backX = p.x - Math.cos(p.angle || 0) * 8;
                let backY = p.y - Math.sin(p.angle || 0) * 8;
                spawnParticle(
                    backX, backY,
                    (Math.random()-0.5)*1.2 - Math.cos(p.angle||0)*1.5,
                    (Math.random()-0.5)*1.2 - Math.sin(p.angle||0)*1.5,
                    0.7, (Math.random() > 0.4 ? '#ff3300' : '#ffaa00'), 'dot', 2
                );
            }
        }

        let prevX = p.x, prevY = p.y;
        p.x+=p.vx*p.spd; p.y+=p.vy*p.spd; if(p.type==='frag') p.spd*=0.9;
        
        // Collision Detection - Ignore Reached/Dead (anti-tunneling segment check scaled to grid)
        let hitRad = (p.type==='missile' ? (G.hexR * 0.75) : (G.hexR * 0.42));
        let hit = G.enemies.find(e => {
            if(e.hp<=0 || e.reached) return false;
            let combinedR = hitRad + (e.size || 8)*0.5;
            return dist(p, e) < combinedR || distToSegment({x:prevX, y:prevY}, {x:p.x, y:p.y}, e) < combinedR;
        });
        if(hit || p.life<=0) {
            if(hit || (p.type==='missile' && p.life<=0)) {
                if(p.type==='missile') {
                    if(G.enableFX) { playSound('boom'); fxExplode(p.x,p.y,p.color,12); spawnShock(p.x, p.y, p.color, 60); }
                    G.enemies.forEach(e=>{
                        if(dist(p,e)<p.splash && e.hp>0 && !e.reached) {
                            let grav = e.inGraviton > 0 ? 0.6 : 1.0;
                            e.hp -= p.dmg * grav;
                        }
                    });
                    for(let k=0;k<4;k++){ let a=Math.random()*6.28; G.projs.push({x:p.x,y:p.y,vx:Math.cos(a),vy:Math.sin(a),spd:6,dmg:p.dmg*0.3,color:'#fa0',type:'frag',life:20}); }
                } else if (hit) { // Single target hit
                    let grav = hit.inGraviton > 0 ? 0.6 : 1.0;
                    hit.hp -= p.dmg * grav; 
                    if(G.enableFX) fx(p.x,p.y,p.color,3); 
                }
            }
            if(hit||p.life<=0) G.projs.splice(i,1);
        }
    }

    for(let i=G.enemies.length-1; i>=0; i--) {
        let e=G.enemies[i];
        if(e.hp<=0) { 
            let sMult = (DIFFICULTY_CONFIG[G.difficulty] || DIFFICULTY_CONFIG.normal).scoreMult;
            G.cash += e.val; 
            G.score += Math.round(e.val * 10 * sMult); 
            fxEnemyDestroy(e);
            updateUI(); G.enemies.splice(i,1); continue; 
        }
        
        // Pathing
        let target = e.path[e.pi];
        // Check end condition
        if(dist(e, G.end) < G.hexR) {
            e.reached = true; // Mark as reached so towers ignore it
            G.enemies.splice(i,1); loseLife();
            playSound('breach');
            G.endHit = 30;
            if(G.enableFX) {
                fxExplode(G.end.x, G.end.y, '#ff0033', 30);
                fxExplode(G.end.x, G.end.y, '#ffffff', 16);
                fxExplode(G.end.x, G.end.y, e.color || '#ff8800', 14);
                spawnShock(G.end.x, G.end.y, '#ff0044', G.hexR * 3.8);
                spawnShock(G.end.x, G.end.y, '#ffffff', G.hexR * 2.2);
                fxHalo(G.end.x, G.end.y, '#ff0044');
                fxHalo(G.end.x, G.end.y, '#ffcc00');
                spawnParticle(G.end.x, G.end.y - 10, 0, -1.0, 1.0, '#ff2244', 'text', 0, '-1 HP');
            }
            continue;
        }

        if(target) {
            let tx=target.x+e.ox, ty=target.y+e.oy;
            let moveSpd = e.spd * (e.slow>0 ? 0.4 : 1); if(e.slow>0) e.slow--;
            if(e.speedBoost > 0) { moveSpd *= 1.75; e.speedBoost--; if(G.enableFX && G.frame % 3 === 0) fx(e.x, e.y, '#ffdd00', 1); }
            if(e.inGraviton > 0) { moveSpd *= 0.55; e.inGraviton--; if(G.enableFX && G.frame % 4 === 0) fx(e.x, e.y, '#cc33ff', 1); }

            let dx=tx-e.x, dy=ty-e.y, d=Math.hypot(dx,dy);
            if(d<moveSpd) {
                e.prev = target;
                if(target.type === 'speed_pad') {
                    e.speedBoost = 50;
                    if(G.enableFX && G.frame % 6 === 0) playSound('boost');
                } else if(target.type === 'slow_pad') {
                    e.inGraviton = 45;
                }

                // Warp Gate Teleport
                if(target.type === 'warp_in' && G.warpOut && !G.warpOut.occ && !G.warpOut.tower) {
                    if(e.path[e.pi + 1] === G.warpOut) {
                        e.x = G.warpOut.x + (e.ox || 0);
                        e.y = G.warpOut.y + (e.oy || 0);
                        e.prev = G.warpOut;
                        if(G.enableFX) {
                            playSound('warp');
                            fxExplode(target.x, target.y, '#00ffff', 18);
                            fxExplode(G.warpOut.x, G.warpOut.y, '#ff00ff', 18);
                            spawnShock(G.warpOut.x, G.warpOut.y, '#ff00ff', 45);
                        }
                        e.pi += 2;
                    } else {
                        e.pi++;
                    }
                } else {
                    e.pi++;
                }
            } else {
                e.x+=dx/d*moveSpd; e.y+=dy/d*moveSpd; e.angle=Math.atan2(dy,dx);
            }
        } else { 
            // Fallback if path ends abnormally
            e.reached = true; G.enemies.splice(i,1); loseLife();
            playSound('breach');
            G.endHit = 30;
            if(G.enableFX) {
                fxExplode(G.end.x, G.end.y, '#ff0033', 25);
                spawnShock(G.end.x, G.end.y, '#ff0044', G.hexR * 3.2);
                spawnParticle(G.end.x, G.end.y - 10, 0, -1.0, 1.0, '#ff2244', 'text', 0, '-1 HP');
            }
        }
    }
    
    // Update Shock & Particle Object Pools (Zero GC allocations)
    for(let i=0; i<MAX_SHOCKS; i++) {
        let s = shockPool[i];
        if(s.active) {
            s.r += 2.5; s.alpha -= 0.06;
            if(s.alpha <= 0) s.active = false;
        }
    }
    for(let i=0; i<MAX_PARTS; i++) {
        let p = particlePool[i];
        if(p.active) {
            p.x += p.vx; p.y += p.vy;
            if(p.type === 'spark' || p.type === 'dot') {
                p.vx *= 0.94; p.vy *= 0.94;
            }
            if(p.type === 'halo') p.r += 2;
            p.life -= (p.type === 'text' ? 0.025 : 0.035);
            if(p.life <= 0) p.active = false;
        }
    }
    if(G.endHit > 0) G.endHit--;
}

// --- Wave System ---
function startWave() {
    G.wave++; 
    G.spawnQ = 6 + Math.floor(G.wave * 1.5); 
    G.spawning = true; 
    G.waveTimer = 0; 
    updateUI();
}
function forceNextWave() { 
    if(G.waveTimer > 0) G.score += Math.ceil(G.waveTimer/60)*50; 
    startWave(); 
}
function spawnEnemy() {
    let cfg = DIFFICULTY_CONFIG[G.difficulty] || DIFFICULTY_CONFIG.normal;
    let stage = Math.floor((G.wave-1)/5); let baseHp = (20 + (G.wave*5)) * cfg.hpMult;
    if(stage>=1) baseHp*=1.5; if(stage>=2) baseHp*=2.0;
    let hr = G.hexR || 20;
    let shape='hexagon', spd=(1.0+(G.wave*0.03)) * cfg.spdMult, size = Math.round(hr * 0.46);

    if(G.wave%5===0) { 
        // Boss: Massive Decagon (0.80R giant fortress unit)
        shape='decagon'; baseHp*=4.5; spd*=0.48; size = Math.round(hr * 0.80); 
    }
    else if(stage>=2 && Math.random()>0.6) { 
        // Armored Heavy: Octagon fortress (0.66R)
        shape='octagon'; baseHp*=3.0; spd*=0.6; size = Math.round(hr * 0.66); 
    }
    else if(stage>=1 && Math.random()>0.65) { 
        // Infiltrator: Fast Dart Rhombus (0.40R agile speedster)
        shape='dart'; baseHp*=0.7; spd*=1.55; size = Math.round(hr * 0.40); 
    }
    else if(Math.random()>0.5) {
        // Heavy Drone: Pentagon combat unit (0.54R)
        shape='pentagon'; baseHp*=1.3; spd*=0.9; size = Math.round(hr * 0.54); 
    }
    let e = { 
        x:G.start.x, y:G.start.y, pi:0, slow:0, speedBoost:0, inGraviton:0, hp:baseHp, max:baseHp, spd:spd, size:size,
        path:G.path, prev:G.start, // own route + last cell reached (for rerouting)
        val: Math.max(1, Math.floor((5+Math.floor(G.wave/2)) * (G.difficulty==='easy'?1.2:(G.difficulty==='hell'?0.8:1.0)))), shape: shape, 
        color: `hsl(${(G.wave*25)%360},100%,60%)`, angle: 0, 
        ox: (Math.random()-0.5)*(G.hexR*0.5), oy: (Math.random()-0.5)*(G.hexR*0.5), 
        reached:false // Flag for targeting logic
    };
    G.enemies.push(e);
}

// --- Draw ---
function draw() {
    ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width,canvas.height); // letterbox
    ctx.setTransform(G.view.s,0,0,G.view.s,G.view.ox,G.view.oy); // map -> screen
    
    // 1. Offscreen Cached Static Map (Hex Grid, Obstacles, Walls, Gates)
    ctx.drawImage(bgCanvas, 0, 0);

    // 1.5 Special Tactical Obstacles & Conduits (Warp Gate, Speed Pad, Slow Graviton, One-Way)
    drawSpecialObstacles(ctx);

    // 1.8 Dynamic Animated Endpoint Core & Breach Alert Visuals
    drawEndpoint(ctx);

    if(G.enableFX) ctx.globalCompositeOperation = 'lighter';

    G.towers.forEach(t => {
        // 2. Pre-rendered Neon Glow & Refined Base Pad (0.85R)
        drawGlow(ctx, t.x, t.y, G.hexR * 1.3, t.color);
        drawHexSolid(t.x, t.y, G.hexR * 0.85, t.color, 0.12 + (t.lvl*0.04));
        ctx.strokeStyle = t.color;
        
        if(t.type === 'buff') {
            let tRange = towerRange(t);
            G.towers.forEach(target => {
                if(target !== t && dist(t,target) <= tRange+10) {
                    ctx.beginPath(); ctx.moveTo(t.x,t.y); ctx.lineTo(target.x,target.y); ctx.lineWidth=1; ctx.globalAlpha=0.4; ctx.stroke(); ctx.globalAlpha=1;
                }
            });
        }
        
        ctx.save(); ctx.translate(t.x,t.y);
        
        if(t.lvl > 1) { ctx.beginPath(); ctx.arc(0,0,G.hexR*0.55,0,6.28); ctx.stroke(); }
        if(t.lvl > 3) { ctx.beginPath(); ctx.arc(0,0,G.hexR*0.70,0,6.28); ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]); }
        if(t.lvl === 6) { ctx.beginPath(); ctx.arc(0,0,G.hexR*0.82,0,6.28); ctx.lineWidth=2; ctx.stroke(); ctx.lineWidth=1; }
        
        if(t.type !== 'buff') ctx.rotate(t.angle);
        
        let scale = G.hexR / 20; ctx.scale(scale, scale);
        drawTowerShape(ctx, t.type, t.lvl, t.color);
        
        ctx.restore();

        if(t.type==='laser' && t.firing) {
            let reach = Math.max(G.w, G.h) * 1.5;
            let ex = t.x + Math.cos(t.angle) * reach, ey = t.y + Math.sin(t.angle) * reach;
            // Multi-pass neon beam (replaces expensive Gaussian blur with hardware additive blending)
            ctx.strokeStyle = t.color;
            ctx.lineWidth = 4 + (t.lvl * 0.8);
            ctx.globalAlpha = 0.55;
            ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(ex, ey); ctx.stroke();
            ctx.lineWidth = 2 + (t.lvl * 0.4);
            ctx.globalAlpha = 0.9;
            ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(ex, ey); ctx.stroke();
            // Inner penetrating white-hot core
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1 + (t.lvl * 0.2);
            ctx.globalAlpha = 1;
            ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(ex, ey); ctx.stroke();
            ctx.lineWidth = 1; t.firing = false;
        }
        if(t.type==='shock' && t.targets) {
            ctx.strokeStyle=t.color; ctx.lineWidth=2;
            t.targets.forEach(e => {
                ctx.beginPath(); ctx.moveTo(t.x,t.y); 
                let mx = (t.x+e.x)/2 + (Math.random()-0.5)*20; let my = (t.y+e.y)/2 + (Math.random()-0.5)*20;
                ctx.lineTo(mx, my); ctx.lineTo(e.x, e.y); ctx.stroke();
            });
        }
    });

    G.enemies.forEach(e => {
        let s = e.size || 8;
        // 1. Pre-rendered Neon Glow Aura
        drawGlow(ctx, e.x, e.y, s * 2.0, e.color);

        ctx.save();
        ctx.translate(e.x, e.y);

        let nodes = []; // Glowing vertex nodes (Signature GeoDefense vector CRT look)
        let darkCore = 'rgba(5, 10, 18, 0.72)'; // Dark translucent vector body (reveals grid lines)

        if(e.shape === 'dart') {
            // --- GeoDefense Infiltrator (Supersonic Delta-Wing Vector Jet) ---
            ctx.rotate(e.angle);

            // Outer primary swept delta wing
            ctx.beginPath();
            ctx.moveTo(s * 1.45, 0);                 // sharp spear nose
            ctx.lineTo(-s * 0.95, s * 0.9);          // port wingtip
            ctx.lineTo(-s * 0.45, 0);                // recessed trailing thruster notch
            ctx.lineTo(-s * 0.95, -s * 0.9);         // starboard wingtip
            ctx.closePath();
            ctx.fillStyle = darkCore; ctx.fill();
            ctx.strokeStyle = e.color; ctx.lineWidth = 1.8; ctx.stroke();

            // Inner nested booster chevron
            ctx.beginPath();
            ctx.moveTo(s * 0.65, 0);
            ctx.lineTo(-s * 0.35, s * 0.45);
            ctx.lineTo(-s * 0.15, 0);
            ctx.lineTo(-s * 0.35, -s * 0.45);
            ctx.closePath();
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.1; ctx.stroke();

            // Central vector spine
            ctx.beginPath();
            ctx.moveTo(-s * 0.4, 0); ctx.lineTo(s * 1.2, 0);
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2; ctx.stroke();

            // Trailing vector exhaust jet stream
            let thrusterLen = s * (0.4 + Math.sin(G.frame * 0.4) * 0.2);
            ctx.beginPath();
            ctx.moveTo(-s * 0.45, 0); ctx.lineTo(-s * 0.45 - thrusterLen, 0);
            ctx.strokeStyle = e.color; ctx.lineWidth = 2.0; ctx.stroke();

            // Vertex nodes
            nodes.push({x: s * 1.45, y: 0}, {x: -s * 0.95, y: s * 0.9}, {x: -s * 0.95, y: -s * 0.9});
        }
        else {
            // Geometric Rotating Vector Creeps
            let spin = (G.frame * 0.04) + (e.x + e.y) * 0.05;

            if(e.shape === 'hexagon') {
                // --- GeoDefense Classic Creep (Counter-Rotating Vector Hexagon / Diamond) ---
                // Outer Hexagon
                ctx.save();
                ctx.rotate(spin);
                ctx.beginPath();
                for(let k = 0; k < 6; k++) {
                    let a = k * Math.PI / 3;
                    let hx = Math.cos(a) * s, hy = Math.sin(a) * s;
                    k === 0 ? ctx.moveTo(hx, hy) : ctx.lineTo(hx, hy);
                    nodes.push({x: hx, y: hy, spin: spin});
                }
                ctx.closePath();
                ctx.fillStyle = darkCore; ctx.fill();
                ctx.strokeStyle = e.color; ctx.lineWidth = 1.8; ctx.stroke();

                // Diagonal cross-spokes
                ctx.beginPath();
                for(let k = 0; k < 3; k++) {
                    let a = k * Math.PI / 3;
                    ctx.moveTo(Math.cos(a)*s*0.9, Math.sin(a)*s*0.9);
                    ctx.lineTo(-Math.cos(a)*s*0.9, -Math.sin(a)*s*0.9);
                }
                ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 0.9; ctx.stroke();
                ctx.restore();

                // Counter-rotating inner diamond core
                ctx.save();
                ctx.rotate(-spin * 1.6);
                ctx.beginPath();
                let is = s * 0.52;
                ctx.moveTo(is, 0); ctx.lineTo(0, is); ctx.lineTo(-is, 0); ctx.lineTo(0, -is);
                ctx.closePath();
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.3; ctx.stroke();
                ctx.restore();

                // Pulsating central nucleus
                let nR = 1.5 + Math.sin(G.frame * 0.15) * 0.6;
                ctx.beginPath(); ctx.arc(0, 0, nR, 0, 6.28);
                ctx.fillStyle = '#ffffff'; ctx.fill();
            }
            else if(e.shape === 'octagon') {
                // --- GeoDefense Armored Fortress (Heavy Dual-Ring Gyroscope Octagon) ---
                // Outer Heavy Octagon
                ctx.save();
                ctx.rotate(spin * 0.7);
                ctx.beginPath();
                for(let k = 0; k < 8; k++) {
                    let a = k * Math.PI / 4;
                    let ox = Math.cos(a) * s, oy = Math.sin(a) * s;
                    k === 0 ? ctx.moveTo(ox, oy) : ctx.lineTo(ox, oy);
                    nodes.push({x: ox, y: oy, spin: spin * 0.7});
                }
                ctx.closePath();
                ctx.fillStyle = darkCore; ctx.fill();
                ctx.strokeStyle = e.color; ctx.lineWidth = 2.0; ctx.stroke();

                // 8 Radial armor-chassis struts
                ctx.beginPath();
                for(let k = 0; k < 8; k++) {
                    let a = k * Math.PI / 4;
                    ctx.moveTo(Math.cos(a)*s*0.4, Math.sin(a)*s*0.4);
                    ctx.lineTo(Math.cos(a)*s*0.95, Math.sin(a)*s*0.95);
                }
                ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1.1; ctx.stroke();
                ctx.restore();

                // Counter-rotating reinforced inner octagon
                ctx.save();
                ctx.rotate(-spin * 1.2);
                ctx.beginPath();
                for(let k = 0; k < 8; k++) {
                    let a = k * Math.PI / 4;
                    let mx = Math.cos(a) * (s * 0.55), my = Math.sin(a) * (s * 0.55);
                    k === 0 ? ctx.moveTo(mx, my) : ctx.lineTo(mx, my);
                }
                ctx.closePath();
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4; ctx.stroke();
                // Inner structural square
                let sq = s * 0.32;
                ctx.strokeRect(-sq, -sq, sq*2, sq*2);
                ctx.restore();

                // Core reactor pip
                ctx.beginPath(); ctx.arc(0, 0, 2, 0, 6.28);
                ctx.fillStyle = e.color; ctx.fill();
                ctx.beginPath(); ctx.arc(0, 0, 1, 0, 6.28);
                ctx.fillStyle = '#fff'; ctx.fill();
            }
            else if(e.shape === 'decagon') {
                // --- GeoDefense Boss Juggernaut (Multi-Tiered Rotating Vector Super-Fortress) ---
                // Tier 1: Outer 10-gon perimeter ring with corner capacitor nodes
                ctx.save();
                ctx.rotate(spin * 0.5);
                ctx.beginPath();
                for(let k = 0; k < 10; k++) {
                    let a = k * (Math.PI * 2 / 10);
                    let dx = Math.cos(a) * s, dy = Math.sin(a) * s;
                    k === 0 ? ctx.moveTo(dx, dy) : ctx.lineTo(dx, dy);
                    nodes.push({x: dx, y: dy, spin: spin * 0.5, r: 1.8});
                }
                ctx.closePath();
                ctx.fillStyle = darkCore; ctx.fill();
                ctx.strokeStyle = e.color; ctx.lineWidth = 2.2; ctx.stroke();

                // 10 Radial power pylons
                ctx.beginPath();
                for(let k = 0; k < 10; k++) {
                    let a = k * (Math.PI * 2 / 10);
                    ctx.moveTo(Math.cos(a)*s*0.5, Math.sin(a)*s*0.5);
                    ctx.lineTo(Math.cos(a)*s*0.95, Math.sin(a)*s*0.95);
                }
                ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1.2; ctx.stroke();
                ctx.restore();

                // Tier 2: Counter-rotating 10-point interlaced star polygon (Decagram shield)
                ctx.save();
                ctx.rotate(-spin * 0.9);
                ctx.beginPath();
                for(let k = 0; k < 10; k++) {
                    let a = k * (Math.PI * 2 / 10);
                    let r = (k % 2 === 0) ? s * 0.68 : s * 0.38;
                    let sx = Math.cos(a) * r, sy = Math.sin(a) * r;
                    k === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
                }
                ctx.closePath();
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.6; ctx.stroke();
                ctx.restore();

                // Tier 3: Inner high-velocity diamond core
                ctx.save();
                ctx.rotate(spin * 2.2);
                let ds = s * 0.25;
                ctx.beginPath();
                ctx.moveTo(ds, 0); ctx.lineTo(0, ds); ctx.lineTo(-ds, 0); ctx.lineTo(0, -ds);
                ctx.closePath();
                ctx.strokeStyle = e.color; ctx.lineWidth = 1.5; ctx.stroke();
                ctx.restore();

                // Pulsating core reactor
                let bNuc = 2.4 + Math.sin(G.frame * 0.2) * 1.0;
                ctx.beginPath(); ctx.arc(0, 0, bNuc, 0, 6.28);
                ctx.fillStyle = '#ffffff'; ctx.fill();
            }
            else {
                // --- GeoDefense Drone / Weaver (Spinning 5-Point Vector Star & Pentagram) ---
                // Outer spinning pentagon
                ctx.save();
                ctx.rotate(spin * 1.1);
                ctx.beginPath();
                for(let k = 0; k < 5; k++) {
                    let a = k * (Math.PI * 2 / 5);
                    let px = Math.cos(a) * s, py = Math.sin(a) * s;
                    k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                    nodes.push({x: px, y: py, spin: spin * 1.1});
                }
                ctx.closePath();
                ctx.fillStyle = darkCore; ctx.fill();
                ctx.strokeStyle = e.color; ctx.lineWidth = 1.8; ctx.stroke();

                // Intersecting sacred geometry pentagram (Weaver lines)
                ctx.beginPath();
                for(let k = 0; k < 5; k++) {
                    let a1 = k * (Math.PI * 2 / 5);
                    let a2 = (k + 2) * (Math.PI * 2 / 5);
                    ctx.moveTo(Math.cos(a1)*s*0.92, Math.sin(a1)*s*0.92);
                    ctx.lineTo(Math.cos(a2)*s*0.92, Math.sin(a2)*s*0.92);
                }
                ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.1; ctx.stroke();
                ctx.restore();

                // Counter-rotating inner mini-pentagon
                ctx.save();
                ctx.rotate(-spin * 1.8);
                ctx.beginPath();
                for(let k = 0; k < 5; k++) {
                    let a = k * (Math.PI * 2 / 5);
                    let px = Math.cos(a) * (s * 0.38), py = Math.sin(a) * (s * 0.38);
                    k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2; ctx.stroke();
                ctx.restore();

                // Core node
                ctx.beginPath(); ctx.arc(0, 0, 1.4, 0, 6.28);
                ctx.fillStyle = '#ffffff'; ctx.fill();
            }
        }

        // --- Render Bright Glowing Vertex Nodes (CRT Vector Corner Pip Emulation) ---
        if(nodes.length > 0) {
            ctx.beginPath();
            nodes.forEach(pt => {
                let px = pt.x, py = pt.y;
                if(pt.spin !== undefined) {
                    let cos = Math.cos(pt.spin), sin = Math.sin(pt.spin);
                    px = pt.x * cos - pt.y * sin;
                    py = pt.x * sin + pt.y * cos;
                }
                let nr = pt.r || 1.35;
                ctx.moveTo(px + nr, py);
                ctx.arc(px, py, nr, 0, 6.28);
            });
            ctx.fillStyle = '#ffffff';
            ctx.fill();
        }

        // --- Health Bar (Neon Vector Status Line) ---
        let bw = Math.max(14, s * 1.6);
        let hpPct = Math.max(0, Math.min(1, e.hp / e.max));
        let barY = -s - 6;
        // Background track with subtle border
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(-bw/2, barY, bw, 2.5);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(-bw/2, barY, bw, 2.5);
        // Dynamic health color (Neon Cyan -> Yellow -> Neon Red)
        let hpCol = hpPct > 0.5 ? '#00ffcc' : (hpPct > 0.25 ? '#ffcc00' : '#ff0055');
        ctx.fillStyle = hpCol;
        ctx.fillRect(-bw/2, barY, bw * hpPct, 2.5);

        ctx.restore();
    });

    G.projs.forEach(p => { 
        if(p.type === 'missile') {
            // Aerodynamic vector rocket: pointed nose cone, slender body, stabilizer fins
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle || 0);
            ctx.strokeStyle = p.color;
            ctx.fillStyle = '#fff';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            // Rocket fuselage
            ctx.moveTo(7, 0);       // sharp nose
            ctx.lineTo(2, 2.5);
            ctx.lineTo(-5, 2.5);
            // Delta tail fin
            ctx.lineTo(-7, 4.5);
            ctx.lineTo(-6, 2.5);
            ctx.lineTo(-6, -2.5);
            ctx.lineTo(-7, -4.5);
            ctx.lineTo(-5, -2.5);
            ctx.lineTo(2, -2.5);
            ctx.closePath();
            ctx.stroke();
            // Thruster flame dot
            ctx.fillStyle = '#ff8800';
            ctx.beginPath();
            ctx.arc(-7, 0, 1.8, 0, 6.28);
            ctx.fill();
            ctx.restore();
        } else if(p.type === 'sniper') {
            // Realistic High-Velocity Kinetic Bullet (Spitzer ogive bullet with glowing supersonic tracer tail)
            let bAngle = Math.atan2(p.vy, p.vx);
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(bAngle);

            // Supersonic mach tracer streak trailing behind the bullet
            ctx.strokeStyle = '#d0f';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.moveTo(-5, 0);
            ctx.lineTo(-24, 0);
            ctx.stroke();

            // Inner white-hot tracer core
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.0;
            ctx.beginPath();
            ctx.moveTo(-4, 0);
            ctx.lineTo(-15, 0);
            ctx.stroke();

            // Realistic bullet profile: cylindrical boat-tail base + aerodynamic pointed ogive tip
            ctx.fillStyle = '#f0c050'; // Polished brass/copper jacket
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1.0;
            ctx.beginPath();
            ctx.moveTo(6, 0);                 // Sharp spitzer tip point
            ctx.quadraticCurveTo(3, 1.8, 0, 1.8); // Curved ogive contour
            ctx.lineTo(-5, 1.8);              // Cylindrical body
            ctx.lineTo(-7, 1.0);              // Tapered boat-tail heel
            ctx.lineTo(-7, -1.0);
            ctx.lineTo(-5, -1.8);
            ctx.lineTo(0, -1.8);
            ctx.quadraticCurveTo(3, -1.8, 6, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Tip specular glint
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(4, 0, 0.8, 0, 6.28);
            ctx.fill();

        } else if(p.type === 'bolt') {
            // Blaster cannon shell: elongated vector slug with bright core & tracer tail strictly aligned to barrel angle
            let sAngle = Math.atan2(p.vy, p.vx);
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(sAngle);

            // High-intensity tracer streak aligned with the barrel axis
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(3, 0);
            ctx.lineTo(-11, 0);
            ctx.stroke();

            // Inner white-hot ballistic core
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(4, 0);
            ctx.lineTo(-6, 0);
            ctx.stroke();

            // Front luminous plasma bead
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(3.5, 0, 1.8, 0, 6.28);
            ctx.fill();

            ctx.restore();
        } else {
            ctx.fillStyle = p.color; 
            ctx.beginPath(); 
            ctx.arc(p.x, p.y, p.type==='frag'?2:3, 0, 6.28); 
            ctx.fill(); 
        }
    });
    
    if(G.enableFX) {
        for(let i=0; i<MAX_SHOCKS; i++) {
            let s = shockPool[i];
            if(s.active) {
                ctx.strokeStyle = s.color; ctx.globalAlpha = s.alpha; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.stroke();
            }
        }
        ctx.globalAlpha = 1;
        for(let i=0; i<MAX_PARTS; i++) {
            let p = particlePool[i];
            if(p.active) {
                ctx.globalAlpha = p.life;
                if(p.type === 'halo') {
                    ctx.strokeStyle = p.color; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28); ctx.stroke();
                } else if(p.type === 'spark') {
                    ctx.strokeStyle = p.color; ctx.lineWidth = p.r || 1.8;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x - p.vx * 2.2, p.y - p.vy * 2.2);
                    ctx.stroke();
                } else if(p.type === 'text') {
                    ctx.fillStyle = p.color; ctx.font = "bold 13px Courier New"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(p.text || "-1 HP", p.x, p.y);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r || 1.8, 0, 6.28);
                    ctx.fill();
                }
            }
        }
        ctx.globalAlpha = 1;
    }

    if(G.dragType) {
        let ghostY = G.dragPos.y - dragLift();
        let hex = pixelToHex(G.dragPos.x, ghostY); 
        let data = TOWER_DATA[G.dragType];
        ctx.strokeStyle = data.color; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.arc(G.dragPos.x, ghostY, data.range, 0, 6.28); ctx.stroke(); ctx.setLineDash([]);
        ctx.save(); ctx.translate(G.dragPos.x, ghostY);
        let scale = G.hexR / 20; ctx.scale(scale, scale);
        drawTowerShape(ctx, data.type, 1, data.color);
        ctx.restore();
        if(hex) drawHexSolid(hex.x, hex.y, G.hexR, canBuildOn(hex) ? data.color : '#ff0033', 0.45);
    }
    
    if(G.selected) {
        ctx.strokeStyle='#fff'; ctx.setLineDash([5,5]); ctx.beginPath(); 
        ctx.arc(G.selected.x, G.selected.y, towerRange(G.selected), 0, 6.28); 
        ctx.stroke(); ctx.setLineDash([]);
    }
    
    ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur=0;

    // Perimeter Danger Flash when Endpoint Base is Breached
    if(G.endHit > 0) {
        ctx.save();
        ctx.setTransform(1,0,0,1,0,0);
        let flashAlpha = (G.endHit / 30) * 0.4;
        ctx.fillStyle = `rgba(255, 0, 50, ${flashAlpha * 0.2})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = `rgba(255, 0, 50, ${flashAlpha})`;
        ctx.lineWidth = Math.max(4, Math.round(14 * (G.endHit / 30)));
        ctx.strokeRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
    }
}

// --- Utils ---
function setTimer(s) { G.waveTimer = s*60; } // counted in logic frames (~60/s), so it respects pause and 2x speed
function hexPath(x,y,r,targetCtx=ctx) { for(let i=0;i<6;i++) { let a=Math.PI/3*i - Math.PI/6; i===0?targetCtx.moveTo(x+r*Math.cos(a),y+r*Math.sin(a)):targetCtx.lineTo(x+r*Math.cos(a),y+r*Math.sin(a)); } targetCtx.closePath(); }
function drawHexSolid(x,y,r,c,a=1,targetCtx=ctx) { targetCtx.fillStyle=c; targetCtx.globalAlpha=a; targetCtx.beginPath(); hexPath(x,y,r,targetCtx); targetCtx.fill(); targetCtx.globalAlpha=1; }
function drawTowerShape(ctx, type, lvl, color) {
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1.8; ctx.beginPath();
    if(type === 'bolt') {
        // Blaster: Iconic round neon turret base + dual-ring core + forward blaster barrel/nozzle
        ctx.arc(0, 0, 7.5, 0, 6.28);
        ctx.moveTo(4, 0); ctx.arc(0, 0, 4, 0, 6.28);
        // Central core dot
        ctx.moveTo(1.5, 0); ctx.arc(0, 0, 1.5, 0, 6.28);
        // Projecting barrel
        let bLen = 12 + Math.min(lvl, 6) * 1.2;
        ctx.moveTo(6, -2.5); ctx.lineTo(bLen, -2.5); ctx.lineTo(bLen, 2.5); ctx.lineTo(6, 2.5);
        if(lvl >= 3) {
            // Twin/flank muzzle fins
            ctx.moveTo(7, -5); ctx.lineTo(bLen - 2, -4);
            ctx.moveTo(7, 5); ctx.lineTo(bLen - 2, 4);
        }
    } 
    else if (type === 'missile') {
        // Missile: Aggressive diamond launcher pod with quad-corner missile bays
        ctx.moveTo(10, 0); ctx.lineTo(0, 10); ctx.lineTo(-10, 0); ctx.lineTo(0, -10); ctx.closePath();
        // Inner diamond core
        ctx.moveTo(5, 0); ctx.lineTo(0, 5); ctx.lineTo(-5, 0); ctx.lineTo(0, -5); ctx.closePath();
        // Forward missile tubes/rails
        ctx.moveTo(3, -4); ctx.lineTo(13, -4);
        ctx.moveTo(3, 4); ctx.lineTo(13, 4);
        // Exhaust/stabilizer fins
        ctx.moveTo(-6, -6); ctx.lineTo(-11, -8);
        ctx.moveTo(-6, 6); ctx.lineTo(-11, 8);
    } 
    else if (type === 'laser') {
        // Laser: Focused triangular prism emitter with central optical core and collimator needle
        ctx.moveTo(10, 0); ctx.lineTo(-7, 8); ctx.lineTo(-4, 0); ctx.lineTo(-7, -8); ctx.closePath();
        // Optical lens circle
        ctx.moveTo(3, 0); ctx.arc(0, 0, 3, 0, 6.28);
        // Focused beam needle
        ctx.moveTo(6, 0); ctx.lineTo(13 + Math.min(lvl, 6) * 0.9, 0);
        // Emitter focus brackets
        ctx.moveTo(10, -3.5); ctx.lineTo(13, 0); ctx.lineTo(10, 3.5);
    } 
    else if (type === 'shock') {
        // Shock / Thump: Multi-phase pulsed radial ring + arc capacitor electrodes
        ctx.arc(0, 0, 5, 0, 6.28);
        ctx.moveTo(8.5, 0); ctx.arc(0, 0, 8.5, 0, 6.28);
        // 4 Quad-directional capacitor spikes radiating outward
        for(let i = 0; i < 4; i++) {
            let a = i * Math.PI / 2;
            let cos = Math.cos(a), sin = Math.sin(a);
            ctx.moveTo(cos * 5, sin * 5); ctx.lineTo(cos * 11, sin * 11);
            ctx.lineTo(cos * 11 - sin * 2.5, sin * 11 + cos * 2.5);
        }
    } 
    else if (type === 'sniper') {
        // Sniper / Rail: Precision railgun chamber with dual long parallel guide rails and crosshair
        ctx.rect(-7, -3.5, 7, 7);
        // Long twin accelerating rails
        let rLen = 14 + Math.min(lvl, 6) * 1.2;
        ctx.moveTo(0, -2); ctx.lineTo(rLen, -2);
        ctx.moveTo(0, 2); ctx.lineTo(rLen, 2);
        // Rail braces
        ctx.moveTo(8, -3.5); ctx.lineTo(8, 3.5);
        ctx.moveTo(rLen - 3, -3.5); ctx.lineTo(rLen - 3, 3.5);
        // Reticle rear mark
        ctx.moveTo(-4, -6); ctx.lineTo(-4, 6);
    } 
    else if (type === 'buff') {
        // Collector / Vortex node: Swirling energy vortex / spiral reactor with harmonic satellite nodes
        ctx.arc(0, 0, 3.5, 0, 6.28);
        // Swirling vortex arcs
        for(let i = 0; i < 3; i++) {
            let a = i * (Math.PI * 2 / 3);
            ctx.moveTo(Math.cos(a)*4, Math.sin(a)*4);
            ctx.quadraticCurveTo(Math.cos(a + 0.8)*11, Math.sin(a + 0.8)*11, Math.cos(a + 1.4)*9, Math.sin(a + 1.4)*9);
        }
        // Outer energy orbit ring
        ctx.moveTo(10, 0); ctx.arc(0, 0, 10, 0, 6.28);
    }
    ctx.stroke();
}
function pixelToHex(x, y) {
    let minD = Infinity, closest = null;
    for(let c of G.grid) { let d = Math.hypot(c.x-x, c.y-y); if(d < minD) { minD=d; closest=c; } }
    return (minD < G.hexR*1.5) ? closest : null;
}
function dist(a,b) { return Math.hypot(a.x-b.x, a.y-b.y); }
function distToSegment(A, B, P) { const l2 = (A.x-B.x)**2 + (A.y-B.y)**2; if(l2==0) return dist(P,A); let t = ((P.x-A.x)*(B.x-A.x) + (P.y-A.y)*(B.y-A.y)) / l2; t = Math.max(0, Math.min(1, t)); return dist(P, { x: A.x + t*(B.x-A.x), y: A.y + t*(B.y-A.y) }); }
function fx(x,y,c,n) { 
    if(!G.enableFX) return;
    for(let i=0; i<n; i++) {
        let a = Math.random() * 6.28;
        let spd = 1.0 + Math.random() * 3.5;
        spawnParticle(x, y, Math.cos(a)*spd, Math.sin(a)*spd, 0.7 + Math.random()*0.3, c, 'spark', 1.8);
    }
}
function fxExplode(x,y,c,n=16) { fx(x, y, c, n); }
function fxHalo(x,y,c) { spawnParticle(x, y, 0, 0, 1, c, 'halo', 5); }
function fxEnemyDestroy(e) {
    if(!G.enableFX) return;
    let isBoss = (e.shape === 'decagon');
    let isHeavy = (e.shape === 'octagon');
    let count = isBoss ? 45 : (isHeavy ? 30 : 20);
    let shockR = isBoss ? G.hexR * 3.2 : (isHeavy ? G.hexR * 2.5 : G.hexR * 1.8);

    // 1. Expanding Neon Shockwave ring in enemy's color
    spawnShock(e.x, e.y, e.color, shockR);
    if(isBoss || isHeavy) {
        spawnShock(e.x, e.y, '#ffffff', shockR * 0.6);
    }

    // 2. Expanding halo ring
    fxHalo(e.x, e.y, e.color);

    // 3. Directional Neon Vector Sparks (GeoDefense shard burst)
    for(let k = 0; k < count; k++) {
        let a = Math.random() * Math.PI * 2;
        let spd = (1.5 + Math.random() * 4.5) * (isBoss ? 1.4 : 1.0);
        let c = (k % 3 === 0) ? '#ffffff' : e.color;
        let r = 1.6 + Math.random() * 1.4;
        let life = 0.7 + Math.random() * 0.4;
        spawnParticle(e.x, e.y, Math.cos(a)*spd, Math.sin(a)*spd, life, c, 'spark', r);
    }

    // 4. Floating Cash Bounty Indicator
    spawnParticle(e.x, e.y - 4, 0, -0.9, 1.0, '#00ff88', 'text', 0, '+$' + e.val);
}
function towerRange(t) { return t.range * (1 + (t.lvl-1)*0.05); }
function toWorld(cx, cy) { let r = canvas.getBoundingClientRect(); return { x:(cx - r.left - G.view.ox)/G.view.s, y:(cy - r.top - G.view.oy)/G.view.s }; }
let isTouchDrag = false;
function dragLift() { return isTouchDrag ? (80 / G.view.s) : 0; } // ghost floats 80 screen px above the finger only on touch
function getNeighbors(c) { return c.nb || G.grid.filter(n => dist(c,n) < G.hexR*2.1 && n!==c); }

// Bound once at game start (bindTouch handles both touch and mouse).
function setupMenuListeners() {
    const upgMenu = document.getElementById('upg-menu');
    if(upgMenu) {
        ['click', 'touchstart', 'mousedown'].forEach(evt => {
            upgMenu.addEventListener(evt, e => e.stopPropagation(), {passive: evt === 'touchstart' ? false : true});
        });
    }

    bindTouch('m-upg', (e) => {
        if(e) { e.stopPropagation(); }
        if(!G.selected) return;
        let t = G.selected; let isMax = t.lvl >= 6;
        let cost = Math.floor(t.cost * t.lvl * 0.7);
        if(!isMax && G.cash >= cost) {
            G.cash -= cost; t.lvl++; 
            playSound('upgrade'); fxHalo(t.x,t.y,t.color); updateUI();
        } else playSound('boom');
    });

    bindTouch('m-sell', (e) => {
        if(e) { e.stopPropagation(); }
        if(!G.selected) return;
        let t = G.selected; let sell = Math.floor(t.cost * 0.5 * t.lvl);
        G.cash += sell; 
        let cell = G.grid.find(g=>g.q===t.q && g.r===t.r);
        if(cell) { cell.occ = false; cell.tower = null; }
        G.towers = G.towers.filter(to => to !== t);
        calcPath(); let plans = planEnemyRoutes(); if(plans) applyEnemyRoutes(plans);
        playSound('sell'); closeMenu(); updateUI();
    });

    bindTouch('m-lock', (e) => {
        if(e) { e.stopPropagation(); }
        if(!G.selected || G.selected.type !== 'laser') return;
        G.selected.lockedAngle = (G.selected.lockedAngle != null) ? null : G.selected.angle;
        updateMenuUI();
    });
}
function updateMenuUI() {
    if(!G.selected) return; let t = G.selected;
    let isMax = t.lvl >= 6; let cost = Math.floor(t.cost * t.lvl * 0.7); let sell = Math.floor(t.cost * 0.5 * t.lvl);
    document.getElementById('m-info').innerText = `${t.name} LVL ${t.lvl}`;
    let btnUp = document.getElementById('m-upg');
    btnUp.innerText = isMax ? "MAX" : `UPGRADE $${cost}`; btnUp.style.opacity = (isMax || G.cash < cost) ? 0.5 : 1;
    document.getElementById('m-sell').innerText = `SELL $${sell}`;
    let btnLock = document.getElementById('m-lock');
    if(t.type === 'laser') { btnLock.style.display = 'block'; btnLock.innerText = (t.lockedAngle != null) ? "UNLOCK" : "LOCK"; } else btnLock.style.display = 'none';
}
function selectTower(t) {
    G.selected = t;
    const m = document.getElementById('upg-menu'); 
    updateMenuUI();
    m.style.display = 'block';
    let menuW = m.offsetWidth || 120;
    let menuH = m.offsetHeight || 110;
    let v = G.view, sx = t.x*v.s + v.ox, sy = t.y*v.s + v.oy, hr = G.hexR*v.s; // map -> screen
    let isBelow = (sy - hr - menuH - 12 < 10);
    let mx = sx - menuW/2;
    let my = isBelow ? (sy + hr + 12) : (sy - hr - menuH - 8);
    if(mx < 10) mx = 10; 
    if(mx > canvas.width - menuW - 10) mx = canvas.width - menuW - 10;
    m.classList.toggle('flip-below', isBelow);
    m.style.left = Math.round(mx)+'px'; 
    m.style.top = Math.round(my)+'px';
}
function closeMenu() { G.selected=null; document.getElementById('upg-menu').style.display='none'; }
function updateUI() { 
    if(G.active) updateRecord(G.difficulty, G.score, G.wave);
    document.getElementById('ui-cash').innerText = Math.floor(G.cash); 
    document.getElementById('ui-wave').innerText = G.wave; 
    document.getElementById('ui-score').innerText = G.score; 
    let hiEl = document.getElementById('ui-hi');
    if(hiEl) {
        let best = Math.max(G.score, (gameRecords[G.difficulty]?.score || 0));
        hiEl.innerText = best;
    }
    let diffEl = document.getElementById('ui-diff');
    if(diffEl) {
        let diffKey = G.difficulty || 'normal';
        diffEl.innerText = diffKey.toUpperCase();
        diffEl.className = 'stat-diff ' + diffKey;
    }
    updateMenuUI(); 
}
function renderTowerIcons() {
    for(let key in TOWER_DATA) {
        let cvs = document.getElementById('icon-' + key);
        if(cvs) {
            // High-DPI 2x resolution buffer for crystal-clear vector line rendering
            cvs.width = 100;
            cvs.height = 92;
            let cx = cvs.getContext('2d');
            cx.clearRect(0, 0, 100, 92);
            let data = TOWER_DATA[key];
            cx.save();
            // Scale by 2 for Retina backing store, then center in 50x46 box
            cx.scale(2, 2);
            cx.translate(23, 23);
            cx.scale(1.4, 1.4);
            // Crisp neon glow
            cx.shadowColor = data.color;
            cx.shadowBlur = 6;
            drawTowerShape(cx, data.type, 1, data.color);
            cx.restore();
        }
    }
}
function startDrag(e, type) { 
    e.preventDefault(); 
    isTouchDrag = !!(e.touches && e.touches.length);
    if(G.selected) closeMenu(); 
    G.dragType = type; 
    updateDragPos(e); 
}
function moveDrag(e) { if(G.dragType) { e.preventDefault(); updateDragPos(e); } }
function updateDragPos(e) { let t = e.touches?e.touches[0]:e; let p = toWorld(t.clientX, t.clientY); G.dragPos.x = p.x; G.dragPos.y = p.y; }
function endDrag(e) {
    e.preventDefault(); if(!G.dragType) return;
    let hex = pixelToHex(G.dragPos.x, G.dragPos.y - dragLift()); 
    let data = TOWER_DATA[G.dragType];
    if(hex && canBuildOn(hex)) {
        if(G.cash >= data.cost) {
            hex.occ = true;
            let mainPath = findPath(G.start, G.end);
            let plans = mainPath ? planEnemyRoutes() : null; // null if any live enemy would be trapped
            if(mainPath && plans) {
                hex.occ = true;
                let newTower = {q:hex.q, r:hex.r, x:hex.x, y:hex.y, ...data, cd:0, lvl:1, angle:0, lockedAngle:null};
                hex.tower = newTower;
                G.towers.push(newTower);
                G.path = mainPath;
                applyEnemyRoutes(plans);
                G.cash -= data.cost;
                playSound('place'); fxExplode(hex.x, hex.y, '#fff', 8); updateUI();
            } else {
                hex.occ = false; hex.tower = null;
                playSound('boom'); fxExplode(hex.x, hex.y, '#f00', 5);
            }
        } else playSound('boom');
    }
    G.dragType = null;
}
function fireLaser(t, buff) {
    // Full piercing line: laser penetrates and damages ALL enemies along its line of sight
    let reach = Math.max(G.w, G.h) * 1.5; 
    let ex = t.x + Math.cos(t.angle) * reach, ey = t.y + Math.sin(t.angle) * reach;
    t.firing = true;
    let hitCount = 0;
    G.enemies.forEach(e => {
        if(e.hp > 0 && !e.reached && distToSegment({x:t.x, y:t.y}, {x:ex, y:ey}, e) < (e.size || 10)) {
            let grav = (e.inGraviton > 0 ? 0.6 : 1.0);
            e.hp -= t.dmg * (1 + t.lvl * 0.5) * buff * grav;
            hitCount++;
            if(G.enableFX && G.frame % 3 === 0) fx(e.x, e.y, t.color, 2);
        }
    });
    if(hitCount > 0 && G.enableFX && G.frame % 10 === 0) playSound('laser');
}
function handleClick(e) {
    if(G.dragType) return;
    let p = toWorld(e.clientX, e.clientY);
    let hex = pixelToHex(p.x, p.y);
    let t = (hex && hex.tower) || G.towers.find(to => (hex && to.q === hex.q && to.r === hex.r) || dist(to, p) < G.hexR * 0.95);
    if(t) { selectTower(t); } else closeMenu();
}
const drags = document.querySelectorAll('.tower-card');
drags.forEach(d => { d.addEventListener('touchstart', e => startDrag(e, d.dataset.type), {passive:false}); d.addEventListener('mousedown', e => startDrag(e, d.dataset.type)); });
renderTowerIcons();
window.addEventListener('touchmove', moveDrag, {passive:false}); window.addEventListener('mousemove', moveDrag);
window.addEventListener('touchend', endDrag); window.addEventListener('mouseup', endDrag);
canvas.addEventListener('touchstart', (e) => { 
    if(e.touches.length === 1) {
        e.preventDefault();
        handleClick({clientX: e.touches[0].clientX, clientY: e.touches[0].clientY}); 
    }
}, {passive:false});
canvas.addEventListener('click', handleClick);
</script>
