        let spd = 1.0 + Math.random() * 3.5;
        spawnParticle(x, y, Math.cos(a)*spd, Math.sin(a)*spd, 0.7 + Math.random()*0.3, c, 'spark', 1.8);
    }
}
function fxExplode(x,y,c,n=16) { fx(x, y, c, n); }
function fxHalo(x,y,c) { spawnParticle(x, y, 0, 0, 1, c, 'halo', 5); }
function fxEnemyDestroy(e) {
    let isBoss = (e.shape === 'decagon');
    let isHeavy = (e.shape === 'octagon');

    // 1. Energy Orbs Spawned for Collector Absorption (Zero-GC pool capped at 60 active orbs)
    let collectors = G.towers.filter(to => to.type === 'buff');
    if(collectors.length > 0) {
        let closestCol = collectors.reduce((best, c) => {
            let dSq = distSq(e, c);
            return (!best || dSq < best.dSq) ? { c, dSq } : best;
        }, null)?.c;

        if(closestCol) {
            let orbVal = isBoss ? 2.5 : (isHeavy ? 1.5 : 1.0);
            let rawCount = isBoss ? 24 : (isHeavy ? 16 : 8);
            let activeCount = 0;
            for(let i = 0; i < MAX_ENERGY_ORBS; i++) if(energyOrbPool[i].active) activeCount++;

            if(activeCount >= MAX_ENERGY_ORBS) {
                // Instantly absorb energy directly into Collector when particle limit reached
                closestCol.energy = Math.min(closestCol.maxEnergy || 100, (closestCol.energy || 0) + rawCount * orbVal);
                if(G.enableFX) fx(closestCol.x, closestCol.y, '#ff00aa', 2);
            } else {
                let allowed = Math.min(rawCount, MAX_ENERGY_ORBS - activeCount);
                let overflow = rawCount - allowed;
                if(overflow > 0) {
                    closestCol.energy = Math.min(closestCol.maxEnergy || 100, (closestCol.energy || 0) + overflow * orbVal);
                }
                for(let k = 0; k < allowed; k++) {
                    let a = Math.random() * Math.PI * 2;
                    let spd = 2.0 + Math.random() * 4.0;
                    spawnEnergyOrb(
                        e.x, e.y,
                        Math.cos(a) * spd, Math.sin(a) * spd,
                        closestCol,
                        `hsl(${(G.frame * 7 + k * 35) % 360}, 100%, 65%)`,
                        orbVal
                    );
                }
            }
        }
    }

    if(!G.enableFX) return;
    let count = isBoss ? 45 : (isHeavy ? 30 : 20);
    let shockR = isBoss ? G.hexR * 3.2 : (isHeavy ? G.hexR * 2.5 : G.hexR * 1.8);

    // 2. Expanding Neon Shockwave ring in enemy's color
    spawnShock(e.x, e.y, e.color, shockR);
    if(isBoss || isHeavy) {
        spawnShock(e.x, e.y, '#ffffff', shockR * 0.6);
    }

    // 3. Expanding halo ring
    fxHalo(e.x, e.y, e.color);

    // 4. Directional Neon Vector Sparks (GeoDefense shard burst)
    for(let k = 0; k < count; k++) {
        let a = Math.random() * Math.PI * 2;
        let spd = (1.5 + Math.random() * 4.5) * (isBoss ? 1.4 : 1.0);
        let c = (k % 3 === 0) ? '#ffffff' : e.color;
        let r = 1.6 + Math.random() * 1.4;
        let life = 0.7 + Math.random() * 0.4;
        spawnParticle(e.x, e.y, Math.cos(a)*spd, Math.sin(a)*spd, life, c, 'spark', r);
    }

    // 5. Floating Cash Bounty Indicator
    spawnParticle(e.x, e.y - 4, 0, -0.9, 1.0, '#00ff88', 'text', 0, '+$' + e.val);
}
function towerRange(t) { return t.range * (1 + (t.lvl-1)*0.05); }
function toWorld(cx, cy) { let r = canvas.getBoundingClientRect(); return { x:(cx - r.left - G.view.ox)/G.view.s, y:(cy - r.top - G.view.oy)/G.view.s }; }
let isTouchDrag = false;
function dragLift() { return isTouchDrag ? (80 / G.view.s) : 0; } // ghost floats 80 screen px above the finger only on touch
function getNeighbors(c) { return c.nb || G.grid.filter(n => dist(c,n) < G.hexR*2.1 && n!==c); }

function getUpgradeCost(t) {
    return Math.floor(t.cost * Math.pow(1.36, t.lvl - 1) * 0.85);
}
function getSellRefund(t) {
    let invested = t.cost;
    for(let l = 1; l < t.lvl; l++) {
        invested += Math.floor(t.cost * Math.pow(1.36, l - 1) * 0.85);
    }
    return Math.floor(invested * 0.6);
}

// Bound once at game start (bindTouch handles both touch and mouse).
function setupMenuListeners() {
    const upgMenu = document.getElementById('upg-menu');
    if(upgMenu) {
        ['click', 'touchstart', 'mousedown'].forEach(evt => {
            upgMenu.addEventListener(evt, e => e.stopPropagation(), {passive: evt === 'touchstart' ? false : true});
        });
    }

    bindTouch('m-upg', (e) => {
        if(e) { e.stopPropagation(); }
        if(!G.selected) return;
        let t = G.selected; let isMax = t.lvl >= 6;
        let cost = getUpgradeCost(t);
        if(!isMax && G.cash >= cost) {
            G.cash -= cost; t.lvl++; 
            if(t.type === 'buff') {
                t.maxEnergy = 100 + (t.lvl - 1) * 20;
            }
            playSound('upgrade'); fxHalo(t.x,t.y,t.color); updateUI();
        } else playSound('boom');
    });

    bindTouch('m-sell', (e) => {
        if(e) { e.stopPropagation(); }
        if(!G.selected) return;
        let t = G.selected; let sell = getSellRefund(t);
        G.cash += sell; 
        let cell = G.grid.find(g=>g.q===t.q && g.r===t.r);
        if(cell) { cell.occ = false; cell.tower = null; }
        G.towers = G.towers.filter(to => to !== t);
        calcPath(); let plans = planEnemyRoutes(); if(plans) applyEnemyRoutes(plans);
        playSound('sell'); closeMenu(); updateUI();
    });

    bindTouch('m-lock', (e) => {
        if(e) { e.stopPropagation(); }
        if(!G.selected || G.selected.type !== 'laser') return;
        G.selected.lockedAngle = (G.selected.lockedAngle != null) ? null : G.selected.angle;
        updateMenuUI();
    });
}
function updateMenuUI() {
    if(!G.selected) return; let t = G.selected;
    let isMax = t.lvl >= 6; let cost = getUpgradeCost(t); let sell = getSellRefund(t);
    let statusText = "";
    if(t.type === 'laser') {
        if(t.cooldownTimer > 0) statusText = " [COOLING]";
        else if(t.firing) statusText = " [FIRING]";
        else statusText = " [READY]";
    } else if(t.type === 'missile') {
        let maxCd = t.maxCd || 140;
        let rPct = t.cd > 0 ? Math.round((1 - t.cd / maxCd) * 100) : 100;
        statusText = t.cd > 0 ? ` [RELOAD ${rPct}%]` : " [ARMED]";
    } else if(t.type === 'shock') {
        statusText = " [EMP WAVE]";
    } else if(t.type === 'buff') {
        let maxE = t.maxEnergy || (100 + (t.lvl - 1) * 20);
        let ePct = Math.round(((t.energy || 0) / maxE) * 100);
        statusText = t.bursting ? ` [BURST ${ePct}%]` : ` [NRG ${ePct}%]`;
    } else if(t.type === 'slow') {
        let maxArcs = t.lvl >= 6 ? 7 : t.lvl;
        statusText = ` [${(t.arcTargets||[]).length}/${maxArcs} ARCS]`;
    }
    document.getElementById('m-info').innerText = `${t.name} LVL ${t.lvl}${statusText}`;
    let btnUp = document.getElementById('m-upg');
    btnUp.innerText = isMax ? "MAX" : `UPGRADE $${cost}`; btnUp.style.opacity = (isMax || G.cash < cost) ? 0.5 : 1;
    document.getElementById('m-sell').innerText = `SELL $${sell}`;
    let btnLock = document.getElementById('m-lock');
    if(t.type === 'laser') { btnLock.style.display = 'block'; btnLock.innerText = (t.lockedAngle != null) ? "UNLOCK" : "LOCK"; } else btnLock.style.display = 'none';
}
function selectTower(t) {
    G.selected = t;
    const m = document.getElementById('upg-menu'); 
    updateMenuUI();
    m.style.display = 'block';
    let menuW = m.offsetWidth || 120;
    let menuH = m.offsetHeight || 110;
    let v = G.view, sx = t.x*v.s + v.ox, sy = t.y*v.s + v.oy, hr = G.hexR*v.s; // map -> screen
    let isBelow = (sy - hr - menuH - 12 < 10);
    let mx = sx - menuW/2;
    let my = isBelow ? (sy + hr + 12) : (sy - hr - menuH - 8);
    if(mx < 10) mx = 10; 
    if(mx > canvas.width - menuW - 10) mx = canvas.width - menuW - 10;
    m.classList.toggle('flip-below', isBelow);
    m.style.left = Math.round(mx)+'px'; 
    m.style.top = Math.round(my)+'px';
}
function closeMenu() { G.selected=null; document.getElementById('upg-menu').style.display='none'; }
let domCached = false;
let uiCashEl = null, uiWaveEl = null, uiScoreEl = null, uiHiEl = null, uiDiffEl = null, uiTimerEl = null, btnWaveEl = null;
let cachedTowerCards = [];
let lastCash = -1, lastWave = -1, lastScore = -1, lastHi = -1, lastDiff = '', lastTimerSec = -1;

function initDomCache() {
    if(domCached) return;
    uiCashEl = document.getElementById('ui-cash');
    uiWaveEl = document.getElementById('ui-wave');
    uiScoreEl = document.getElementById('ui-score');
    uiHiEl = document.getElementById('ui-hi');
    uiDiffEl = document.getElementById('ui-diff');
    uiTimerEl = document.getElementById('ui-timer');
    btnWaveEl = document.getElementById('btn-wave');
    cachedTowerCards = Array.from(document.querySelectorAll('.tower-card'));
    domCached = true;
}

function updateTowerCardsUI() {
    initDomCache();
    let curCash = Math.floor(G.cash);
    cachedTowerCards.forEach(card => {
        let type = card.dataset.type;
        let data = TOWER_DATA[type];
        if(data) {
            let canAfford = curCash >= data.cost;
            if(card._canAfford !== canAfford) {
                card._canAfford = canAfford;
                card.classList.toggle('cant-afford', !canAfford);
            }
        }
    });
}

function updateUI() { 
    initDomCache();
    if(G.active) updateRecord(G.difficulty, G.score, G.wave);
    let curCash = Math.floor(G.cash);
    if(curCash !== lastCash && uiCashEl) { uiCashEl.innerText = curCash; lastCash = curCash; }
    if(G.wave !== lastWave && uiWaveEl) { uiWaveEl.innerText = G.wave; lastWave = G.wave; }
    if(G.score !== lastScore && uiScoreEl) { uiScoreEl.innerText = G.score; lastScore = G.score; }
    if(uiHiEl) {
        let best = Math.max(G.score, (gameRecords[G.difficulty]?.score || 0));
        if(best !== lastHi) { uiHiEl.innerText = best; lastHi = best; }
    }
    if(uiDiffEl && G.difficulty !== lastDiff) {
        let diffKey = G.difficulty || 'normal';
        uiDiffEl.innerText = diffKey.toUpperCase();
        uiDiffEl.className = 'stat-diff ' + diffKey;
        lastDiff = diffKey;
    }
    updateTowerCardsUI();
    updateMenuUI(); 
}
function renderTowerIcons() {
    for(let key in TOWER_DATA) {
        let cvs = document.getElementById('icon-' + key);
        if(cvs) {
            // High-DPI 2x resolution buffer for crystal-clear vector line rendering
            cvs.width = 100;
            cvs.height = 92;
            let cx = cvs.getContext('2d');
            cx.clearRect(0, 0, 100, 92);
            let data = TOWER_DATA[key];
            cx.save();
            // Scale by 2 for Retina backing store, then center in 50x46 box
            cx.scale(2, 2);
            cx.translate(23, 23);
            cx.scale(1.4, 1.4);
            // Crisp neon glow
            cx.shadowColor = data.color;
            cx.shadowBlur = 6;
            drawTowerShape(cx, data.type, 1, data.color);
            cx.restore();
        }
    }
}
function startDrag(e, type) { 
    e.preventDefault(); 
    isTouchDrag = !!(e.touches && e.touches.length);
    if(G.selected) closeMenu(); 
    G.dragType = type; 
    dragPlacementCache.hex = null;
    updateDragPos(e); 
}
function moveDrag(e) { if(G.dragType) { e.preventDefault(); updateDragPos(e); } }
function updateDragPos(e) { let t = e.touches?e.touches[0]:e; let p = toWorld(t.clientX, t.clientY); G.dragPos.x = p.x; G.dragPos.y = p.y; }
function endDrag(e) {
    e.preventDefault(); if(!G.dragType) return;
    try {
        let ghostY = G.dragPos.y - dragLift();
        let hex = pixelToHex(G.dragPos.x, ghostY); 
        let data = TOWER_DATA[G.dragType];
        if(hex && canBuildOn(hex)) {
            if(G.cash >= data.cost) {
                // Immediate fresh path verification at the exact instant of drop
                hex.occ = true;
                let mainPath = findPath(G.start, G.end);
                let plans = mainPath ? planEnemyRoutes() : null;
                if(mainPath && plans) {
                    let newTower = {
                        q:hex.q, r:hex.r, x:hex.x, y:hex.y, ...data,
                        cd:0, lvl:1, angle:0, lockedAngle:null,
                        burstTimer: data.burst || 160, cooldownTimer: 0,
                        energy: 0, maxEnergy: 100, bursting: false, spin: 0,
                        arcTargets: [], shockwaves: [], barrelAlt: false, reloading: false
                    };
                    hex.tower = newTower;
                    G.towers.push(newTower);
                    G.path = mainPath;
                    applyEnemyRoutes(plans);
                    G.cash -= data.cost;
                    playSound('place'); fxExplode(hex.x, hex.y, '#fff', 8); updateUI();
                } else {
                    hex.occ = false; hex.tower = null;
                    playSound('boom'); fxExplode(hex.x, hex.y, '#ff0033', 5);
                }
            } else playSound('boom');
        }
    } catch(err) {
        console.error("Error in endDrag:", err);
    } finally {
        dragPlacementCache.hex = null;
        dragPlacementCache.lastCheck = -1;
        G.dragType = null;
    }
}
function fireLaser(t, buff) {
    // Full piercing line: laser penetrates and damages ALL enemies along its line of sight
    let reach = Math.max(G.w, G.h) * 1.5; 
    let ex = t.x + Math.cos(t.angle) * reach, ey = t.y + Math.sin(t.angle) * reach;
    t.firing = true;
    let hitCount = 0;
    G.enemies.forEach(e => {
        let eSize = e.size || 10;
        if(e.hp > 0 && !e.reached && distToSegmentSq({x:t.x, y:t.y}, {x:ex, y:ey}, e) < eSize * eSize) {
            let grav = (e.inGraviton > 0 ? 0.6 : 1.0);
            e.hp -= t.dmg * (1 + t.lvl * 0.5) * buff * grav;
            hitCount++;
            if(G.enableFX && G.frame % 3 === 0) fx(e.x, e.y, t.color, 2);
        }
    });
    if(G.enableFX && G.frame % 10 === 0) playSound('laser');
}
function handleClick(e) {
    if(G.dragType) return;
    let p = toWorld(e.clientX, e.clientY);
    let hex = pixelToHex(p.x, p.y);
    let clickRSq = G.hexR * 0.95 * G.hexR * 0.95;
    let t = (hex && hex.tower) || G.towers.find(to => (hex && to.q === hex.q && to.r === hex.r) || distSq(to, p) < clickRSq);
    if(t) { selectTower(t); } else closeMenu();
}
const drags = document.querySelectorAll('.tower-card');
drags.forEach(d => { d.addEventListener('touchstart', e => startDrag(e, d.dataset.type), {passive:false}); d.addEventListener('mousedown', e => startDrag(e, d.dataset.type)); });
renderTowerIcons();
updateTowerCardsUI();
window.addEventListener('touchmove', moveDrag, {passive:false}); window.addEventListener('mousemove', moveDrag);
window.addEventListener('touchend', endDrag); window.addEventListener('mouseup', endDrag);
canvas.addEventListener('touchstart', (e) => { 
    if(e.touches.length === 1) {
        e.preventDefault();
        handleClick({clientX: e.touches[0].clientX, clientY: e.touches[0].clientY}); 
    }
}, {passive:false});
canvas.addEventListener('click', handleClick);
window.addEventListener('keydown', (e) => {
    if(e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
        if(G.active) togglePause();
    }
});
</script>
