<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111111">
    <title>GeoDefense: Smart Targeting</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; }
        body { 
            margin: 0; background: #111; overflow: hidden; font-family: 'Courier New', monospace; 
            display: flex; flex-direction: column; height: 100vh; width: 100vw;
        }

        /* Top HUD */
        #top-bar {
            height: 40px; background: #080808; border-bottom: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 15px; flex-shrink: 0; z-index: 10;
        }
        .stat-group { display: flex; gap: 9px; font-weight: bold; font-size: 13px; text-shadow: 0 0 5px currentColor; }
        .stat-cash { color: #ff3; } .stat-wave { color: #3ff; } .stat-score { color: #fff; } .stat-hi { color: #fa0; }
        
        .top-btn {
            border: 1px solid #555; color: #888; font-size: 11px; padding: 3px 8px; 
            border-radius: 4px; cursor: pointer; background: #222; font-weight: bold;
        }
        .top-btn.active { color: #0f0; border-color: #0f0; background: #002200; }

        /* Game Area */
        #game-container { flex-grow: 1; position: relative; overflow: hidden; background: #050505; }
        canvas { display: block; width: 100%; height: 100%; }

        /* Bottom Controls */
        #bottom-bar {
            height: 85px; background: #080808; border-top: 1px solid #333;
            display: flex; justify-content: center; align-items: center; gap: 6px;
            padding: 0 10px; flex-shrink: 0; z-index: 10; overflow-x: auto;
        }

        /* Tower Card */
        .tower-card {
            width: 50px; height: 64px; border-radius: 4px; flex-shrink: 0;
            border: 1px solid #333; background: #151515;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            position: relative; transition: transform 0.1s, border-color 0.15s; cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        .tower-card:hover { border-color: #666; background: #1c1c1c; }
        .tower-card:active { transform: scale(1.08); border-color: #fff; background: #222; }
        .t-canvas { position: absolute; top: 2px; left: 0; width: 50px; height: 46px; pointer-events: none; }
        .t-cost { font-size: 10px; color: #aaa; margin-bottom: 4px; pointer-events: none; font-weight: bold; font-family: monospace; }
        
        /* Pause Button */
        #btn-pause {
            width: 45px; height: 45px; border-radius: 50%; border: 2px solid #666; flex-shrink: 0;
            color: #fff; font-size: 18px; margin-left: 10px; background: #222;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        /* Menus */
        #ui-layer { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; }

        #upg-menu {
            position: absolute; display: none; pointer-events: auto; z-index: 100;
            background: rgba(0,20,0,0.95); border: 1px solid #0f0; border-radius: 6px;
            padding: 6px; text-align: center; box-shadow: 0 0 20px rgba(0,255,0,0.3);
            min-width: 120px;
        }
        #upg-menu::after { content:''; position: absolute; bottom:-6px; left:50%; margin-left:-6px; border-width:6px 6px 0; border-style:solid; border-color:#0f0 transparent; }
        #upg-menu.flip-below::after { top:-6px; bottom:auto; border-width:0 6px 6px; border-style:solid; border-color:transparent transparent #0f0 transparent; }
        .menu-header { font-size:11px; color:#0f0; margin-bottom:5px; border-bottom: 1px solid #050; padding-bottom: 3px; }
        .menu-btn { 
            display: block; width: 100%; padding: 10px 0; margin: 3px 0; 
            background: #111; color: #fff; border: 1px solid #333; font: inherit; font-size: 11px; 
            cursor: pointer; touch-action: manipulation; border-radius: 3px;
        }
        .menu-btn:active { background: #333; }
        .btn-upg { color: #afa; border-color: #252; } 
        .btn-sell { color: #f55; border-color: #522; }
        .btn-lock { color: #0af; border-color: #058; display: none; }

        /* Next Wave Button */
        #btn-wave {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            padding: 6px 14px; border-radius: 20px; pointer-events: auto; cursor: pointer;
            font-size: 12px; animation: pulse 1s infinite; display: none;
            background: rgba(0, 40, 40, 0.9); border: 1px solid #3ff; color: #3ff;
        }
        @keyframes pulse { 0% {box-shadow:0 0 5px #3ff;} 50%{box-shadow:0 0 15px #3ff;} 100%{box-shadow:0 0 5px #3ff;} }

        /* Overlay */
        #overlay { 
            position: fixed; top:0;left:0;width:100%;height:100%; background:rgba(0,0,0,0.95); 
            color:#0f0; display:flex; flex-direction:column; align-items:center; justify-content:center; 
            font-size:20px; z-index:999; text-shadow: 0 0 20px #0f0; text-align: center;
        }
        /* Difficulty Selector */
        .diff-container { display: flex; gap: 8px; margin-top: 18px; margin-bottom: 5px; z-index: 1000; }
        .diff-btn {
            background: #111; border: 1px solid #444; color: #888;
            font-family: inherit; font-size: 11px; font-weight: bold;
            padding: 8px 14px; border-radius: 4px; cursor: pointer;
            transition: all 0.15s; pointer-events: auto;
            user-select: none; -webkit-user-select: none; touch-action: manipulation;
        }
        .diff-btn:hover:not(.selected) { background: #222; color: #ccc; border-color: #666; }
        .diff-btn:active { transform: scale(1.05); }
        .diff-btn.selected { color: #000; font-weight: 900; }
        .diff-btn[data-diff="easy"].selected { background: #00ff66; border-color: #00ff66; box-shadow: 0 0 12px rgba(0,255,102,0.6); }
        .diff-btn[data-diff="normal"].selected { background: #33ccff; border-color: #33ccff; box-shadow: 0 0 12px rgba(51,204,255,0.6); }
        .diff-btn[data-diff="hard"].selected { background: #ff9900; border-color: #ff9900; box-shadow: 0 0 12px rgba(255,153,0,0.6); }
        .diff-btn[data-diff="hell"].selected { background: #ff0044; border-color: #ff0044; box-shadow: 0 0 14px rgba(255,0,68,0.8); }
        .stat-diff { font-size: 11px; padding: 2px 5px; border-radius: 3px; font-weight: bold; border: 1px solid #333; }
        .stat-diff.easy { color: #00ff66; border-color: #005522; }
        .stat-diff.normal { color: #33ccff; border-color: #004466; }
        .stat-diff.hard { color: #ff9900; border-color: #663300; }
        .stat-diff.hell { color: #ff0044; border-color: #660011; }
        .blink { animation: blinker 1s linear infinite; margin-top: 20px; font-size: 14px; color: #fff;}
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div id="top-bar">
    <div id="btn-fx" class="top-btn active">FX: ON</div>
    <div class="stat-group">
        <span class="stat-cash">$<span id="ui-cash">120</span></span>
        <span class="stat-score">SC <span id="ui-score">0</span></span>
        <span class="stat-hi">HI <span id="ui-hi">0</span></span>
        <span class="stat-wave">WV <span id="ui-wave">0</span></span>
        <span id="ui-diff" class="stat-diff normal">NORMAL</span>
    </div>
    <div id="btn-speed" class="top-btn">1x</div>
</div>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer">
        <div id="btn-wave">NEXT WAVE (<span id="ui-timer">0</span>)</div>
        <div id="upg-menu">
            <div class="menu-header" id="m-info">TOWER</div>
            <button class="menu-btn btn-upg" id="m-upg">UPGRADE</button>
            <button class="menu-btn btn-lock" id="m-lock">LOCK ANGLE</button>
            <button class="menu-btn btn-sell" id="m-sell">SELL</button>
        </div>
    </div>
</div>

<div id="bottom-bar">
    <div class="tower-card" data-type="green" style="border-color:#050"><canvas class="t-canvas" id="icon-green"></canvas><span class="t-cost">$15</span></div>
    <div class="tower-card" data-type="blue" style="border-color:#005"><canvas class="t-canvas" id="icon-blue"></canvas><span class="t-cost">$80</span></div>
    <div class="tower-card" data-type="red" style="border-color:#500"><canvas class="t-canvas" id="icon-red"></canvas><span class="t-cost">$40</span></div>
    <div class="tower-card" data-type="purple" style="border-color:#505"><canvas class="t-canvas" id="icon-purple"></canvas><span class="t-cost">$120</span></div>
    <div class="tower-card" data-type="yellow" style="border-color:#550"><canvas class="t-canvas" id="icon-yellow"></canvas><span class="t-cost">$60</span></div>
    <div class="tower-card" data-type="orange" style="border-color:#530"><canvas class="t-canvas" id="icon-orange"></canvas><span class="t-cost">$100</span></div>
    <div id="btn-pause">||</div>
</div>

<div id="overlay">
    <div id="ov-title">GEODEFENSE SWARM V2.14b</div>
    <div id="ov-sub" style="font-size:12px; color:#aaa; margin-top:10px">Towers only attack active enemies.</div>
    <div class="diff-container" id="diff-selector">
        <button class="diff-btn" data-diff="easy">EASY</button>
        <button class="diff-btn selected" data-diff="normal">NORMAL</button>
        <button class="diff-btn" data-diff="hard">HARD</button>
        <button class="diff-btn" data-diff="hell">HELL</button>
    </div>
    <div id="diff-best" style="font-size:12px; color:#ffdd00; margin-top:10px; font-weight:bold; letter-spacing:1px; text-shadow:0 0 8px rgba(255,221,0,0.6);">RECORD: WAVE 0  ·  SCORE 0</div>
    <div id="ov-action" class="blink">TAP TO START</div>
</div>

<script>
// --- Config ---
const TOWER_DATA = {
    green:  { name: "BLASTER", cost: 15, range: 90,  dmg: 8, rate: 12, color: '#0f0', type:'bolt' },
    blue:   { name: "LASER",   cost: 80, range: 130, dmg: 0.8,rate: 0,  color: '#0af', type:'laser' },
    red:    { name: "MISSILE", cost: 40, range: 140, dmg: 40, rate: 70, color: '#f00', type:'missile', splash: 50 },
    purple: { name: "SNIPER",  cost: 120,range: 300, dmg: 150,rate: 110,color: '#d0f', type:'sniper' },
    yellow: { name: "SHOCK",   cost: 60, range: 100, dmg: 0.5,rate: 5,  color: '#ff0', type:'shock' },
    orange: { name: "COLLECTOR",cost: 100,range: 80,  dmg: 0,  rate: 0,  color: '#f80', type:'buff' }
};

const DIFFICULTY_CONFIG = {
    easy:   { name: "EASY",   label: "EASY",   hp: 30, cash: 160, hpMult: 0.75, spdMult: 0.9,  scoreMult: 0.8 },
    normal: { name: "NORMAL", label: "NORMAL", hp: 20, cash: 120, hpMult: 1.0,  spdMult: 1.0,  scoreMult: 1.0 },
    hard:   { name: "HARD",   label: "HARD",   hp: 15, cash: 100, hpMult: 1.4,  spdMult: 1.15, scoreMult: 1.5 },
    hell:   { name: "HELL",   label: "HELL",   hp: 10, cash: 80,  hpMult: 2.1,  spdMult: 1.3,  scoreMult: 2.5 }
};

let G = {
    w:0, h:0, hexR:0, active:false, paused:false, speed:1, enableFX: true,
    difficulty: 'normal',
    hp:20, cash:120, wave:0, score:0, // wave is incremented when a wave starts, so the first one is wave 1
    grid:[], path:[], towers:[], enemies:[], projs:[], parts:[], shocks:[],
    start:null, end:null, warpIn:null, warpOut:null, selected:null,
    dragType:null, dragPos:{x:0,y:0},
    waveTimer:0, spawning:false, spawnQ:0, frame:0, shake: 0, endHit: 0,
    view:{s:1, ox:0, oy:0}, // map-to-screen scale/offset (for resize/rotation)
    overAt:0 // time of game over (0 = still playing)
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const container = document.getElementById('game-container');
let actx;

// --- Performance Optimization: 1. Offscreen Canvas for Static Grid & Portals ---
const bgCanvas = document.createElement('canvas');
const bgCtx = bgCanvas.getContext('2d', { alpha: false });

function renderBgCache() {
    if(!G.w || !G.h || !G.grid.length) return;
    bgCanvas.width = G.w;
    bgCanvas.height = G.h;
    bgCtx.fillStyle = '#050505';
    bgCtx.fillRect(0, 0, G.w, G.h);
    bgCtx.lineWidth = 1;

    G.grid.forEach(c => {
        if(c.wall || c.type === 'wall' || c.type === 'obs') {
            if(c.wall || c.type === 'wall') {
                // Outer perimeter wall: Solid boundary hex (0.92R)
                bgCtx.fillStyle = '#021808';
                bgCtx.beginPath(); hexPath(c.x, c.y, G.hexR * 0.92, bgCtx); bgCtx.fill();
                bgCtx.shadowColor = '#00ff66';
                bgCtx.shadowBlur = G.enableFX ? 8 : 0;
                bgCtx.strokeStyle = '#00ff66';
                bgCtx.lineWidth = 1.8;
                bgCtx.stroke();
                bgCtx.shadowBlur = 0;
                // Inner concentric energy ring & cross mark
                bgCtx.strokeStyle = '#007733';
                bgCtx.lineWidth = 1;
                bgCtx.beginPath();
                hexPath(c.x, c.y, G.hexR * 0.45, bgCtx);
                bgCtx.moveTo(c.x - 3, c.y); bgCtx.lineTo(c.x + 3, c.y);
                bgCtx.moveTo(c.x, c.y - 3); bgCtx.lineTo(c.x, c.y + 3);
                bgCtx.stroke();
            } else {
                // Internal natural obstacle / debris pillar: Refined inset pylon (0.78R) with base foundation (0.88R)
                bgCtx.strokeStyle = '#003318';
                bgCtx.lineWidth = 1;
                bgCtx.beginPath(); hexPath(c.x, c.y, G.hexR * 0.88, bgCtx); bgCtx.stroke();

                bgCtx.fillStyle = '#011005';
                bgCtx.beginPath(); hexPath(c.x, c.y, G.hexR * 0.78, bgCtx); bgCtx.fill();
                bgCtx.strokeStyle = '#00883a';
                bgCtx.lineWidth = 1.3;
                bgCtx.stroke();
                // Inner dark emerald core node
                bgCtx.fillStyle = '#023814';
                bgCtx.beginPath(); hexPath(c.x, c.y, G.hexR * 0.40, bgCtx); bgCtx.fill();
                bgCtx.strokeStyle = '#005522';
                bgCtx.lineWidth = 0.8;
                bgCtx.stroke();
            }
        } else {
            bgCtx.strokeStyle = '#0a2a2a';
            bgCtx.lineWidth = 1;
            bgCtx.beginPath(); hexPath(c.x, c.y, G.hexR, bgCtx); bgCtx.stroke();
        }
    });

    if(G.start) {
        drawHexSolid(G.start.x, G.start.y, G.hexR * 0.90, '#ffdd00', 0.25, bgCtx);
        bgCtx.shadowColor = '#ffea00';
        bgCtx.shadowBlur = G.enableFX ? 14 : 0;
        bgCtx.strokeStyle = '#ffee33';
        bgCtx.lineWidth = 2.0;
        bgCtx.beginPath(); hexPath(G.start.x, G.start.y, G.hexR * 0.90, bgCtx); bgCtx.stroke();
        bgCtx.strokeStyle = '#ffd700';
        bgCtx.lineWidth = 1.4;
        bgCtx.beginPath();
        bgCtx.arc(G.start.x, G.start.y, G.hexR * 0.45, 0, 6.28);
        bgCtx.moveTo(G.start.x - 4, G.start.y); bgCtx.lineTo(G.start.x + 4, G.start.y);
        bgCtx.moveTo(G.start.x, G.start.y - 4); bgCtx.lineTo(G.start.x, G.start.y + 4);
        bgCtx.stroke();
        bgCtx.shadowBlur = 0;
    }

    if(G.end) {
        drawHexSolid(G.end.x, G.end.y, G.hexR * 0.90, '#f00', 0.3, bgCtx);
        bgCtx.strokeStyle = '#ff2244';
        bgCtx.lineWidth = 1.8;
        bgCtx.beginPath(); hexPath(G.end.x, G.end.y, G.hexR * 0.90, bgCtx); bgCtx.stroke();
    }
}

function drawSpecialObstacles(c) {
    let hr = G.hexR;
    if(!hr || !G.grid.length) return;

    // 1. Quantum Warp Gates (Alpha -> Omega)
    if(G.warpIn && G.warpOut) {
        // Quantum entanglement tether line
        c.save();
        c.strokeStyle = '#00ffff';
        c.lineWidth = 1;
        c.globalAlpha = 0.25 + Math.sin(G.frame * 0.08) * 0.12;
        c.setLineDash([4, 6]);
        c.beginPath();
        c.moveTo(G.warpIn.x, G.warpIn.y);
        c.lineTo(G.warpOut.x, G.warpOut.y);
        c.stroke();
        c.setLineDash([]);
        c.restore();

        // Warp In (Alpha singularity entrance)
        let wi = G.warpIn;
        drawHexSolid(wi.x, wi.y, hr * 0.88, '#00ffff', 0.12, c);
        c.save(); c.translate(wi.x, wi.y);
        c.strokeStyle = '#00ffff'; c.lineWidth = 1.8;
        c.beginPath(); hexPath(0, 0, hr * 0.88, c); c.stroke();
        // Rotating 3-arm accretion vortex
        let wSpin = G.frame * 0.06;
        for(let k = 0; k < 3; k++) {
            let a = wSpin + k * (Math.PI * 2 / 3);
            c.beginPath();
            c.moveTo(Math.cos(a)*hr*0.72, Math.sin(a)*hr*0.72);
            c.quadraticCurveTo(Math.cos(a + 0.8)*hr*0.45, Math.sin(a + 0.8)*hr*0.45, 0, 0);
            c.strokeStyle = '#00ffff'; c.lineWidth = 1.4; c.stroke();
        }
        // Black hole center
        c.beginPath(); c.arc(0, 0, hr * 0.22, 0, 6.28);
        c.fillStyle = '#001a1a'; c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 1; c.stroke();
        c.fillStyle = '#00ffff'; c.font = "bold 8px Courier New"; c.textAlign = 'center';
        c.fillText("WARP IN", 0, hr * 0.55);
        c.restore();

        // Warp Out (Omega exit portal)
        let wo = G.warpOut;
        drawHexSolid(wo.x, wo.y, hr * 0.88, '#ff00ff', 0.12, c);
        c.save(); c.translate(wo.x, wo.y);
        c.strokeStyle = '#ff00ff'; c.lineWidth = 1.8;
        c.beginPath(); hexPath(0, 0, hr * 0.88, c); c.stroke();
        // Expanding outward shockwave ring
        let oRing = (G.frame * 0.6) % (hr * 0.72);
        c.beginPath(); c.arc(0, 0, oRing, 0, 6.28);
        c.strokeStyle = 'rgba(255, 0, 255, ' + Math.max(0, 1 - oRing/(hr*0.72)) + ')';
        c.lineWidth = 1.5; c.stroke();
        // Radiating star emitter
        for(let k = 0; k < 4; k++) {
            let a = -wSpin + k * (Math.PI / 2);
            c.beginPath();
            c.moveTo(0, 0); c.lineTo(Math.cos(a)*hr*0.6, Math.sin(a)*hr*0.6);
            c.strokeStyle = '#ffffff'; c.lineWidth = 1.2; c.stroke();
        }
        // White core
        c.beginPath(); c.arc(0, 0, hr * 0.2, 0, 6.28);
        c.fillStyle = '#ffffff'; c.fill();
        c.fillStyle = '#ff00ff'; c.font = "bold 8px Courier New"; c.textAlign = 'center';
        c.fillText("WARP OUT", 0, hr * 0.55);
        c.restore();
    }

    // 2. Speed Pads, Slow Graviton Wells, and Single Way Conduits
    for(let cell of G.grid) {
        if(cell.type === 'speed_pad') {
            // Neon Gold Kinetic Accelerator Pad
            drawHexSolid(cell.x, cell.y, hr * 0.88, '#ffaa00', 0.15, c);
            c.save(); c.translate(cell.x, cell.y);
            c.strokeStyle = '#ffcc00'; c.lineWidth = 1.6;
            c.beginPath(); hexPath(0, 0, hr * 0.88, c); c.stroke();
            // Triple animated forward chevrons
            let seq = Math.floor(G.frame * 0.15) % 3;
            for(let i = -1; i <= 1; i++) {
                let yOff = i * hr * 0.25;
                let active = (i + 1 === seq);
                c.strokeStyle = active ? '#ffffff' : '#ff9900';
                c.lineWidth = active ? 2.2 : 1.4;
                c.beginPath();
                c.moveTo(-hr * 0.35, yOff + hr * 0.1);
                c.lineTo(0, yOff - hr * 0.1);
                c.lineTo(hr * 0.35, yOff + hr * 0.1);
                c.stroke();
            }
            c.fillStyle = '#ffcc00'; c.font = "bold 7px Courier New"; c.textAlign = 'center';
            c.fillText("SPEED", 0, hr * 0.58);
            c.restore();
        }
        else if(cell.type === 'slow_pad') {
            // Graviton Inversion Slow Well (Ultraviolet Violet/Purple)
            drawHexSolid(cell.x, cell.y, hr * 0.88, '#9900ff', 0.18, c);
            c.save(); c.translate(cell.x, cell.y);
            c.strokeStyle = '#bb33ff'; c.lineWidth = 1.6;
            c.beginPath(); hexPath(0, 0, hr * 0.88, c); c.stroke();
            // Inward graviton vortex
            let gSpin = -G.frame * 0.04;
            for(let k = 0; k < 4; k++) {
                let a = gSpin + k * (Math.PI / 2);
                c.beginPath();
                c.moveTo(Math.cos(a)*hr*0.65, Math.sin(a)*hr*0.65);
                c.lineTo(Math.cos(a + 1.2)*hr*0.2, Math.sin(a + 1.2)*hr*0.2);
                c.strokeStyle = 'rgba(210, 100, 255, 0.7)'; c.lineWidth = 1.4; c.stroke();
            }
            // Dense gravity eye
            c.beginPath(); c.arc(0, 0, hr * 0.22, 0, 6.28);
            c.fillStyle = '#220033'; c.fill();
            c.strokeStyle = '#ffffff'; c.lineWidth = 1; c.stroke();
            c.fillStyle = '#d966ff'; c.font = "bold 7px Courier New"; c.textAlign = 'center';
            c.fillText("SLOW", 0, hr * 0.58);
            c.restore();
        }
        else if(cell.type === 'oneway' && cell.onewayTarget) {
            // Neon Emerald Single-Way Flow Conduit
            drawHexSolid(cell.x, cell.y, hr * 0.88, '#00ff66', 0.12, c);
            c.save(); c.translate(cell.x, cell.y);
            c.strokeStyle = '#00ff88'; c.lineWidth = 1.5;
            c.beginPath(); hexPath(0, 0, hr * 0.88, c); c.stroke();
            // Rotate along conduit direction
            c.rotate(cell.dirAngle || 0);
            let arrowPulse = (G.frame * 0.1) % 1;
            // Draw directional vector arrow
            c.strokeStyle = '#00ff88'; c.lineWidth = 2.0;
            c.beginPath();
            c.moveTo(-hr * 0.45, 0); c.lineTo(hr * 0.45, 0);
            c.lineTo(hr * 0.2, -hr * 0.25);
            c.moveTo(hr * 0.45, 0); c.lineTo(hr * 0.2, hr * 0.25);
            c.stroke();
            // Moving inner pulse chevron
            let px = -hr * 0.3 + arrowPulse * hr * 0.6;
            c.strokeStyle = '#ffffff'; c.lineWidth = 1.5;
            c.beginPath();
            c.moveTo(px - hr * 0.15, -hr * 0.18);
            c.lineTo(px, 0);
            c.lineTo(px - hr * 0.15, hr * 0.18);
            c.stroke();
            c.restore();
        }
    }
}

function drawEndpoint(c) {
    if(!G.end) return;
    let ex = G.end.x, ey = G.end.y;
    let hr = G.hexR || 20;
    let hit = (G.endHit || 0) > 0;
    let hitRatio = (G.endHit || 0) / 30; // 1.0 down to 0

    // 1. Pre-rendered Neon Glow (intense flashing red when breached, breathing crimson when idle)
    let glowSize = hr * (hit ? (1.8 + hitRatio * 1.5) : (1.3 + Math.sin(G.frame * 0.06) * 0.2));
    drawGlow(c, ex, ey, glowSize, '#ff0033');

    // 2. Base Hex Fill pulse
    let fillAlpha = hit ? (0.35 + (G.endHit % 6 < 3 ? 0.3 : 0)) : (0.18 + Math.sin(G.frame * 0.05) * 0.08);
    drawHexSolid(ex, ey, hr * 0.90, hit ? '#ffffff' : '#ff0033', fillAlpha, c);

    c.save();
    c.translate(ex, ey);

    // 3. Rotating Warning Shield Rings
    let spin1 = G.frame * 0.03;
    let spin2 = -G.frame * 0.045;

    // Outer rotating hazard ring with dashed notches
    c.save();
    c.rotate(spin1);
    c.strokeStyle = hit ? '#ffffff' : '#ff2255';
    c.lineWidth = hit ? 2.5 : 1.5;
    c.setLineDash([hr * 0.35, hr * 0.18]);
    c.beginPath();
    hexPath(0, 0, hr * 0.90, c);
    c.stroke();
    c.restore();

    // Inner counter-rotating warning circle with 3 tick marks
    c.save();
    c.rotate(spin2);
    c.strokeStyle = hit ? '#ffcc00' : '#ff0044';
    c.lineWidth = 1.2;
    c.setLineDash([3, 4]);
    c.beginPath();
    c.arc(0, 0, hr * 0.62, 0, 6.28);
    c.stroke();
    c.setLineDash([]);
    // 3 radial tick marks
    for(let k = 0; k < 3; k++) {
        let a = k * (Math.PI * 2 / 3);
        c.beginPath();
        c.moveTo(Math.cos(a) * hr * 0.45, Math.sin(a) * hr * 0.45);
        c.lineTo(Math.cos(a) * hr * 0.62, Math.sin(a) * hr * 0.62);
        c.stroke();
    }
    c.restore();

    // 4. Hit shock ripple expanding from core
    if(hit) {
        let rippleR = hr * (0.4 + (1 - hitRatio) * 1.6);
        c.strokeStyle = `rgba(255, 255, 255, ${hitRatio * 0.8})`;
        c.lineWidth = 2;
        c.beginPath();
        hexPath(0, 0, rippleR, c);
        c.stroke();
    }

    // 5. Dynamic Base HP Label (Pops in size and flashes white/red upon damage)
    let fontSize = Math.round(15 + (hit ? hitRatio * 8 : 0));
    c.font = `bold ${fontSize}px Courier New`;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillStyle = hit ? (G.endHit % 4 < 2 ? '#ffffff' : '#ff0033') : '#ffffff';
    c.shadowColor = '#ff0033';
    c.shadowBlur = hit ? 10 : 4;
    c.fillText(G.hp, 0, 0);
    c.shadowBlur = 0;

    c.restore();
}

// --- Performance Optimization: 2. Pre-rendered Neon Glow Sprite Cache ---
const glowCache = new Map();
function getGlowSprite(color) {
    if(glowCache.has(color)) return glowCache.get(color);
    const size = 64;
    const gCvs = document.createElement('canvas');
    gCvs.width = size; gCvs.height = size;
    const gCtx = gCvs.getContext('2d');
    const grad = gCtx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    grad.addColorStop(0, color);
    grad.addColorStop(0.35, color);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    gCtx.fillStyle = grad;
    gCtx.globalAlpha = 0.55;
    gCtx.beginPath();
    gCtx.arc(size/2, size/2, size/2, 0, 6.28);
    gCtx.fill();
    glowCache.set(color, gCvs);
    return gCvs;
}
function drawGlow(targetCtx, x, y, r, color) {
    if(!G.enableFX) return;
    let sprite = getGlowSprite(color);
    targetCtx.drawImage(sprite, x - r, y - r, r * 2, r * 2);
}

// --- Performance Optimization: 3. Zero-Allocation Object Pools for Particles & Shocks ---
const MAX_PARTS = 300;
const particlePool = [];
for(let i=0; i<MAX_PARTS; i++) {
    particlePool.push({ active:false, x:0, y:0, vx:0, vy:0, life:0, color:'#fff', type:'dot', r:2, text:'' });
}
function spawnParticle(x, y, vx, vy, life, color, type='dot', r=2, text='') {
    if(!G.enableFX) return;
    for(let i=0; i<MAX_PARTS; i++) {
        let p = particlePool[i];
        if(!p.active) {
            p.active = true; p.x = x; p.y = y; p.vx = vx; p.vy = vy;
            p.life = life; p.color = color; p.type = type; p.r = r; p.text = text;
            return p;
        }
    }
}

const MAX_SHOCKS = 40;
const shockPool = [];
for(let i=0; i<MAX_SHOCKS; i++) {
    shockPool.push({ active:false, x:0, y:0, r:1, maxR:60, color:'#f00', alpha:1 });
}
function spawnShock(x, y, color, maxR=60) {
    if(!G.enableFX) return;
    for(let i=0; i<MAX_SHOCKS; i++) {
        let s = shockPool[i];
        if(!s.active) {
            s.active = true; s.x = x; s.y = y; s.r = 1; s.maxR = maxR;
            s.color = color; s.alpha = 1;
            return s;
        }
    }
}

// --- Helper: Touch Binding (The key to mobile success) ---
function bindTouch(id, fn) {
    const el = document.getElementById(id);
    if(el) {
        // Remove old listeners to prevent stacking if function called multiple times (though we only call init once)
        let newEl = el.cloneNode(true);
        el.parentNode.replaceChild(newEl, el);
        
        newEl.addEventListener('touchstart', (e) => { 
            e.preventDefault(); e.stopPropagation(); 
            fn(e); 
        }, {passive: false});
        
        // Mouse fallback
        newEl.addEventListener('click', (e) => { 
            e.preventDefault(); 
            fn(e); 
        });
    }
}

// --- High Scores & Record System ---
const STORAGE_KEY = 'geodefense_swarm_records_v1';
function loadRecords() {
    try {
        let raw = localStorage.getItem(STORAGE_KEY);
        if(raw) {
            let data = JSON.parse(raw);
            if(data && typeof data === 'object') return data;
        }
    } catch(e) {}
    return {
        easy:   { score: 0, wave: 0 },
        normal: { score: 0, wave: 0 },
        hard:   { score: 0, wave: 0 },
        hell:   { score: 0, wave: 0 }
    };
}
function saveRecords(records) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); } catch(e) {}
}
let gameRecords = loadRecords();

function updateRecord(diff, score, wave) {
    if(!gameRecords[diff]) gameRecords[diff] = { score: 0, wave: 0 };
    let rec = gameRecords[diff];
    let isNewScore = score > rec.score;
    let isNewWave = wave > rec.wave;
    if(isNewScore) rec.score = score;
    if(isNewWave) rec.wave = wave;
    if(isNewScore || isNewWave) saveRecords(gameRecords);
    return { isNewScore, isNewWave, bestScore: rec.score, bestWave: rec.wave };
}
