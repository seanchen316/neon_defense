<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Geo Defense: Titanium V10 FX</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, monospace;
            touch-action: none;
            user-select: none;
            color: white;
            -webkit-font-smoothing: antialiased;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background: #020202;
        }

        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        /* Top Tower Control Area */
        .top-tower-area {
            position: relative;
            width: 100%;
            height: 100px;
            background: linear-gradient(to bottom, rgba(0,0,0,1) 30%, rgba(0,0,0,0.8) 90%, transparent);
            pointer-events: auto;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Bottom Info Bar */
        .bottom-info-bar {
            padding: 8px 12px 12px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
            min-height: 50px;
            box-sizing: border-box;
        }
        .stats-group { display: flex; gap: 10px; align-items: center; font-size: 13px; font-weight: bold; }
        .stat-val { font-family: monospace; font-size: 1.2em; margin-left: 2px; color: #fff; }
        
        .ctrl-btn {
            background: rgba(255,255,255,0.1); border: 1px solid #666; color: #ccc;
            font-size: 11px; padding: 4px 8px; cursor: pointer; min-width: 30px; pointer-events: auto;
            border-radius: 4px; margin-left: 5px; text-align: center;
        }
        #pauseBtn.paused { background: #f00; color: #fff; border-color: #f00; animation: pulse 1s infinite; }

        #miniTimer {
            background: rgba(0, 50, 60, 0.9); border: 1px solid #0cf; color: #0cf;
            padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;
            min-width: 60px; text-align: center; display: none;
            animation: pulse 1s infinite; pointer-events: auto;
        }
        @keyframes pulse { 50% { opacity: 0.7; } }

        /* Build Panel */
        #buildPanel {
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            padding-top: 8px; box-sizing: border-box;
            transition: transform 0.2s ease-out, opacity 0.2s;
            position: absolute; top: 0; left: 0;
        }

        .tower-drag-item {
            width: 58px; height: 68px;
            border: 1px solid rgba(0, 255, 255, 0.3); 
            background: radial-gradient(circle at center, #111822 0%, #05080c 100%);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            cursor: grab; position: relative;
            touch-action: none;
            border-radius: 4px;
            box-shadow: inset 0 0 10px rgba(0,255,255,0.05), 0 0 6px rgba(0,0,0,0.8);
            transition: all 0.15s ease;
        }
        .tower-drag-item:hover {
            border-color: rgba(0, 255, 255, 0.7);
            box-shadow: inset 0 0 15px rgba(0,255,255,0.15), 0 0 10px rgba(0,255,255,0.3);
        }
        .tower-drag-item:active { border-color: #fff; transform: scale(0.95); }
        .tower-icon { width: 30px; height: 30px; margin-bottom: 2px; position: relative; display: flex; align-items: center; justify-content: center; }
        .tower-cost { font-size: 10px; color: #0ff; font-family: monospace; font-weight: bold; text-shadow: 0 0 4px rgba(0,255,255,0.5); }

        /* Upgrade Popup Menu */
        #upgradePanel {
            position: absolute; top: 0; left: 0;
            display: flex; flex-direction: column; align-items: stretch; gap: 6px;
            background: rgba(10, 15, 22, 0.96);
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 8px;
            box-shadow: 0 0 18px rgba(0, 255, 255, 0.25), 0 4px 16px rgba(0, 0, 0, 0.85);
            padding: 8px 10px;
            box-sizing: border-box;
            min-width: 136px;
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.92);
            transition: opacity 0.15s ease-out, transform 0.15s ease-out, visibility 0.15s;
            z-index: 30;
        }
        
        #upgradePanel.active {
            visibility: visible;
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        .upg-info { text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; }
        .upg-title { font-size: 12px; font-weight: bold; color: #fff; margin-bottom: 1px; letter-spacing: 0.5px; }
        .upg-desc { font-size: 9px; color: #888; }
        .upg-actions { display: flex; gap: 6px; justify-content: center; }

        .action-btn {
            padding: 6px 10px; border-radius: 5px; cursor: pointer;
            font-weight: bold; font-size: 11px; text-align: center;
            min-width: 54px; border: 1px solid; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: all 0.15s;
        }
        #btnUpgrade { background: rgba(0, 50, 0, 0.5); border-color: #0f0; color: #0f0; }
        #btnUpgrade:active { background: #0f0; color: #000; }
        /* Dimmed State */
        #btnUpgrade.disabled { 
            opacity: 0.3; 
            filter: grayscale(1); 
            pointer-events: none; 
            border-color: #555; 
            background: rgba(50, 50, 50, 0.5);
        }
        
        #btnSell { background: rgba(50, 0, 0, 0.5); border-color: #f00; color: #f00; }
        /* #btnSell:active { background: #f00; color: #000; } */
        #btnLock { background: rgba(0, 50, 80, 0.5); border-color: #0cf; color: #0cf; display: none; } /* Hidden by default */
        #btnLock.locked { background: #0cf; color: #000; }

        /* Icons */
        .icon-blaster {
            width: 22px; height: 22px; border: 2px solid #0f0; border-radius: 50%;
            box-shadow: 0 0 8px #0f0, inset 0 0 4px #0f0;
            background: rgba(0, 255, 0, 0.15);
            position: relative;
        }
        .icon-blaster::after {
            content: ''; position: absolute; right: -5px; top: 8px; width: 7px; height: 3px; background: #0f0; box-shadow: 0 0 4px #0f0;
        }

        .icon-sniper {
            width: 22px; height: 22px; border: 1px solid #f00; border-radius: 2px;
            box-shadow: 0 0 8px #f00, inset 0 0 4px #f00;
            background: rgba(255, 0, 0, 0.15);
            position: relative;
            transform: rotate(45deg);
        }
        .icon-sniper::after {
            content: ''; position: absolute; left: 3px; top: 9px; width: 16px; height: 2px; background: #fff; box-shadow: 0 0 4px #f00;
            transform: rotate(-45deg);
        }

        .icon-missile {
            width: 22px; height: 22px; border: 2px solid #fa0; border-radius: 4px;
            box-shadow: 0 0 8px #fa0, inset 0 0 4px #fa0;
            background: rgba(255, 170, 0, 0.15);
            position: relative;
        }
        .icon-missile::after {
            content: ''; position: absolute; width: 8px; height: 8px; border: 1px solid #fff; top: 5px; left: 5px; box-shadow: 0 0 4px #fa0;
        }

        .icon-slower {
            width: 22px; height: 22px; border: 2px solid #0cf; border-radius: 50%; border-style: double;
            box-shadow: 0 0 8px #0cf, inset 0 0 4px #0cf;
            background: rgba(0, 207, 255, 0.15);
        }

        .icon-energy {
            width: 22px; height: 22px; border: 2px solid #a0f; border-radius: 3px;
            box-shadow: 0 0 8px #a0f, inset 0 0 4px #a0f;
            background: rgba(160, 0, 255, 0.15);
            transform: rotate(45deg);
            position: relative;
        }
        .icon-energy::after {
            content: ''; position: absolute; width: 6px; height: 6px; background: #fff; top: 6px; left: 6px; box-shadow: 0 0 6px #a0f;
        }
        .disabled { opacity: 0.3; filter: grayscale(1); pointer-events: none; }

        /* Modal */
        #modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            pointer-events: auto; z-index: 200;
        }
        
        .diff-container { display: flex; flex-direction: column; gap: 8px; width: 280px; margin-bottom: 15px; }
        .diff-btn {
            padding: 8px 12px; background: transparent; border: 1px solid #555; color: #888;
            cursor: pointer; font-family: monospace; font-weight: bold; transition: 0.2s; width: 100%; text-align: left;
            display: flex; flex-direction: column; gap: 2px; box-sizing: border-box;
        }
        .diff-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .diff-btn.selected { border-color: #0f0; color: #fff; background: rgba(0,255,0,0.15); box-shadow: 0 0 15px #0f0; }
        .diff-row-main { display: flex; justify-content: space-between; align-items: center; width: 100%; font-size: 13px; }
        .diff-sub { font-size: 10px; color: #888; font-weight: normal; }
        .diff-record { font-size: 10px; color: #0cf; font-weight: normal; letter-spacing: 0.5px; }
        
        .options { margin-bottom: 25px; display: flex; flex-direction: column; gap: 10px; color: #ccc; font-size: 14px; }
        .opt-row { display: flex; align-items: center; gap: 10px; }
        input[type="checkbox"] { transform: scale(1.4); cursor: pointer; }

        #startBtn {
            padding: 15px 50px; font-size: 20px;
            background: rgba(0, 50, 0, 0.8); color: #0f0; border: 2px solid #0f0;
            box-shadow: 0 0 25px #0f0; cursor: pointer;
            font-family: monospace; font-weight: bold;
        }
        #startBtn:active { transform: scale(0.95); background: #0f0; color: #000; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="uiLayer">
        <div class="top-tower-area" id="topBar">
            <div id="buildPanel">
                <div class="tower-drag-item" data-type="blaster"><canvas class="tower-canvas" data-type="blaster" width="36" height="36"></canvas><div class="tower-cost">$15</div></div>
                <div class="tower-drag-item" data-type="sniper"><canvas class="tower-canvas" data-type="sniper" width="36" height="36"></canvas><div class="tower-cost">$40</div></div>
                <div class="tower-drag-item" data-type="missile"><canvas class="tower-canvas" data-type="missile" width="36" height="36"></canvas><div class="tower-cost">$70</div></div>
                <div class="tower-drag-item" data-type="slower"><canvas class="tower-canvas" data-type="slower" width="36" height="36"></canvas><div class="tower-cost">$50</div></div>
                <div class="tower-drag-item" data-type="energy"><canvas class="tower-canvas" data-type="energy" width="36" height="36"></canvas><div class="tower-cost">$100</div></div>
                <button id="pauseBtn" class="ctrl-btn">II</button>
            </div>
        </div>

        <div id="upgradePanel">
            <div class="upg-info">
                <div class="upg-title" id="upgTitle">TOWER LV.1</div>
                <div class="upg-desc">TAP MAP TO CLOSE</div>
            </div>
            <div class="upg-actions">
                <div class="action-btn" id="btnLock">LOCK</div>
                <div class="action-btn" id="btnUpgrade">UPGRADE<span style="font-size:10px" id="upgCost">$50</span></div>
                <div class="action-btn" id="btnSell">SELL<span style="font-size:10px" id="sellCost">$20</span></div>
            </div>
        </div>

        <div class="bottom-info-bar" id="bottomBar">
            <div class="stats-group">
                <div style="color:#0f0">$<span id="moneyDisplay" class="stat-val">250</span></div>
                <div style="color:#fa0">PTS<span id="scoreDisplay" class="stat-val">0</span> <span style="font-size:10px; color:#888;">(HI:<span id="hiScoreDisplay" style="color:#fa0;">0</span>)</span></div>
            </div>
            <div class="stats-group">
                <div style="color:#d0f">LV<span id="levelDisplay" class="stat-val">1</span></div>
                <div style="color:#fff">W<span id="waveDisplay" class="stat-val">1/20</span></div>
                <div id="miniTimer">SKIP</div>
                <button id="speedBtn" class="ctrl-btn">x1</button>
            </div>
        </div>
    </div>

    <div id="modal">
        <h1 style="color:#0f0; text-shadow:0 0 20px #0f0; margin-bottom:10px; font-size:32px; letter-spacing:4px; text-align:center;">NEON DEFENSE</h1>
        
        <div class="diff-container">
            <button class="diff-btn selected" onclick="selectDiff('EASY', this)">
                <div class="diff-row-main"><span>EASY</span> <span class="diff-sub">(100% KEEP)</span></div>
                <div class="diff-record" id="rec-EASY">BEST: LV.1 / 0 PTS</div>
            </button>
            <button class="diff-btn" onclick="selectDiff('NORMAL', this)">
                <div class="diff-row-main"><span>NORMAL</span> <span class="diff-sub">(50% KEEP)</span></div>
                <div class="diff-record" id="rec-NORMAL">BEST: LV.1 / 0 PTS</div>
            </button>
            <button class="diff-btn" onclick="selectDiff('HARD', this)">
                <div class="diff-row-main"><span>HARD</span> <span class="diff-sub">(25% KEEP)</span></div>
                <div class="diff-record" id="rec-HARD">BEST: LV.1 / 0 PTS</div>
            </button>
            <button class="diff-btn" onclick="selectDiff('HELL', this)">
                <div class="diff-row-main"><span>HELL</span> <span class="diff-sub">(0% KEEP)</span></div>
                <div class="diff-record" id="rec-HELL">BEST: LV.1 / 0 PTS</div>
            </button>
        </div>

        <div id="gameSummary" style="display:none; margin-bottom:15px; text-align:center; font-family:monospace; padding:8px 12px; border:1px solid #333; background:rgba(20,20,20,0.8); border-radius:4px; width:280px; box-sizing:border-box;"></div>

        <div class="options">
            <div class="opt-row"><input type="checkbox" id="offsetToggle"><label for="offsetToggle">OFFSET DRAG (防遮擋)</label></div>
            <div class="opt-row"><input type="checkbox" id="particleToggle" checked><label for="particleToggle">PARTICLE FX (特效)</label></div>
        </div>

        <button id="startBtn">INITIALIZE</button>
    </div>

<script>
/**
 * NEON GEO DEFENSE: TITANIUM V10 FX
 * Updates:
 * 1. Halo Effect for Missile Hits.
 * 2. Distortion/Ripple Effect for Explosions.
 * 3. Start Portal.
 * Core: Stable V9 Logic.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const DIFFICULTY = {
    EASY:   { name:'EASY',   money:400, hp:50, keep:1.00 },
    NORMAL: { name:'NORMAL', money:300, hp:30, keep:0.50 },
    HARD:   { name:'HARD',   money:200, hp:20, keep:0.25 },
    HELL:   { name:'HELL',   money:150, hp:1,  keep:0.00 }
};
let currentDiff = 'EASY';
let useDragOffset = false;
let particlesEnabled = true;

const STORAGE_KEY = 'neon_defense_records';
function getRecords() {
    try {
        const data = localStorage.getItem(STORAGE_KEY);
        if (data) {
            const parsed = JSON.parse(data);
            return {
                EASY:   { score: parsed.EASY?.score || 0,   level: parsed.EASY?.level || 1 },
                NORMAL: { score: parsed.NORMAL?.score || 0, level: parsed.NORMAL?.level || 1 },
                HARD:   { score: parsed.HARD?.score || 0,   level: parsed.HARD?.level || 1 },
                HELL:   { score: parsed.HELL?.score || 0,   level: parsed.HELL?.level || 1 }
            };
        }
    } catch(e) {}
    return {
        EASY:   { score: 0, level: 1 },
        NORMAL: { score: 0, level: 1 },
        HARD:   { score: 0, level: 1 },
        HELL:   { score: 0, level: 1 }
    };
}
let records = getRecords();

function checkAndUpdateRecord() {
    if (!records[currentDiff]) records[currentDiff] = { score: 0, level: 1 };
    let isNew = false;
    const currentIntScore = Math.floor(score);
    if (currentIntScore > records[currentDiff].score) {
        records[currentDiff].score = currentIntScore;
        isNew = true;
    }
    if (level > records[currentDiff].level) {
        records[currentDiff].level = level;
        isNew = true;
    }
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    } catch(e) {}
    return { isNew, record: records[currentDiff] };
}

function updateRecordsUI() {
    records = getRecords();
    ['EASY', 'NORMAL', 'HARD', 'HELL'].forEach(diff => {
        const el = document.getElementById(`rec-${diff}`);
        if (el && records[diff]) {
            el.innerText = `BEST: LV.${records[diff].level} / ${records[diff].score} PTS`;
        }
    });
    const hiEl = document.getElementById('hiScoreDisplay');
    if (hiEl) {
        const curBest = records[currentDiff] ? Math.max(records[currentDiff].score, Math.floor(score)) : Math.floor(score);
        hiEl.innerText = curBest;
    }
}


let audioCtx = null;
let noiseBuffer = null;
let width = window.innerWidth || 360;
let height = window.innerHeight || 640;
let gameActive = false, isPaused = false;
let lastTime = 0, gameSpeed = 1, frameCount = 0;
let money = 0, lives = 0, score = 0, level = 1, waveCurrent = 0;
const WAVES_PER_LEVEL = 20;

let towers = [];
let enemies = [];
let projectiles = [];
let particles = [];
let shockwaves = []; // New visual array
let halos = []; // New visual array
let floatText = [];
let pathPoints = [], drawPathCommands = []; 

// --- PERFORMANCE CACHES ---
const bgCanvas = document.createElement('canvas');
const bgCtx = bgCanvas.getContext('2d');
const glowTextureCache = {};

function getGlowTexture(color, radius) {
    const key = color + '_' + radius;
    if (glowTextureCache[key]) return glowTextureCache[key];
    const size = Math.ceil(radius * 4);
    const c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    const gctx = c.getContext('2d');
    const center = size / 2;
    
    const grad = gctx.createRadialGradient(center, center, 0, center, center, center);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.2, color);
    grad.addColorStop(0.65, color);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    
    gctx.fillStyle = grad;
    gctx.beginPath();
    gctx.arc(center, center, center, 0, Math.PI * 2);
    gctx.fill();
    
    glowTextureCache[key] = c;
    return c;
} 

let waveState = { active: false, countingDown: false, timer: 0, spawnCount: 0, spawnMax: 0, spawnTimer: 0 };
let safeZone = { top: 60, bottom: height - 120, left: 20, right: width - 20 };

// --- AUDIO ---
function initAudio() {
    try {
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if(audioCtx.state === 'suspended') audioCtx.resume();
    } catch(e) {}
}

function createNoiseBuffer() {
    if(!audioCtx) return;
    const b = audioCtx.createBuffer(1, audioCtx.sampleRate*2, audioCtx.sampleRate);
    const d = b.getChannelData(0); for(let i=0; i<b.length; i++) d[i] = Math.random()*2-1;
    noiseBuffer = b;
}

const sfx = {
    play: (type) => {
        if(!audioCtx || audioCtx.state === 'suspended') return;
        try {
            const t = audioCtx.currentTime;
            const g = audioCtx.createGain(); g.connect(audioCtx.destination);
            if(type==='boom'){
                if(!noiseBuffer) createNoiseBuffer();
                const src = audioCtx.createBufferSource(); src.buffer = noiseBuffer;
                const f = audioCtx.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(800, t); f.frequency.exponentialRampToValueAtTime(50, t+0.5);
                g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.01, t+0.5);
                src.connect(f); f.connect(g); src.start(); src.stop(t+0.5);
            } else if (type==='laser') {
                const o = audioCtx.createOscillator(); o.type='sawtooth'; 
                o.frequency.setValueAtTime(800, t); o.frequency.exponentialRampToValueAtTime(100, t+0.3);
                g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.01, t+0.3);
                o.connect(g); o.start(); o.stop(t+0.3);
            } else {
                const o = audioCtx.createOscillator(); o.type='triangle'; 
                o.frequency.setValueAtTime(600, t); o.frequency.exponentialRampToValueAtTime(100, t+0.15);
                g.gain.setValueAtTime(0.05, t); g.gain.linearRampToValueAtTime(0, t+0.15);
                o.connect(g); o.start(); o.stop(t+0.2);
            }
        } catch(e){}
    }
};

// --- INIT ---
const TOWER_TYPES = {
    blaster: { name: 'Blaster', cost: 15, range: 90, damage: 10, cooldown: 15, color: '#0f0', type: 'bullet' },
    sniper: { name: 'Sniper', cost: 40, range: 150, damage: 60, cooldown: 90, color: '#f00', type: 'laser' },
    missile: { name: 'Missile', cost: 70, range: 140, damage: 40, cooldown: 70, color: '#fa0', type: 'missile', splash: 60 },
    slower: { name: 'Field', cost: 50, range: 80, damage: 0.3, cooldown: 0, color: '#0cf', type: 'aoe' },
    energy: { name: 'Collector', cost: 100, range: 110, damage: 0, cooldown: 0, color: '#a0f', type: 'collector' }
};

const RAINBOW_COLORS = ['#ff0055', '#ff7700', '#ffea00', '#00ff66', '#00e5ff', '#b84dff'];

function drawTowerBase(c, color, level, isCollector) {
    c.save();
    const hexAlpha = 0.12 + level * 0.04;
    c.beginPath();
    for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2 + Math.PI / 6;
        const r = 33;
        const bx = Math.cos(a) * r;
        const by = Math.sin(a) * r;
        if (i === 0) c.moveTo(bx, by); else c.lineTo(bx, by);
    }
    c.closePath();
    c.fillStyle = isCollector ? `rgba(184, 77, 255, ${hexAlpha})` : color;
    if (!isCollector) {
        c.globalAlpha = hexAlpha;
        c.fill();
        c.globalAlpha = 0.45 + level * 0.04;
    } else {
        c.fill();
        c.globalAlpha = 0.55 + level * 0.05;
    }
    c.strokeStyle = isCollector ? '#b84dff' : color;
    c.lineWidth = level >= 6 ? 1.8 : 1.3;
    c.stroke();
    c.globalAlpha = 1;

    if (level >= 2) {
        c.strokeStyle = isCollector ? '#00e5ff' : color;
        c.globalAlpha = 0.7;
        c.lineWidth = 1.2;
        c.beginPath(); c.arc(0, 0, 22, 0, Math.PI * 2); c.stroke();
    }
    if (level >= 4) {
        c.strokeStyle = isCollector ? '#ffea00' : color;
        c.globalAlpha = 0.8;
        c.setLineDash([4, 3]);
        c.beginPath(); c.arc(0, 0, 28, 0, Math.PI * 2); c.stroke();
        c.setLineDash([]);
    }
    if (level >= 6) {
        c.strokeStyle = isCollector ? '#ff0088' : color;
        c.globalAlpha = 0.9;
        c.lineWidth = 2.2;
        c.beginPath(); c.arc(0, 0, 32.8, 0, Math.PI * 2); c.stroke();
    }
    c.restore();
}

function drawTowerTurret(c, typeKey, level, color, animTick, isLocked) {
    const col = isLocked ? '#ffffff' : color;
    c.save();
    c.strokeStyle = col;
    c.fillStyle = col;
    c.shadowColor = col;
    c.shadowBlur = 6 + level * 2;
    c.lineWidth = level >= 5 ? 2.2 : 1.8;

    if (typeKey === 'blaster') {
        const rOuter = level >= 5 ? 16 : 15;
        const rInner = level >= 5 ? 9 : 8;
        const rCore = level >= 6 ? 4 : 3;
        c.fillStyle = 'rgba(8, 12, 16, 0.85)';
        c.beginPath(); c.arc(0, 0, rOuter, 0, Math.PI * 2); c.fill(); c.stroke();
        c.beginPath(); c.arc(0, 0, rInner, 0, Math.PI * 2); c.stroke();
        c.fillStyle = col;
        c.beginPath(); c.arc(0, 0, rCore, 0, Math.PI * 2); c.fill();

        if (level === 1) {
            c.strokeRect(12, -5, 16, 10);
        } else if (level === 2) {
            c.beginPath();
            c.moveTo(12, -5); c.lineTo(30, -5); c.lineTo(32, -7);
            c.lineTo(32, 7); c.lineTo(30, 5); c.lineTo(12, 5);
            c.stroke();
            c.beginPath();
            c.moveTo(-8, -10); c.lineTo(-14, -10);
            c.moveTo(-8, 10); c.lineTo(-14, 10);
            c.stroke();
        } else if (level === 3) {
            c.strokeRect(10, -7, 21, 4);
            c.strokeRect(10, 3, 21, 4);
            c.beginPath();
            c.moveTo(6, -12); c.lineTo(18, -15);
            c.moveTo(6, 12); c.lineTo(18, 15);
            c.stroke();
        } else if (level === 4) {
            c.strokeRect(10, -8, 24, 5);
            c.strokeRect(10, 3, 24, 5);
            c.beginPath(); c.moveTo(10, -13); c.lineTo(10, 13); c.stroke();
            c.beginPath();
            c.moveTo(0, -15); c.lineTo(15, -18); c.lineTo(21, -14);
            c.moveTo(0, 15); c.lineTo(15, 18); c.lineTo(21, 14);
            c.stroke();
        } else if (level === 5) {
            c.strokeRect(10, -9, 21, 3.5);
            c.strokeRect(12, -2, 25, 4);
            c.strokeRect(10, 5.5, 21, 3.5);
            c.beginPath(); c.moveTo(25, -11); c.lineTo(25, 11); c.stroke();
            c.beginPath();
            c.moveTo(-5, -16); c.lineTo(11, -20); c.lineTo(23, -17);
            c.moveTo(-5, 16); c.lineTo(11, 20); c.lineTo(23, 17);
            c.stroke();
        } else {
            c.strokeRect(10, -11, 25, 3.5);
            c.strokeRect(12, -5.5, 27, 3.5);
            c.strokeRect(12, 2, 27, 3.5);
            c.strokeRect(10, 7.5, 25, 3.5);
            c.beginPath();
            c.moveTo(23, -13); c.lineTo(23, 13);
            c.moveTo(33, -13); c.lineTo(33, 13);
            c.stroke();
            c.beginPath();
            c.moveTo(-15, -10); c.lineTo(-22, -12); c.lineTo(-22, -6); c.lineTo(-15, -6);
            c.moveTo(-15, 6); c.lineTo(-22, 6); c.lineTo(-22, 12); c.lineTo(-15, 10);
            c.moveTo(-8, -16); c.lineTo(11, -22); c.lineTo(25, -18); c.lineTo(18, -12);
            c.moveTo(-8, 16); c.lineTo(11, 22); c.lineTo(25, 18); c.lineTo(18, 12);
            c.stroke();
        }
    } else if (typeKey === 'sniper') {
        const rw = 14 + Math.min(3, Math.floor((level - 1) / 2));
        const rh = 14 + Math.min(6, (level - 1) * 2);
        c.fillStyle = 'rgba(10, 8, 14, 0.9)';
        c.fillRect(-14 - Math.floor((level - 1) / 2), -rh / 2, rw, rh);
        c.strokeRect(-14 - Math.floor((level - 1) / 2), -rh / 2, rw, rh);
        if (level === 1) {
            c.beginPath();
            c.moveTo(0, -4); c.lineTo(30, -4);
            c.moveTo(0, 4); c.lineTo(30, 4);
            c.moveTo(16, -7); c.lineTo(16, 7);
            c.moveTo(25, -7); c.lineTo(25, 7);
            c.moveTo(-8, -12); c.lineTo(-8, 12);
            c.stroke();
        } else if (level === 2) {
            c.beginPath();
            c.moveTo(0, -4); c.lineTo(33, -4);
            c.moveTo(0, 4); c.lineTo(33, 4);
            c.moveTo(16, -7); c.lineTo(16, 7);
            c.moveTo(28, -7); c.lineTo(28, 7);
            c.moveTo(-8, -12); c.lineTo(-8, 12);
            c.stroke();
            c.strokeRect(-12, -13, 16, 4);
            c.beginPath(); c.moveTo(4, -11); c.lineTo(7, -11); c.stroke();
        } else if (level === 3) {
            c.beginPath();
            c.moveTo(0, -4); c.lineTo(36, -4);
            c.moveTo(0, 4); c.lineTo(36, 4);
            c.moveTo(-8, -13); c.lineTo(-8, 13);
            c.moveTo(-12, -4); c.lineTo(-16, -8);
            c.moveTo(-12, 4); c.lineTo(-16, 8);
            c.stroke();
            [7, 17, 27].forEach(cx => c.strokeRect(cx, -8, 4, 16));
        } else if (level === 4) {
            c.beginPath();
            c.moveTo(0, -4); c.lineTo(38, -4);
            c.moveTo(0, 4); c.lineTo(38, 4);
            c.moveTo(38, -7); c.lineTo(43, -7); c.lineTo(43, -3);
            c.moveTo(38, 7); c.lineTo(43, 7); c.lineTo(43, 3);
            c.moveTo(-2, -7); c.lineTo(6, -18);
            c.moveTo(-2, 7); c.lineTo(6, 18);
            c.stroke();
            [9, 20, 31].forEach(cx => c.strokeRect(cx, -8, 4, 16));
            c.strokeRect(-13, -15, 18, 5);
        } else if (level === 5) {
            c.beginPath();
            c.moveTo(0, -6); c.lineTo(41, -6);
            c.moveTo(0, -2.5); c.lineTo(41, -2.5);
            c.moveTo(0, 2.5); c.lineTo(41, 2.5);
            c.moveTo(0, 6); c.lineTo(41, 6);
            c.stroke();
            [7, 16, 25, 34].forEach(cx => c.strokeRect(cx, -10, 4, 20));
            c.strokeRect(-24, -7, 8, 4);
            c.strokeRect(-24, 3, 8, 4);
        } else {
            c.beginPath();
            c.moveTo(0, -6); c.lineTo(44, -6);
            c.moveTo(0, -2.5); c.lineTo(44, -2.5);
            c.moveTo(0, 2.5); c.lineTo(44, 2.5);
            c.moveTo(0, 6); c.lineTo(44, 6);
            c.moveTo(44, -8); c.lineTo(50, -10); c.lineTo(50, -4);
            c.moveTo(44, 8); c.lineTo(50, 10); c.lineTo(50, 4);
            c.moveTo(-17, -11); c.lineTo(-30, -20); c.lineTo(-28, -9);
            c.moveTo(-17, 11); c.lineTo(-30, 20); c.lineTo(-28, 9);
            c.stroke();
            [7, 16, 25, 34].forEach(cx => c.strokeRect(cx, -11, 4, 22));
            c.strokeRect(-16, -17, 20, 5);
        }
    } else if (typeKey === 'missile') {
        const dSize = 19 + level;
        c.fillStyle = 'rgba(15, 10, 5, 0.9)';
        c.beginPath();
        c.moveTo(dSize, 0); c.lineTo(0, dSize); c.lineTo(-dSize, 0); c.lineTo(0, -dSize);
        c.closePath(); c.fill(); c.stroke();
        if (level <= 2) {
            c.beginPath(); c.moveTo(10, 0); c.lineTo(0, 10); c.lineTo(-10, 0); c.lineTo(0, -10); c.closePath(); c.stroke();
        } else if (level === 3 || level === 6) {
            c.beginPath(); c.arc(0, 0, level === 6 ? 6 : 5, 0, Math.PI * 2); c.stroke();
        } else if (level === 5) {
            c.beginPath(); c.moveTo(11, 0); c.lineTo(0, 11); c.lineTo(-11, 0); c.lineTo(0, -11); c.closePath(); c.stroke();
        }

        if (level === 1) {
            c.beginPath();
            c.moveTo(6, -8); c.lineTo(26, -8);
            c.moveTo(6, 8); c.lineTo(26, 8);
            c.moveTo(-12, -12); c.lineTo(-22, -16);
            c.moveTo(-12, 12); c.lineTo(-22, 16);
            c.stroke();
        } else if (level === 2) {
            c.beginPath();
            c.moveTo(6, -10); c.lineTo(28, -10); c.lineTo(31, -8); c.lineTo(28, -6); c.lineTo(6, -6); c.closePath();
            c.moveTo(6, 6); c.lineTo(28, 6); c.lineTo(31, 8); c.lineTo(28, 10); c.lineTo(6, 10); c.closePath();
            c.moveTo(0, -22); c.lineTo(8, -22);
            c.moveTo(0, 22); c.lineTo(8, 22);
            c.moveTo(-12, -12); c.lineTo(-24, -17);
            c.moveTo(-12, 12); c.lineTo(-24, 17);
            c.stroke();
        } else if (level === 3) {
            c.beginPath();
            [-13, -7, 7, 13].forEach((ty, idx) => {
                const x1 = idx === 1 || idx === 2 ? 8 : 6;
                const x2 = idx === 1 || idx === 2 ? 32 : 29;
                c.moveTo(x1, ty); c.lineTo(x2, ty);
            });
            c.moveTo(-13, -13); c.lineTo(-25, -19);
            c.moveTo(-13, 13); c.lineTo(-25, 19);
            c.moveTo(-17, -5); c.lineTo(-29, -5);
            c.moveTo(-17, 5); c.lineTo(-29, 5);
            c.stroke();
        } else if (level === 4) {
            c.beginPath();
            [[-13, 6, 30], [-7, 9, 33], [4, 9, 33], [10, 6, 30]].forEach(([ty, x1, x2]) => {
                c.moveTo(x1, ty); c.lineTo(x2, ty); c.lineTo(x2 + 3, ty + 1.5); c.lineTo(x2, ty + 3); c.lineTo(x1, ty + 3); c.closePath();
            });
            c.moveTo(-6, -6); c.arc(-6, 0, 6, -Math.PI * 0.4, Math.PI * 0.4);
            c.moveTo(-6, 0); c.lineTo(-1, 0);
            c.moveTo(-14, -14); c.lineTo(-27, -21); c.lineTo(-21, -10);
            c.moveTo(-14, 14); c.lineTo(-27, 21); c.lineTo(-21, 10);
            c.stroke();
        } else if (level === 5) {
            c.beginPath();
            [-15, -10, -5, 5, 10, 15].forEach((ty, idx) => {
                const x1 = 4 + (idx === 2 || idx === 3 ? 6 : (idx === 1 || idx === 4 ? 3 : 0));
                const x2 = 30 + (idx === 2 || idx === 3 ? 8 : (idx === 1 || idx === 4 ? 4 : 0));
                c.moveTo(x1, ty); c.lineTo(x2, ty);
            });
            c.moveTo(-15, -15); c.lineTo(-27, -22);
            c.moveTo(-19, 0); c.lineTo(-31, 0);
            c.moveTo(-15, 15); c.lineTo(-27, 22);
            c.stroke();
        } else {
            c.beginPath();
            [-17, -12, -7, -2, 2, 7, 12, 17].forEach((ty, idx) => {
                const off = idx <= 3 ? idx * 3 : (7 - idx) * 3;
                c.moveTo(3 + off, ty); c.lineTo(32 + off, ty);
            });
            c.moveTo(-15, -16); c.lineTo(-29, -24); c.lineTo(-21, -8);
            c.moveTo(-15, 16); c.lineTo(-29, 24); c.lineTo(-21, 8);
            c.moveTo(-21, -2); c.lineTo(-35, -2);
            c.moveTo(-21, 2); c.lineTo(-35, 2);
            c.stroke();
        }
    } else if (typeKey === 'slower') {
        if (level === 1) {
            c.fillStyle = '#031620';
            c.beginPath(); c.arc(0, 0, 6, 0, Math.PI * 2); c.fill(); c.stroke();
            c.beginPath(); c.ellipse(0, 0, 10, 7, 0, 0, Math.PI * 2); c.stroke();
            c.beginPath();
            c.moveTo(0, -7); c.lineTo(15, -7); c.lineTo(20, -3);
            c.moveTo(0, 7); c.lineTo(15, 7); c.lineTo(20, 3);
            c.stroke();
            c.fillStyle = '#fff';
            c.beginPath(); c.arc(20, -3, 1.5, 0, Math.PI * 2); c.arc(20, 3, 1.5, 0, Math.PI * 2); c.fill();
        } else if (level === 2) {
            c.beginPath(); c.ellipse(0, -4, 9, 5, 0, 0, Math.PI * 2); c.stroke();
            c.beginPath(); c.ellipse(0, 4, 12, 6, 0, 0, Math.PI * 2); c.stroke();
            c.beginPath();
            c.moveTo(0, -6); c.lineTo(16, -9); c.lineTo(21, -6);
            c.moveTo(0, 0); c.lineTo(20, 0);
            c.moveTo(0, 6); c.lineTo(16, 9); c.lineTo(21, 6);
            c.stroke();
        } else if (level === 3) {
            c.beginPath(); c.arc(0, 0, 6, 0, Math.PI * 2); c.stroke();
            c.beginPath(); c.arc(0, 0, 14, 0, Math.PI * 2); c.stroke();
            c.beginPath();
            c.moveTo(10, 0); c.lineTo(23, 0); c.lineTo(23, 4);
            c.moveTo(0, 10); c.lineTo(0, 23); c.lineTo(-4, 23);
            c.moveTo(-10, 0); c.lineTo(-23, 0); c.lineTo(-23, -4);
            c.moveTo(0, -10); c.lineTo(0, -23); c.lineTo(4, -23);
            c.stroke();
        } else if (level === 4) {
            c.beginPath();
            for (let i = 0; i < 6; i++) {
                const a = (i / 6) * Math.PI * 2;
                const px = Math.cos(a) * 8, py = Math.sin(a) * 8;
                if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
            }
            c.closePath(); c.stroke();
            c.beginPath();
            c.moveTo(8, 0); c.lineTo(25, 0);
            c.moveTo(-8, 0); c.lineTo(-25, 0);
            c.moveTo(0, 8); c.lineTo(0, 25);
            c.moveTo(0, -8); c.lineTo(0, -25);
            c.stroke();
        } else if (level === 5) {
            c.fillStyle = '#031a26';
            c.fillRect(-4, -6, 8, 12);
            c.strokeRect(-4, -6, 8, 12);
            c.fillStyle = col;
            [[19, 0], [-19, 0], [9, 15], [-9, 15], [9, -15], [-9, -15]].forEach(([nx, ny]) => {
                c.beginPath(); c.arc(nx, ny, 2.8, 0, Math.PI * 2); c.fill();
            });
        } else {
            c.beginPath();
            for (let i = 0; i < 8; i++) {
                const a = (i / 8) * Math.PI * 2;
                const px = Math.cos(a) * 20, py = Math.sin(a) * 20;
                if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
            }
            c.closePath(); c.stroke();
            c.fillStyle = '#021420';
            c.strokeStyle = '#fff';
            c.beginPath(); c.arc(0, 0, 7, 0, Math.PI * 2); c.fill(); c.stroke();
        }
        c.fillStyle = '#fff';
        c.beginPath(); c.arc(0, 0, level >= 4 ? 3.5 : 3, 0, Math.PI * 2); c.fill();
    } else if (typeKey === 'energy') {
        const spinSpeed = 0.014 + level * 0.004;
        c.save();
        c.rotate(animTick * spinSpeed);

        if (level === 1) {
            c.strokeStyle = '#b84dff';
            c.setLineDash([3, 2]);
            c.beginPath(); c.arc(0, 0, 20, 0, Math.PI * 2); c.stroke();
            c.setLineDash([]);
        } else if (level === 2) {
            c.strokeStyle = '#ffdd00';
            c.setLineDash([5, 2]);
            c.beginPath(); c.arc(0, 0, 16, 0, Math.PI * 2); c.stroke();
            c.setLineDash([]);
            c.strokeStyle = '#00e5ff';
            c.beginPath(); c.arc(0, 0, 21, 0, Math.PI * 2); c.stroke();
        } else if (level === 4) {
            const pylons = [[20, 0, 27, 0, '#ff0055'], [-20, 0, -27, 0, '#00ff66'], [0, 20, 0, 27, '#ffea00'], [0, -20, 0, -27, '#00e5ff']];
            pylons.forEach(([x1, y1, x2, y2, pc]) => {
                c.strokeStyle = pc; c.lineWidth = 2.8;
                c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
            });
            c.lineWidth = 2;
        } else if (level >= 6) {
            c.strokeStyle = '#00e5ff';
            c.beginPath();
            for (let i = 0; i < 6; i++) {
                const a = (i / 6) * Math.PI * 2;
                const px = Math.cos(a) * 24, py = Math.sin(a) * 24;
                if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
            }
            c.closePath(); c.stroke();
        }

        // Core
        c.fillStyle = '#000';
        c.strokeStyle = '#fff';
        c.lineWidth = 1.5;
        c.beginPath(); c.arc(0, 0, 6, 0, Math.PI * 2); c.fill(); c.stroke();
        c.fillStyle = level === 2 ? '#ffea00' : '#00ffcc';
        c.beginPath(); c.arc(0, 0, 3, 0, Math.PI * 2); c.fill();

        // Rainbow Spiral Arms
        const armCount = level <= 2 ? 3 : (level <= 4 ? 4 : 6);
        const armColors = armCount === 3
            ? ['#ff0055', '#00ff66', '#00e5ff']
            : (armCount === 4 ? ['#ff0055', '#ffee00', '#00ff66', '#00e5ff'] : RAINBOW_COLORS);

        for (let i = 0; i < armCount; i++) {
            c.save();
            c.rotate((i / armCount) * Math.PI * 2);
            c.strokeStyle = armColors[i % armColors.length];
            c.shadowColor = armColors[i % armColors.length];
            c.lineWidth = 2.2 + level * 0.1;
            c.lineCap = 'round';
            c.beginPath();
            c.moveTo(7, 0);
            c.quadraticCurveTo(16, 15, 3, 18);
            c.stroke();
            if (level <= 2) {
                c.fillStyle = armColors[i % armColors.length];
                c.beginPath(); c.arc(3, 18, 1.6, 0, Math.PI * 2); c.fill();
            }
            c.restore();
        }
        c.restore();

        // Counter-spinning orbiting satellites (L3, L5, L6)
        const satCount = level === 3 ? 2 : (level === 5 ? 3 : (level >= 6 ? 4 : 0));
        if (satCount > 0) {
            c.save();
            c.rotate(-animTick * 0.015);
            for (let i = 0; i < satCount; i++) {
                const a = (i / satCount) * Math.PI * 2;
                const sx = Math.cos(a) * 23;
                const sy = Math.sin(a) * 23;
                c.fillStyle = RAINBOW_COLORS[(i * 2) % RAINBOW_COLORS.length];
                c.strokeStyle = '#fff';
                c.lineWidth = 0.8;
                c.beginPath(); c.arc(sx, sy, 3.2, 0, Math.PI * 2); c.fill(); c.stroke();
            }
            c.restore();
        }
    }
    c.restore();
}

function drawTowerVisual(c, typeKey, level, color, animTick, isLocked, scale) {
    c.save();
    c.scale(scale, scale);
    drawTowerBase(c, color, level, typeKey === 'energy');
    drawTowerTurret(c, typeKey, level, color, animTick, isLocked);
    c.restore();
}

function renderTowerPreviews() {
    document.querySelectorAll('.tower-canvas').forEach(canvas => {
        const typeKey = canvas.dataset.type;
        const info = TOWER_TYPES[typeKey];
        const pctx = canvas.getContext('2d');
        pctx.clearRect(0, 0, canvas.width, canvas.height);
        pctx.save();
        pctx.translate(canvas.width / 2, canvas.height / 2);
        drawTowerVisual(pctx, typeKey, 1, info.color, 0, false, 0.44);
        pctx.restore();
    });
}

function init() {
    window.selectDiff = (diff, btn) => {
        currentDiff = diff;
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
        if (btn) {
            btn.classList.add('selected');
        } else if (typeof event !== 'undefined' && event && event.target) {
            const b = event.target.closest('.diff-btn');
            if (b) b.classList.add('selected');
        }
        updateRecordsUI();
    };
    resize();
    renderTowerPreviews();
    updateRecordsUI();
    if(pathPoints.length < 2) generatePath();
    requestAnimationFrame(loop);
}

function startGameSession() {
    initAudio();
    resize();
    useDragOffset = document.getElementById('offsetToggle').checked;
    particlesEnabled = document.getElementById('particleToggle').checked;
    const diffData = DIFFICULTY[currentDiff];
    
    gameActive = true; isPaused = false;
    money = diffData.money; lives = diffData.hp; score = 0; 
    level = 1; waveCurrent = 0;
    waveState = { active: false, countingDown: false, timer: 0, spawnCount: 0, spawnMax: 0, spawnTimer: 0 };
    
    while (particles.length > 0) {
        const p = particles.pop();
        p.active = false;
        particlePool.push(p);
    }
    towers = []; enemies = []; projectiles = []; shockwaves = []; halos = []; floatText = [];
    toggleBottomPanel(false);
    updateRecordsUI();
    
    if(pathPoints.length < 2) generatePath();
    
    initNextWave();
    lastTime = performance.now();
}

function resize() {
    width = canvas.width = window.innerWidth || 360;
    height = canvas.height = window.innerHeight || 640;
    
    const topBar = document.getElementById('topBar');
    const bottomBar = document.getElementById('bottomBar');
    const topH = (topBar && topBar.offsetHeight) ? topBar.offsetHeight : 100;
    const botH = (bottomBar && bottomBar.offsetHeight) ? bottomBar.offsetHeight : 50;
    
    safeZone.top = topH + 20;
    safeZone.bottom = height - botH - 20;
    safeZone.left = 20;
    safeZone.right = width - 20;

    if (safeZone.bottom <= safeZone.top + 50) { safeZone.top = 120; safeZone.bottom = height - 70; }
    if (pathPoints.length < 2) generatePath();
    else updateBackgroundCache();
    if (typeof selectedTower !== 'undefined' && selectedTower && typeof upgradePanel !== 'undefined' && upgradePanel.classList.contains('active')) {
        positionUpgradePopup(selectedTower);
    }
}
window.addEventListener('resize', resize);

// --- PATH GENERATION ---
const MAP_CONSTRUCTION_RATIOS = [
    { straight: 1.0, curve: 0.0 },
    { straight: 0.8, curve: 0.2 },
    { straight: 0.5, curve: 0.5 },
    { straight: 0.2, curve: 0.8 },
    { straight: 0.0, curve: 1.0 }
];
let currentMapRatio = MAP_CONSTRUCTION_RATIOS[2];

function generatePath() {
    pathPoints = []; drawPathCommands = [];
    const w = safeZone.right - safeZone.left;
    const h = safeZone.bottom - safeZone.top;
    
    if (w <= 0 || h <= 0) {
        pathPoints = [{x:0, y:0}, {x:width, y:height}];
        drawPathCommands = [{type:'move',x:0,y:0}, {type:'line',x:width,y:height}];
        return;
    }

    currentMapRatio = MAP_CONSTRUCTION_RATIOS[Math.floor(Math.random() * MAP_CONSTRUCTION_RATIOS.length)];

    const edge = Math.floor(Math.random() * 4);
    let start = {x:0, y:0};
    switch(edge) {
        case 0: start = {x: safeZone.left + Math.random()*w, y: safeZone.top}; break;
        case 1: start = {x: safeZone.right, y: safeZone.top + Math.random()*h}; break;
        case 2: start = {x: safeZone.left + Math.random()*w, y: safeZone.bottom}; break;
        case 3: start = {x: safeZone.left, y: safeZone.top + Math.random()*h}; break;
    }

    const points = [start];
    const wpCount = 6 + Math.floor(Math.random() * 3);
    for(let i=0; i<wpCount; i++) points.push({ x: safeZone.left + Math.random() * w, y: safeZone.top + Math.random() * h });

    let p0 = points[0];
    pathPoints.push(p0);
    drawPathCommands.push({type:'move', x:p0.x, y:p0.y});

    const segCount = points.length - 1;
    const curveCount = Math.round(segCount * currentMapRatio.curve);
    const isCurveSeg = [];
    for (let i = 0; i < segCount; i++) isCurveSeg.push(i < curveCount);
    for (let i = segCount - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = isCurveSeg[i];
        isCurveSeg[i] = isCurveSeg[j];
        isCurveSeg[j] = tmp;
    }

    for (let i = 0; i < segCount; i++) {
        const startPt = pathPoints[pathPoints.length - 1];
        const endPt = points[i + 1];
        const dist = Math.hypot(endPt.x - startPt.x, endPt.y - startPt.y);

        if (!isCurveSeg[i] || dist < 10) {
            addSegment(startPt, endPt);
            drawPathCommands.push({type:'line', x:endPt.x, y:endPt.y});
        } else {
            const mx = (startPt.x + endPt.x) * 0.5;
            const my = (startPt.y + endPt.y) * 0.5;
            const nx = -(endPt.y - startPt.y) / dist;
            const ny = (endPt.x - startPt.x) / dist;
            const dir = Math.random() < 0.5 ? 1 : -1;
            const bulge = dist * (0.28 + Math.random() * 0.22);
            const cpx = Math.max(safeZone.left, Math.min(safeZone.right, mx + nx * bulge * dir));
            const cpy = Math.max(safeZone.top, Math.min(safeZone.bottom, my + ny * bulge * dir));

            const steps = Math.max(10, Math.ceil(dist / 5));
            for (let k = 1; k <= steps; k++) {
                const tt = k / steps;
                const inv = 1 - tt;
                const qx = inv * inv * startPt.x + 2 * inv * tt * cpx + tt * tt * endPt.x;
                const qy = inv * inv * startPt.y + 2 * inv * tt * cpy + tt * tt * endPt.y;
                pathPoints.push({x: qx, y: qy});
            }
            drawPathCommands.push({type:'quad', cpx: cpx, cpy: cpy, x: endPt.x, y: endPt.y});
        }
    }
    updateBackgroundCache();
}

function addSegment(p1, p2) {
    const dist = Math.hypot(p2.x-p1.x, p2.y-p1.y);
    const steps = Math.max(1, Math.ceil(dist/5));
    for(let i=1; i<=steps; i++) {
        const t = i/steps;
        pathPoints.push({x: p1.x+(p2.x-p1.x)*t, y: p1.y+(p2.y-p1.y)*t});
    }
}

// --- MAIN LOOP ---
function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    if (dt > 0.1) dt = 0.1;

    drawBackground();
    if(pathPoints.length > 0) drawStartPortal();
    drawEndPoint();

    if (gameActive) {
        if (!isPaused) {
            update(dt);
            frameCount++;
        } else {
            ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0,0,width,height);
            ctx.fillStyle = '#fff'; ctx.font = '30px monospace'; ctx.textAlign='center';
            ctx.fillText("PAUSED", width/2, height/2);
        }
        drawEntities();
        drawUIOverlay();
    }
    requestAnimationFrame(loop);
}

function update(dt) {
    if (lives <= 0) return;
    handleWaveLogic(dt);

    towers.forEach(t => t.update(dt));
    
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if(e) {
            e.update(dt);
            if (e.dead) {
                enemies.splice(i, 1);
                if (e.finished) {
                    lives--; sfx.play('boom'); 
                    if(particlesEnabled) {
                        createExplosion(e.x, e.y, '#f00', 50);
                        createExplosion(e.x, e.y, '#fa0', 30);
                        createHalo(e.x, e.y, '#f00');
                        createShockwave(e.x, e.y, '#f00');
                        createShockwave(e.x, e.y, '#fff');
                    }
                    if (lives <= 0) gameOver();
                } else {
                    money += e.bounty; score += e.bounty * 10;
                    checkAndUpdateRecord();
                    if(particlesEnabled) {
                        createExplosion(e.x, e.y, e.color, 15);
                        createHalo(e.x, e.y, e.color); // Death Halo
                    }
                    if (Math.random() < 0.25 && towers.some(t => t.typeKey === 'energy')) spawnEnergyParticles(e.x, e.y);
                    floatText.push({x:e.x, y:e.y, text:`+${e.bounty}`, color:'#0f0', life:40});
                }
            }
        }
    }

    if (particlesEnabled) {
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update(dt);
            if (particles[i].life <= 0 || !particles[i].active) {
                const p = particles[i];
                p.active = false;
                particlePool.push(p);
                particles[i] = particles[particles.length - 1];
                particles.pop();
            }
        }
        for (let i = shockwaves.length - 1; i >= 0; i--) {
            shockwaves[i].update(dt);
            shockwaves[i].draw();
            if (shockwaves[i].life <= 0) {
                shockwaves[i] = shockwaves[shockwaves.length - 1];
                shockwaves.pop();
            }
        }
        for (let i = halos.length - 1; i >= 0; i--) {
            halos[i].update(dt);
            halos[i].draw();
            if (halos[i].life <= 0) {
                halos[i] = halos[halos.length - 1];
                halos.pop();
            }
        }
    } else {
        for (let i = particles.length - 1; i >= 0; i--) {
            if (particles[i].isEnergy) {
                particles[i].update(dt);
                if (particles[i].life <= 0 || !particles[i].active) {
                    const p = particles[i];
                    p.active = false;
                    particlePool.push(p);
                    particles[i] = particles[particles.length - 1];
                    particles.pop();
                }
            } else {
                const p = particles[i];
                p.active = false;
                particlePool.push(p);
                particles[i] = particles[particles.length - 1];
                particles.pop();
            }
        }
        if (shockwaves.length > 0) shockwaves.length = 0;
        if (halos.length > 0) halos.length = 0;
    }

    for (let i = projectiles.length - 1; i >= 0; i--) {
        projectiles[i].update(dt);
        if (projectiles[i].dead) {
            projectiles[i] = projectiles[projectiles.length - 1];
            projectiles.pop();
        }
    }
    for (let i = floatText.length - 1; i >= 0; i--) {
        floatText[i].life -= dt * 60;
        floatText[i].y -= 20 * dt;
        if (floatText[i].life <= 0) {
            floatText[i] = floatText[floatText.length - 1];
            floatText.pop();
        }
    }

    updateUI();
}

function handleWaveLogic(dt) {
    if (waveState.countingDown) {
        waveState.timer -= dt;
        const sec = Math.ceil(waveState.timer);
        const btn = document.getElementById('miniTimer');
        btn.style.display = 'block'; btn.innerText = `SKIP ${sec}s`;
        if (waveState.timer <= 0) startWaveSpawn();
    } else { document.getElementById('miniTimer').style.display = 'none'; }
    
    if (waveState.active) {
        waveState.spawnTimer -= dt * gameSpeed;
        if (waveState.spawnTimer <= 0 && waveState.spawnCount < waveState.spawnMax) {
            enemies.push(new Enemy(level, waveCurrent));
            waveState.spawnCount++;
            waveState.spawnTimer = Math.max(0.25, 1.1 - (waveCurrent * 0.03));
        }
        
        if (waveState.spawnCount >= waveState.spawnMax) {
            waveState.active = false;
            if (waveCurrent < WAVES_PER_LEVEL) initNextWave();
            else if (enemies.length === 0) startNextLevel();
        }
    } else if (waveCurrent >= WAVES_PER_LEVEL && enemies.length === 0 && !waveState.countingDown) {
        startNextLevel();
    }
}

function initNextWave() {
    waveCurrent++;
    if (waveCurrent > WAVES_PER_LEVEL) return; 
    document.getElementById('waveDisplay').innerText = `${waveCurrent}/${WAVES_PER_LEVEL}`;
    waveState.countingDown = true; waveState.timer = 5; 
}

function startNextLevel() {
    gameActive = false; level++; waveCurrent = 0;
    checkAndUpdateRecord();
    updateRecordsUI();
    
    const diffData = DIFFICULTY[currentDiff];
    money = diffData.money + Math.floor(money * diffData.keep);
    
    while (particles.length > 0) {
        const p = particles.pop();
        p.active = false;
        particlePool.push(p);
    }
    towers = []; projectiles = []; enemies = []; shockwaves = []; halos = [];
    floatText.push({x: width/2, y: height/2, text: "SECTOR CLEARED", color: "#0f0", life: 180});
    setTimeout(() => { gameActive = true; initNextWave(); }, 2000);
}

function startWaveSpawn() {
    waveState.countingDown = false; waveState.active = true;
    waveState.spawnCount = 0;
    waveState.spawnMax = 6 + Math.floor(waveCurrent * 1.6) + (level * 3);
    waveState.spawnTimer = 0;
    floatText.push({x: width/2, y: height/2, text: "WAVE START", color: "#0f0", life: 60});
}

document.getElementById('miniTimer').addEventListener('click', (e) => { e.stopPropagation(); if(waveState.countingDown) waveState.timer = 0; });

function drawLightning(ctx, x1, y1, x2, y2, color) {
    if (isNaN(x1) || isNaN(y1)) return;
    ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.shadowBlur = 5; ctx.shadowColor = color;
    ctx.beginPath(); ctx.moveTo(x1, y1);
    const dist = Math.hypot(x2-x1, y2-y1);
    const steps = Math.floor(dist/15);
    for(let i=1; i<steps; i++) {
        const t = i/steps;
        ctx.lineTo(x1+(x2-x1)*t + (Math.random()-0.5)*10, y1+(y2-y1)*t + (Math.random()-0.5)*10);
    }
    ctx.lineTo(x2, y2); ctx.stroke();
}

function drawStartPortal() {
    if(!pathPoints.length) return;
    const p = pathPoints[0];
    ctx.save(); ctx.translate(p.x, p.y); 
    ctx.rotate(frameCount*0.05);
    ctx.strokeStyle = '#0ff'; ctx.shadowColor = '#0ff'; ctx.shadowBlur = 10; ctx.lineWidth = 2;
    ctx.strokeRect(-10,-10,20,20);
    ctx.rotate(Math.PI/4); ctx.strokeRect(-8,-8,16,16);
    ctx.restore();
}

class Halo {
    constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        this.r = 5; this.life = 1.0;
    }
    update(dt) {
        this.r += 200 * dt * gameSpeed;
        this.life -= 3 * dt * gameSpeed;
    }
    draw() {
        if(this.life<=0) return;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.life * 0.5;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    }
}

class Shockwave {
    constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        this.r = 1; this.life = 1.0;
    }
    update(dt) {
        this.r += 150 * dt * gameSpeed;
        this.life -= 2 * dt * gameSpeed;
    }
    draw() {
        if(this.life<=0) return;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        
        // Multi-ring neon distortion without expensive shadowBlur
        ctx.lineWidth = 6;
        ctx.strokeStyle = this.color;
        ctx.globalAlpha = this.life * 0.35;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.stroke();

        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#fff'; // White core
        ctx.globalAlpha = this.life * 0.9;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.stroke();
        
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = this.color; // Color rim
        ctx.globalAlpha = this.life * 0.6;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 0.8, 0, Math.PI*2); ctx.stroke();
        
        ctx.restore();
    }
}

function createHalo(x, y, color) { halos.push(new Halo(x, y, color)); }
function createShockwave(x, y, color) { shockwaves.push(new Shockwave(x, y, color)); }

class Tower {
    constructor(x, y, typeKey) {
        this.x = x; this.y = y; this.typeKey = typeKey; this.info = TOWER_TYPES[typeKey];
        this.range = this.info.range; this.damage = this.info.damage;
        this.cooldownMax = this.info.cooldown / 60; this.cooldown = 0; this.level = 1; this.angle = 0;
        this.locked = false; this.affected = []; this.absorbPulse = 0;
        this.buffTimer = 0; this.energy = 0; this.maxEnergy = 100;
    }
    update(dt) {
        const rateMult = this.buffTimer > 0 ? 2.5 : 1.0;
        if (this.cooldown > 0) this.cooldown -= dt * gameSpeed * rateMult;
        if (this.buffTimer > 0) this.buffTimer = Math.max(0, this.buffTimer - dt * gameSpeed);
        if (this.absorbPulse > 0) this.absorbPulse = Math.max(0, this.absorbPulse - dt * 4 * gameSpeed);
        
        if (this.typeKey === 'energy') {
            this.affected = [];
            towers.forEach(t => {
                if (t !== this && Math.hypot(t.x - this.x, t.y - this.y) < this.range) {
                    this.affected.push(t);
                }
            });
            const step = dt * gameSpeed;
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                if (!p.isEnergy || !p.active || p.life <= 0) continue;
                const dx = this.x - p.x;
                const dy = this.y - p.y;
                const dist = Math.hypot(dx, dy);
                if (dist < this.range) {
                    p.absorbing = true;
                    p.life = Math.max(p.life, 0.35);
                    const invD = 1 / Math.max(1, dist);
                    const nx = dx * invD;
                    const ny = dy * invD;
                    const tx = -ny;
                    const ty = nx;
                    const prox = 1 - Math.min(1, dist / this.range);
                    const radialSpeed = 140 + prox * 260;
                    const swirlSpeed = 110 + prox * 160;
                    p.vx = nx * radialSpeed + tx * swirlSpeed;
                    p.vy = ny * radialSpeed + ty * swirlSpeed;
                    p.x += p.vx * step;
                    p.y += p.vy * step;
                    if (Math.hypot(this.x - p.x, this.y - p.y) < 8) {
                        p.life = 0;
                        p.active = false;
                        money += 4;
                        score += 10;
                        this.energy = Math.min(this.maxEnergy, this.energy + 15);
                        checkAndUpdateRecord();
                        this.absorbPulse = 1.0;
                        if (particlesEnabled) createExplosion(this.x, this.y, '#a0f', 3);
                    }
                }
            }
            if (this.energy > 0 && this.affected.length > 0 && enemies.length > 0) {
                for (let i = 0; i < this.affected.length; i++) {
                    this.affected[i].buffTimer = 0.15;
                }
                this.energy = Math.max(0, this.energy - 14 * dt * gameSpeed);
            }
            return;
        }

        if (this.typeKey === 'slower') {
            this.affected = [];
            enemies.forEach(e => {
                if(Math.hypot(e.x - this.x, e.y - this.y) < this.range) {
                    e.speedMult = 0.5 - (this.level * 0.05); 
                    e.takeDamage(this.damage * 60 * dt * gameSpeed);
                    this.affected.push(e);
                }
            }); return;
        }

        let target = null; let minD = Infinity;
        for (let e of enemies) {
            const d = Math.hypot(e.x - this.x, e.y - this.y);
            if (d <= this.range && d < minD) { minD = d; target = e; }
        }

        if (this.typeKey === 'sniper' && this.locked) {
            if (this.cooldown <= 0 && (waveState.active || target)) {
                const lx = this.x + Math.cos(this.angle)*2000;
                const ly = this.y + Math.sin(this.angle)*2000;
                enemies.forEach(e => {
                    if(distToSegment(e.x, e.y, this.x, this.y, lx, ly) < e.radius + 5 + (this.level*2)) {
                        e.takeDamage(this.damage); if(particlesEnabled) createExplosion(e.x, e.y, this.info.color, 3);
                    }
                });
                this.laserTime = 0.1; this.laserEnd = {x: lx, y: ly}; sfx.play('laser');
                this.cooldown = this.cooldownMax;
            }
        } else {
            if (target) {
                this.angle = Math.atan2(target.y - this.y, target.x - this.x);
                if (this.cooldown <= 0) { this.fire(target); this.cooldown = this.cooldownMax; }
            }
        }
    }
    fire(target) {
        if (this.typeKey === 'sniper') {
            const lx = this.x + Math.cos(this.angle)*2000; const ly = this.y + Math.sin(this.angle)*2000;
            enemies.forEach(e => {
                if (distToSegment(e.x, e.y, this.x, this.y, lx, ly) < e.radius + 5 + (this.level*2)) {
                    e.takeDamage(this.damage); if(particlesEnabled) createExplosion(e.x, e.y, this.info.color, 5);
                }
            });
            this.laserTime = 0.2; this.laserEnd = {x: lx, y: ly}; sfx.play('laser');
        } else if (this.typeKey === 'missile') {
             let count = 1; 
             if(this.level>=3) count=2; if(this.level>=5) count=4;
             for(let i=0; i<count; i++) {
                 const spreadAngle = this.angle + (i - (count-1)/2) * 0.5;
                 projectiles.push(new Projectile(this.x, this.y, target, this.damage, this.info.color, this.typeKey, this.info.splash, this.level, spreadAngle));
             }
             sfx.play('shoot');
        } else {
            if(target) {
                projectiles.push(new Projectile(this.x, this.y, target, this.damage, this.info.color, this.typeKey, this.info.splash, this.level));
                sfx.play('shoot');
            }
        }
    }
    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(0.58, 0.58);
        drawTowerBase(ctx, this.info.color, this.level, this.typeKey === 'energy');

        ctx.save();
        if (this.typeKey !== 'energy' && this.typeKey !== 'slower') {
            ctx.rotate(this.angle);
        } else if (this.typeKey === 'slower' && this.level <= 2) {
            ctx.rotate(this.angle);
        }
        drawTowerTurret(ctx, this.typeKey, this.level, this.info.color, frameCount, this.locked);
        if (this.typeKey === 'energy' && this.absorbPulse > 0) {
            ctx.save();
            ctx.globalAlpha = this.absorbPulse * 0.75;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, 7 + (1 - this.absorbPulse) * 18, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
        ctx.restore();
        ctx.restore();

        if(this.typeKey === 'slower' && this.affected) this.affected.forEach(e => drawLightning(ctx, this.x, this.y, e.x, e.y, '#0ff'));
        if(this.typeKey === 'energy') {
            if (this.affected) {
                const activeBoost = this.energy > 0 && enemies.length > 0;
                this.affected.forEach(t => {
                    ctx.strokeStyle = activeBoost ? 'rgba(0, 255, 204, 0.75)' : 'rgba(160, 0, 255, 0.28)';
                    ctx.lineWidth = activeBoost ? 2.5 : 1.5;
                    ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(t.x, t.y); ctx.stroke();
                });
            }
            // Energy Meter Arc
            const ratio = Math.max(0, Math.min(1, this.energy / this.maxEnergy));
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 23, 0, Math.PI * 2);
            ctx.stroke();
            if (ratio > 0) {
                ctx.strokeStyle = ratio > 0.25 ? '#00ffcc' : '#ffea00';
                ctx.shadowColor = ctx.strokeStyle;
                ctx.shadowBlur = 8;
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 23, -Math.PI * 0.5, -Math.PI * 0.5 + ratio * Math.PI * 2);
                ctx.stroke();
            }
            ctx.restore();
        }
        if (this.buffTimer > 0) {
            ctx.save();
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.6)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 3]);
            ctx.beginPath();
            ctx.arc(this.x, this.y, 22, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
        if (this.laserTime > 0) {
            ctx.restore(); ctx.save();
            ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.laserEnd.x, this.laserEnd.y);
            ctx.strokeStyle = this.locked ? '#fff' : this.info.color; ctx.lineWidth = 2 + this.level; ctx.stroke();
            this.laserTime -= 0.016 * gameSpeed; ctx.restore(); return;
        }
    }
    upgrade() { if(this.level >= 6) return; this.level++; this.damage *= 1.35; this.range *= 1.25; this.cooldownMax *= 0.9; if (this.typeKey === 'energy') this.maxEnergy += 25; if(particlesEnabled) createExplosion(this.x, this.y, '#fff', 30); }
    toggleLock() { if (this.typeKey === 'sniper') { this.locked = !this.locked; floatText.push({x:this.x, y:this.y-20, text: this.locked ? "LOCKED" : "AUTO", color: "#fff", life: 40}); } }
}

class Projectile {
    constructor(x, y, target, damage, color, type, splash, level, angleOverride=null) {
        this.x=x; this.y=y; this.target=target; this.damage=damage; this.color=color; this.type=type; this.splash=splash; this.level=level;
        this.speed=type==='missile'?150:500; 
        this.angle=angleOverride !== null ? angleOverride : Math.random() * 6.28; 
        this.life=3.0; 
    }
    update(dt) {
        this.life -= dt; if(this.life <= 0) { this.dead = true; return; }
        if (this.type === 'missile' && this.target && !this.target.dead) {
            const desired = Math.atan2(this.target.y - this.y, this.target.x - this.x);
            let diff = desired - this.angle; diff = ((diff + Math.PI) % (2 * Math.PI)) - Math.PI; 
            const turnRate = 3 + this.level; // Better turning at higher levels
            this.angle += diff * turnRate * dt * gameSpeed; 
            this.speed += 200 * dt * gameSpeed;
            this.x += Math.cos(this.angle) * this.speed * dt * gameSpeed;
            this.y += Math.sin(this.angle) * this.speed * dt * gameSpeed;
            if (particlesEnabled && Math.random() < 0.3) spawnParticle(this.x, this.y, '#fa0', 0.5);
        } else {
            if (this.target && !this.target.dead) this.angle = Math.atan2(this.target.y - this.y, this.target.x - this.x);
            this.x += Math.cos(this.angle) * this.speed * dt * gameSpeed;
            this.y += Math.sin(this.angle) * this.speed * dt * gameSpeed;
        }
        if(this.x<0 || this.x>width || this.y<0 || this.y>height) this.dead = true;
        const hitR = this.type==='missile' ? 10 : 5;
        for(let e of enemies) { if (Math.hypot(e.x - this.x, e.y - this.y) < e.radius + hitR) { this.hit(e); break; } }
    }
    hit(target) {
        this.dead = true;
        if (this.splash) {
            // Splash Damage Logic
            enemies.forEach(e => { 
                if (Math.hypot(e.x - this.x, e.y - this.y) < this.splash + (this.level*5)) e.takeDamage(this.damage); 
            });
            if(particlesEnabled) { 
                createExplosion(this.x, this.y, '#fa0', 15);
                createHalo(this.x, this.y, '#fa0'); // NEW: Halo Effect
                createShockwave(this.x, this.y, '#fff'); // NEW: Shockwave Effect
            }
            sfx.play('boom');
        } else {
            target.takeDamage(this.damage); if(particlesEnabled) createExplosion(this.x, this.y, this.color, 5);
        }
    }
    draw() {
        ctx.save();
        if (this.type === 'missile') {
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            ctx.strokeStyle = '#fff';
            ctx.fillStyle = this.level >= 3 ? '#fff' : this.color;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 8;
            ctx.lineWidth = 1.5;

            // Rocket body
            ctx.beginPath();
            ctx.moveTo(-6, -2.5);
            ctx.lineTo(4, -2.5);
            ctx.lineTo(8, 0);
            ctx.lineTo(4, 2.5);
            ctx.lineTo(-6, 2.5);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Fins
            ctx.beginPath();
            ctx.moveTo(-6, -2.5); ctx.lineTo(-9, -5); ctx.lineTo(-4, -2.5);
            ctx.moveTo(-6, 2.5);  ctx.lineTo(-9, 5);  ctx.lineTo(-4, 2.5);
            ctx.stroke();

            // Exhaust flame
            ctx.fillStyle = '#ff0';
            ctx.beginPath();
            ctx.moveTo(-6, -1.5);
            ctx.lineTo(-12, 0);
            ctx.lineTo(-6, 1.5);
            ctx.fill();
        } else {
            const glow = getGlowTexture(this.level >= 3 ? '#fff' : this.color, 3.5);
            ctx.drawImage(glow, this.x - glow.width / 2, this.y - glow.height / 2);
        }
        ctx.restore();
    }
}

class Enemy {
    constructor(lvl, wv) {
        if (!pathPoints || pathPoints.length === 0) { this.dead = true; return; }
        this.pathIdx = 0; this.x = pathPoints[0].x; this.y = pathPoints[0].y;
        let spdM=1, hpM=1, r=12, typeColor=0;
        const rand = Math.random();
        if (lvl === 1 && wv < 5) { /* Easy start */ } else {
             if (rand < 0.2) { spdM = 1.6; hpM = 0.5; r = 8; typeColor = 120; }
             else if (rand > 0.85) { spdM = 0.6; hpM = 2.5; r = 16; typeColor = 240; }
        }

        const diffMult = 1 + (lvl * 0.1) + (wv * 0.05);
        this.speed = 90 * diffMult * spdM; 
        
        let baseHp = 20; if (lvl === 1 && wv < 5) baseHp = 10;
        this.maxHp = baseHp * Math.pow(1.15, (lvl-1)*10 + wv) * hpM; 
        this.hp = this.maxHp;
        this.radius = r; this.speedMult = 1; 
        this.color = `hsl(${(lvl*60 + wv*15 + typeColor)%360}, 100%, 50%)`;
        this.sides = 3 + (lvl % 3); this.bounty = Math.max(1, Math.floor(diffMult * 1.5));
        this.finished = false;
    }
    update(dt) {
        if(this.dead || this.finished || !pathPoints.length) return;
        const target = pathPoints[this.pathIdx+1];
        if(!target) { this.finished = true; this.dead = true; return; }
        const dx = target.x - this.x, dy = target.y - this.y;
        const dist = Math.hypot(dx, dy);
        const move = this.speed * this.speedMult * dt * gameSpeed;
        if (dist <= move) {
            this.x = target.x; this.y = target.y; this.pathIdx++;
            if (this.pathIdx >= pathPoints.length - 1) { this.finished = true; this.dead = true; }
        } else {
            this.x += (dx/dist) * move; this.y += (dy/dist) * move;
        }
        this.speedMult = 1;
    }
    takeDamage(amt) { this.hp -= amt; if (this.hp <= 0) this.dead = true; }
    draw() {
        ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(frameCount * 0.1);
        ctx.strokeStyle = this.color; ctx.lineWidth = 2.2;
        ctx.beginPath(); for(let i=0; i<this.sides; i++) { const a = i * 2 * Math.PI / this.sides; ctx.lineTo(Math.cos(a)*this.radius, Math.sin(a)*this.radius); } ctx.closePath(); ctx.stroke();
        const pct = Math.max(0, this.hp / this.maxHp);
        ctx.rotate(-frameCount * 0.1); ctx.fillStyle = '#f00'; ctx.fillRect(-10, -18, 20, 3); ctx.fillStyle = '#0f0'; ctx.fillRect(-10, -18, 20*pct, 3);
        ctx.restore();
    }
}

class Particle {
    constructor() {
        this.x = 0; this.y = 0; this.prevX = 0; this.prevY = 0; this.color = '#fff';
        this.vx = 0; this.vy = 0;
        this.life = 0; this.maxLife = 0;
        this.isEnergy = false;
        this.absorbing = false;
        this.active = false;
    }
    init(x, y, color, lifeScale=1, isEnergy=false) {
        this.x = x; this.y = y; this.prevX = x; this.prevY = y; this.color = color;
        const a = Math.random() * 6.28;
        const s = isEnergy ? (Math.random() * 25 + 10) : (Math.random() * 80 + 20);
        this.vx = Math.cos(a) * s;
        this.vy = Math.sin(a) * s;
        this.maxLife = this.life = (isEnergy ? 1.5 : 0.6) * lifeScale;
        this.isEnergy = isEnergy;
        this.absorbing = false;
        this.active = true;
    }
    update(dt) {
        this.prevX = this.x;
        this.prevY = this.y;
        if (!this.absorbing) {
            this.x += this.vx * dt * gameSpeed;
            this.y += this.vy * dt * gameSpeed;
            this.vx *= 0.92;
            this.vy *= 0.92;
        }
        this.life -= dt * gameSpeed;
        if (this.life <= 0) this.active = false;
    }
    draw() {
        if (!this.active || this.life <= 0) return;
        const alpha = Math.max(0, Math.min(1, this.life / (this.maxLife * 0.35)));
        ctx.globalAlpha = alpha;
        if (this.isEnergy) {
            if (this.absorbing) {
                ctx.strokeStyle = '#d0f';
                ctx.lineWidth = 1.6;
                ctx.beginPath();
                ctx.moveTo(this.prevX, this.prevY);
                ctx.lineTo(this.x, this.y);
                ctx.stroke();
            }
            ctx.fillStyle = '#d0f';
            ctx.beginPath();
            ctx.arc(this.x, this.y, 1.8, 0, 6.2831853);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(this.x, this.y, 0.8, 0, 6.2831853);
            ctx.fill();
        } else {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 1.1, 0, 6.2831853);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }
}

const PARTICLE_POOL_MAX = 350;
const particlePool = [];
for (let i = 0; i < PARTICLE_POOL_MAX; i++) particlePool.push(new Particle());

function spawnParticle(x, y, color, lifeScale=1, isEnergy=false) {
    let p = particlePool.pop();
    if (!p) {
        p = particles.shift();
    }
    p.init(x, y, color, lifeScale, isEnergy);
    particles.push(p);
    return p;
}

function createExplosion(x, y, c, n) {
    const count = Math.min(n, 35);
    for(let i = 0; i < count; i++) spawnParticle(x, y, c, 1, false);
}
function spawnEnergyParticles(x, y) {
    for(let i = 0; i < 3; i++) spawnParticle(x, y, '#d0f', 1, true);
}
function distToSegment(x, y, x1, y1, x2, y2) {
    const A = x - x1; const B = y - y1; const C = x2 - x1; const D = y2 - y1;
    const dot = A * C + B * D; const len_sq = C * C + D * D;
    let param = -1; if (len_sq !== 0) param = dot / len_sq;
    let xx, yy; if (param < 0) { xx = x1; yy = y1; } else if (param > 1) { xx = x2; yy = y2; } else { xx = x1 + param * C; yy = y1 + param * D; }
    return Math.hypot(x - xx, y - yy);
}

// --- DRAW HELPERS ---
function updateBackgroundCache() {
    if (!width || !height) return;
    bgCanvas.width = width;
    bgCanvas.height = height;

    bgCtx.fillStyle = '#050505';
    bgCtx.fillRect(0, 0, width, height);

    bgCtx.save();
    bgCtx.shadowBlur = 4;
    bgCtx.shadowColor = '#0ff';
    bgCtx.strokeStyle = 'rgba(20, 30, 40, 0.45)';
    bgCtx.lineWidth = 1;
    bgCtx.beginPath();
    const gridSize = 40;
    for(let x=0; x<width; x+=gridSize) { bgCtx.moveTo(x,0); bgCtx.lineTo(x,height); }
    for(let y=0; y<height; y+=gridSize) { bgCtx.moveTo(0,y); bgCtx.lineTo(width,y); }
    bgCtx.stroke();
    bgCtx.restore();

    if (drawPathCommands.length) {
        bgCtx.save();
        bgCtx.shadowBlur = 10;
        bgCtx.shadowColor = '#0ff';
        bgCtx.strokeStyle = 'rgba(0, 255, 255, 0.3)';
        bgCtx.lineWidth = 3;
        bgCtx.lineCap = 'round';
        bgCtx.lineJoin = 'round';
        bgCtx.beginPath();
        drawPathCommands.forEach(cmd => {
            if(cmd.type === 'move') bgCtx.moveTo(cmd.x, cmd.y);
            else if(cmd.type === 'line') bgCtx.lineTo(cmd.x, cmd.y);
            else if(cmd.type === 'quad') bgCtx.quadraticCurveTo(cmd.cpx, cmd.cpy, cmd.x, cmd.y);
        });
        bgCtx.stroke();
        bgCtx.restore();
    }
}
function drawBackground() {
    if (bgCanvas.width > 0) ctx.drawImage(bgCanvas, 0, 0);
}
function drawPath() {
    // Static path is baked into bgCanvas
}
function drawEndPoint() {
    const end = pathPoints[pathPoints.length-1];
    if(!end) return;
    ctx.save(); ctx.translate(end.x, end.y); ctx.shadowBlur = 15; ctx.shadowColor = lives > 10 ? '#0f0' : '#f00'; ctx.fillStyle = lives > 10 ? '#0f0' : '#f00'; ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#000'; ctx.font = "bold 12px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(lives, 0, 1); ctx.restore();
}
function drawEntities() {
    ctx.globalCompositeOperation = 'lighter';
    towers.forEach(t => t.draw()); enemies.forEach(e => e.draw()); projectiles.forEach(p => p.draw()); if(particlesEnabled) particles.forEach(p => p.draw());
    ctx.globalCompositeOperation = 'source-over';
    floatText.forEach(t => { ctx.fillStyle = t.color; ctx.font = "bold 12px monospace"; ctx.fillText(t.text, t.x, t.y); });
}
function drawUIOverlay() {
    if (dragState.active) {
        const info = TOWER_TYPES[dragState.type];
        ctx.beginPath(); ctx.arc(dragState.x, dragState.y, info.range, 0, Math.PI*2);
        ctx.fillStyle = dragState.valid ? `rgba(255,255,255,0.1)` : `rgba(255,0,0,0.2)`; ctx.fill();
        ctx.strokeStyle = dragState.valid ? info.color : '#f00'; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = info.color; ctx.beginPath(); ctx.arc(dragState.x, dragState.y, 10, 0, Math.PI*2); ctx.fill();
    }
    if (selectedTower) {
        ctx.beginPath(); ctx.arc(selectedTower.x, selectedTower.y, selectedTower.range, 0, Math.PI*2);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
        if(selectedTower.locked) { ctx.strokeStyle = '#f00'; ctx.setLineDash([2, 2]); ctx.beginPath(); ctx.moveTo(selectedTower.x, selectedTower.y); ctx.lineTo(selectedTower.x + Math.cos(selectedTower.angle)*selectedTower.range, selectedTower.y + Math.sin(selectedTower.angle)*selectedTower.range); ctx.stroke(); ctx.setLineDash([]); }
    }
}

// --- DRAG & UI ---
let dragState = { active: false, type: null, x: 0, y: 0, valid: false };
let selectedTower = null;
let lastClickTime = 0;
let lastTouchTime = 0;

const buildPanel = document.getElementById('buildPanel');
const upgradePanel = document.getElementById('upgradePanel');
const upgTitle = document.getElementById('upgTitle');
const upgCost = document.getElementById('upgCost');
const sellCost = document.getElementById('sellCost');
const btnUpgrade = document.getElementById('btnUpgrade');
const btnLock = document.getElementById('btnLock');

function positionUpgradePopup(tower) {
    if (!tower) return;
    const margin = 8;
    const pw = upgradePanel.offsetWidth || 160;
    const ph = upgradePanel.offsetHeight || 100;

    const topBar = document.getElementById('topBar');
    const bottomBar = document.getElementById('bottomBar');
