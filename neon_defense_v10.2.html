    const topH = (topBar && topBar.offsetHeight) ? topBar.offsetHeight : 100;
    const botH = (bottomBar && bottomBar.offsetHeight) ? bottomBar.offsetHeight : 50;

    const minX = margin;
    const maxX = Math.max(minX, width - pw - margin);
    let minY = topH + margin;
    let maxY = height - botH - ph - margin;
    if (maxY < minY) {
        minY = margin;
        maxY = Math.max(margin, height - ph - margin);
    }

    const offset = 28;
    let x = tower.x + offset;
    if (x + pw > width - margin) {
        x = tower.x - offset - pw;
    }
    x = Math.max(minX, Math.min(maxX, x));

    let y = tower.y - ph * 0.5;
    y = Math.max(minY, Math.min(maxY, y));

    upgradePanel.style.left = `${Math.round(x)}px`;
    upgradePanel.style.top = `${Math.round(y)}px`;
}

function toggleBottomPanel(showUpgrade) {
    if(showUpgrade && selectedTower) {
        positionUpgradePopup(selectedTower);
        upgradePanel.classList.add('active');
    } else {
        upgradePanel.classList.remove('active');
        selectedTower = null;
    }
}

function updateDragState(x, y) {
    dragState.x = x;
    dragState.y = useDragOffset ? y - 60 : y;
    const info = TOWER_TYPES[dragState.type];
    if (!info) return;

    const inSafeY = dragState.y > safeZone.top && dragState.y < safeZone.bottom;
    const hitPath = pathPoints.some((p, i) => i%3===0 && Math.hypot(p.x-dragState.x, p.y-dragState.y) < 20); 
    const hitTower = towers.some(t => Math.hypot(t.x-dragState.x, t.y-dragState.y) < 25);
    dragState.valid = money >= info.cost && !hitTower && !hitPath && inSafeY;
}

document.querySelectorAll('.tower-drag-item').forEach(el => {
    const start = (x, y) => { 
        if(selectedTower) toggleBottomPanel(false);
        dragState.active = true; dragState.type = el.dataset.type; 
        updateDragState(x, y);
    };
    el.addEventListener('mousedown', e => start(e.clientX, e.clientY));
    el.addEventListener('touchstart', e => { e.preventDefault(); start(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
});

const move = (x, y) => {
    if (dragState.active) {
        updateDragState(x, y);
    }
};
window.addEventListener('mousemove', e => move(e.clientX, e.clientY));
window.addEventListener('touchmove', e => { if(dragState.active) e.preventDefault(); move(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
const end = () => {
    if (dragState.active && dragState.valid) {
        money -= TOWER_TYPES[dragState.type].cost;
        towers.push(new Tower(dragState.x, dragState.y, dragState.type));
        sfx.play('shoot');
    }
    dragState.active = false;
};
window.addEventListener('mouseup', end); window.addEventListener('touchend', end);

const handleTap = (x, y) => {
    const topBar = document.getElementById('topBar');
    const bottomBar = document.getElementById('bottomBar');
    const topH = (topBar && topBar.offsetHeight) ? topBar.offsetHeight : 100;
    const botH = (bottomBar && bottomBar.offsetHeight) ? bottomBar.offsetHeight : 50;
    if (y < topH || y > height - botH) return;

    const now = Date.now();
    const t = towers.find(t => Math.hypot(t.x-x, t.y-y) < 30);
    
    if (t) {
        // ALWAYS open menu first (Single Tap)
        selectedTower = t;
        updateUpgradeUI();
        toggleBottomPanel(true);

        // Check for Double Click on Sniper to Toggle
        if (t.typeKey === 'sniper' && now - lastClickTime < 350) {
             t.toggleLock();
             updateUpgradeUI();
        }
        lastClickTime = now;
    } else {
        toggleBottomPanel(false);
    }
};
canvas.addEventListener('mousedown', e => {
    if (Date.now() - lastTouchTime < 500) return; // Ignore synthetic mouse event from mobile touch
    handleTap(e.clientX, e.clientY);
});
canvas.addEventListener('touchstart', e => {
    if(!dragState.active && e.touches.length > 0) {
        lastTouchTime = Date.now();
        handleTap(e.touches[0].clientX, e.touches[0].clientY);
    }
}, {passive: true});

function updateUpgradeUI() {
    if(!selectedTower) return;
    upgTitle.innerText = `${selectedTower.info.name.toUpperCase()} LV.${selectedTower.level}`;
    const c = Math.floor(selectedTower.info.cost * selectedTower.level * 0.8);
    const s = Math.floor(selectedTower.info.cost * 0.5);
    
    // Lock Button Visibility
    const btnLock = document.getElementById('btnLock');
    if(selectedTower.typeKey === 'sniper') {
        btnLock.style.display = 'flex';
        btnLock.innerText = selectedTower.locked ? "UNLOCK" : "LOCK";
        btnLock.className = selectedTower.locked ? "action-btn locked" : "action-btn";
    } else {
        btnLock.style.display = 'none';
    }

    if (money < c || selectedTower.level >= 6) {
        btnUpgrade.classList.add('disabled');
        btnUpgrade.style.opacity = '0.3';
    } else {
        btnUpgrade.classList.remove('disabled');
        btnUpgrade.style.opacity = '1';
    }
    
    upgCost.innerText = selectedTower.level >= 6 ? 'MAX' : `$${c}`;
    sellCost.innerText = `$${s}`;
    positionUpgradePopup(selectedTower);
}

// Lock button handler
document.getElementById('btnLock').onclick = () => {
    if(selectedTower && selectedTower.typeKey === 'sniper') {
        selectedTower.toggleLock();
        updateUpgradeUI();
    }
};

btnUpgrade.onclick = () => {
    if(selectedTower) {
        const cost = Math.floor(selectedTower.info.cost * selectedTower.level * 0.8);
        if(money >= cost && selectedTower.level < 6) {
            money -= cost; selectedTower.upgrade(); updateUpgradeUI();
        }
    }
};
document.getElementById('btnSell').onclick = () => {
    if(selectedTower) {
        money += Math.floor(selectedTower.info.cost * 0.5);
        towers = towers.filter(t => t!==selectedTower);
        createExplosion(selectedTower.x, selectedTower.y, '#fff', 10);
        toggleBottomPanel(false);
    }
};

// --- MAIN ---
function updateUI() {
    document.getElementById('moneyDisplay').innerText = Math.floor(money);
    document.getElementById('scoreDisplay').innerText = Math.floor(score);
    document.getElementById('levelDisplay').innerText = level;
    document.getElementById('waveDisplay').innerText = `${waveCurrent}/${WAVES_PER_LEVEL}`;
    
    // Live update high score in HUD
    const hiEl = document.getElementById('hiScoreDisplay');
    if (hiEl && records[currentDiff]) {
        hiEl.innerText = Math.max(records[currentDiff].score, Math.floor(score));
    }

    document.querySelectorAll('.tower-drag-item').forEach(el => {
        if (money < TOWER_TYPES[el.dataset.type].cost) el.classList.add('disabled'); else el.classList.remove('disabled');
    });
    // Live update upgrade button state
    if(selectedTower) updateUpgradeUI();
}
function onStartGame() {
    document.getElementById('modal').style.display = 'none';
    const summary = document.getElementById('gameSummary');
    if (summary) summary.style.display = 'none';
    createNoiseBuffer();
    startGameSession();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
document.getElementById('startBtn').onclick = onStartGame;
document.getElementById('speedBtn').onclick = (e) => {
    gameSpeed = gameSpeed === 1 ? 2 : 1; e.target.innerText = `x${gameSpeed}`;
};
document.getElementById('pauseBtn').onclick = (e) => {
    isPaused = !isPaused; e.target.classList.toggle('paused');
};
function resetGame() {
    document.getElementById('modal').style.display = 'none';
    document.querySelector('#modal h1').innerText = "NEON DEFENSE";
    const summary = document.getElementById('gameSummary');
    if (summary) summary.style.display = 'none';
    const btn = document.getElementById('startBtn');
    btn.innerText = "INITIALIZE";
    btn.onclick = onStartGame;
    startGameSession();
}
function gameOver() {
    gameActive = false;
    const recResult = checkAndUpdateRecord();
    updateRecordsUI();

    document.getElementById('modal').style.display = 'flex';
    document.querySelector('#modal h1').innerText = "SYSTEM FAILURE";
    
    const summary = document.getElementById('gameSummary');
    if (summary) {
        summary.style.display = 'block';
        summary.innerHTML = `
            <div style="font-size:14px; color:#ff4444; margin-bottom:4px; font-weight:bold;">SECTOR COLLAPSED</div>
            <div style="font-size:12px; color:#ccc; margin-bottom:4px;">DIFF: <span style="color:#0f0;">${currentDiff}</span> | LV: <span style="color:#d0f;">${level}</span> | PTS: <span style="color:#fa0;">${Math.floor(score)}</span></div>
            ${recResult.isNew ? '<div style="font-size:12px; color:#0f0; text-shadow:0 0 10px #0f0; font-weight:bold;">🏆 NEW RECORD SET!</div>' : `<div style="font-size:11px; color:#0cf;">BEST: LV.${recResult.record.level} / ${recResult.record.score} PTS</div>`}
        `;
    }

    const btn = document.getElementById('startBtn');
    btn.innerText = "REBOOT SYSTEM";
    btn.onclick = resetGame;
}

// 1. Force Resize & Render
window.onload = init;
